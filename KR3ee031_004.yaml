body:
  text: 類經附冀卷四附針灸諸賦天元太乙歌先師祕傳神應經太乙通玄法最靈句句言辭多妙典萬兩黃金學也輕切切不忘多效驗治病如神記在心口內將針多溫暖更觀患者審浮沉陰病用陽陽用陰分明更取陰陽神虛則宜補實宜瀉氣應針時病絶根氣至如擺獨龍尾未至停針宜待氣凡用行針先得訣席弘玄妙分明說氣刺兩乳求太淵未應之時針列缺列缺頭疼及偏正重瀉太淵無不應耳聾氣閉喘填胸欲愈須尋三里中手攣腳痹疼難忍合谷仍須瀉太衝曲池主手不如意合谷針時宜仔細心疼手顫少海間欲要除根刺陰市若是傷寒兩耳聾耳門聽會疾如風五般肘痛針尺澤冷淵一刺有神功手三里兮足三里食痞氣塊兼能治鳩尾獨治五般癇若刺湧泉人不死大凡痃痞最宜針穴法須從著意尋以手按痃無轉動隨深隨淺向中心胃中有積取璇璣三里功深人不知陰陵泉主胸中滿若刺承山飲食宜大椎若連長強取小腸氣滿可立愈氣衝妙手要推尋管取神針人見許委中穴主腰疼痛足膝腫時尋至陰乾溼風毒並滯氣玄機如此義尤深氣攻腰痛不能立橫骨大都宜救急留血攻注若醫遲變為風證從此得氣海偏能治五淋補從三里效如神冷熱兩般皆治得便濁痼疾可除根期門穴主傷寒患七日過經猶未汗但於乳下雙肋間刺入四分人得健耳內蟬鳴腰欲折膝下分明三里穴若能補瀉五會中切莫逢人容易說牙風頭痛何所調二間妙穴莫能逃更有三間神妙處能祛肩背感風勞合谷下針順流注脾內迎隨使氣朝冷病還須針合谷又宜腳下瀉陰交背脊俱疼針肩井不瀉三里令人悶兩臂並髀俱疼痛金針一刺如神聖腳疼膝痛委中宜更兼攣急鋒針施陰陵泉穴如尋得健步輕行疾似飛腰腹脹滿治何難三里腨肚針承山更向太衝行補瀉指頭麻木一時安頭痛轉筋魚腹肚背疽便毒相殘苦再有妙穴陽陵泉腿疼筋急如神取腸中疼痛陰陵調耳內蟬鳴聽會招更尋妙穴太溪是此中行瀉最為高腹脹浮沉瀉水分喘粗三里亦須針更從膝下尋陰谷小便淋漓腫自平環跳能除腿股風冷風膝痹瘧皆同最好風池尋的穴間使相隨始見功傷寒一日調風府少陽二穴風池取三五七日病過經依此針之無不應心疼嘔吐上脘宜豐隆兩穴更無疑蛔蟲並出傷寒病金針直刺顯明醫男子痃癖取少商女人血氣陰交當虛汗盜汗須宜補委中妙穴可傳揚項強腫痛屈伸難體重還兼腰背癱束骨更加三里刺教君頃刻便開顏脊因閃挫腰難轉舉動多艱行履顫遊風偏體生虛浮復溜一刺人欣羡久患腰疼背胛勞但尋中渚穴中調行針著意須尋覓管取從今見識高腰背連臍痛不休手中三里穴堪求神針未出急須瀉得氣之時不用留小腹便澼最難醫間使針連氣海宜中極也同三里刺須明補瀉察毫釐玉龍賦相傳扁鵲所撰蓋後人託名為之者夫博參以為約要輯簡而舍繁總玉龍以成賦信金針而獲安原夫卒暴中風頂門百會連延腳氣里絶三交頭風鼻淵上星可取耳聾腮腫聽會偏高攢竹頭維治目疼頭痛乳根俞府療氣嗽痰哮風市陰市驅腿腳之乏力陰陵陽陵除膝腫之難熬膏肓補虛損大敦除疝氣痔漏須尋太白痎瘧當求間使天井醫瘰癧癮疹神門治癲癇失意咳嗽風痰太淵列缺宜刺尫羸喘促璇璣氣海當知期門大敦能治堅痃疝氣勞宮大陵可療心悶瘡痍心悸虛煩刺三里時疫痎瘧尋後溪絶骨三里陰交腳氣宜此睛明太陽魚尾目證宜之老者便多命門兼腎俞著艾婦人乳腫少澤於太陽可推身柱蠲嗽能除膂痛至陽卻疸善治神疲長強承山灸痔最妙豐隆肺俞痰嗽稱奇風門主傷冒寒邪之嗽天樞理感患脾泄之危風池絶骨而療乎傴僂人中曲池可治其痿僕期門刺傷寒未解經不再傳鳩尾針癇癲已發慎其妄施陰交水分三里鼓脹宜刺商丘解溪丘墟腳氣堪追尺澤理筋急之不用腕骨療手腕之難移肩脊痛兮五樞兼於背縫肘攣疼兮尺澤合於曲池風濕摶於兩肩肩髃可療壅熱盛於三焦關衝最宜手臂脛腫中渚液門要辨脾虛黃疸腕骨中腕何疑傷寒無汗攻復溜宜瀉傷寒有汗取合谷當隨欲調飽滿之氣逆三里可勝要起六脈之沉匿復溜稱奇照海支溝通大便之祕內庭臨泣理小腹之䐜天突膻中喘嗽者當覓地倉頰車口喎者宜尋迎香攻鼻窒為最肩井除臂痛難擎二間治牙疼中魁理翻胃而即愈百勞止虛汗通里療心驚而即寧大小骨空治眼爛能止冷淚左右太陽除血翳兩目不明心俞腎俞治腰痛腎虛之夢遺人中委中除腰脊閃痛之難制太溪崑崙申脈最療足腫之迍湧泉關元豐隆為治尸勞之例印堂可治驚搐神庭專理頭風大陵人中頻瀉口氣全去帶脈關元多灸腎敗堪攻腳腿重疼針髖骨膝眼行步艱楚灸三里中封取內關於照海醫腹疼之塊搐迎香於鼻內消眼熱之紅肚疼結閉大陵合外關於支溝腿風濕痛居窖兼環跳於委中上脘中脘治九種之心痛赤帶白帶求中極之異同又若心虛熱壅少衝明其濟奪目昏血溢肝俞辨其實虛慕心傳之玄祕究手法之疾徐或值挫閃疼痛之不定此為難擬俞穴之莫拘輯管見以便讀幸高明無哂諸標幽賦針經指南竇漢卿撰拯救之法妙用者針察歲時於天道定形氣於豫心春夏瘦而刺淺秋冬肥而刺深不窮經絡陰陽多逢刺禁既論臟腑虛實須向經尋原夫起自中焦水下初漏太陰為始至厥陰而方終穴出雲門抵期門而最後正經十二別絡走三百餘支正側偃伏氣血有六百餘候手足三陽手走頭而頭走足手足三陰足在腹而胸走手要識迎隨須明逆順況乎陰陽氣血多少為最厥陰太陽少氣多血太陰少陰少血多氣而又氣多血少者少陽之分氣血俱多者陽明之位先詳多少之宜次察應至之氣輕滑慢而未來沉澀緊而已至既至也量寒熱為疾留未至也據虛實而誘氣氣之至也如魚吞釣餌之浮沉氣未至也如閒處幽堂之深邃氣至速而效速氣至遲而不治觀夫九針之法毫釐最微七星可應衆穴主持本形金也有蠲邪扶正之道短長水也有決凝開滯之機定刺象木或邪或正口藏養火進陽補羸循機捫塞以象土實應五行而可知然是一寸六分包含妙理雖細擬於毫髮同貫多岐可平五臟之寒熱能調六腑之實虛拘攣閉塞追八邪而去矣寒熱痛痹開四關而已之未刺者使本神朝而後入既刺也使本神定而氣隨神不朝而勿刺神已定而可施定腳處取血氣為主意下手處認水火是根基天地人三才也湧泉同璇璣百會上中下三部也大包與天樞地機陽蹺陽維並督脈主肩背腰腿在表之病陰蹺陰維任沖帶去心腹脅肋在裡之疑二陵二蹺二支似續而交五太兩間兩商兩井相依而列兩支取穴之法須明分寸先審自意次觀肉分或屈伸而得之或平直而安定在陽部筋骨之側陷下為真在陰部郤膕之間動脈相應取五穴用一穴而必端取三經用一經而可正頭部與肩部詳分督脈與任脈易定察標與本論刺深刺淺之經住痛移疼取相交相貫之徑豈不聞臟腑病求門海俞募之微經絡滯索原別交會之道更窮四根三結依標本而刺無不痊但用八法五門分主客而針無不效八脈始終連八會本是紀綱十二經絡十二原是為樞要一日取六十六穴之法方見幽微一時取十二經脈之原始知要妙原夫補瀉之法非呼吸而在乎手指速效之功要支正而辨得本經交經繆刺左有病而右畔取瀉絡遠導頭有疾而腳上針巨刺與繆刺各異微針與妙刺相通觀部分而知經絡之虛實視浮沉而見臟腑之寒溫且夫先令針耀而慮針損次臟口內而欲針溫目勿外視手如握虎心無私慕如待貴人左手重而多按欲令氣散右手輕而徐入不痛之因空心恐怯直立側而多暈背目沉掐坐臥平而沒昏椎於十干十變知孔穴之開闔論其五行五臟察時日之旺衰伏如橫弩應若發機陰交陽別而定血暈陰蹺陰維而下胎衣痹厥偏枯迎隨俾經絡接續漏崩帶下溫補使氣血依歸靜以久留停針待之必准處取照海治喉中之閉塞端的處用大鐘治心內之呆癡大抵疼痛實瀉癢麻虛補體重節痛而俞居心下痞滿而井主心脹咽痛針太衝而必除脾冷胃疼瀉公孫而立愈胸滿腹痛刺內關脅疼肋脹針飛虎筋攣骨痛補魂門體熱勞嗽瀉魄戶頭風頭痛刺申脈與金門眼癢眼疼瀉光明於地五瀉陰郤止盜汗治小兒骨蒸刺偏歷利小便醫大人水蠱中風環跳宜刺虛損天樞可取由是午前卯後太陰生而疾溫離左酉南月朔死而速冷循摸彈弩留吸母而堅長爪下伸提疾呼子而噓短動退空歇迎奪右而瀉涼推內進搓隨濟左而補暖大凡危疾色脈不順者莫針寒熱風陰飢飽醉勞須切忌望不補而晦不瀉弦不奪而朔不濟精其心而窮其法無灸艾而壞其中正其理而求其原免投針而失其位避灸處和四肢四十有七禁刺處除六輸二十有二昔聞高皇抱疾未瘥李氏刺巨闕而復蘇太子暴死為厥越人針會維而復醒肩井曲池甄權刺臂痛而即射懸鐘環跳華他刺躄足而立行秋夫針腰俞而魂免沉疴王纂刺交俞而妖精立出取肝俞與命門使瞽者見秋毫之末刺少陽與交別俾聾夫聽夏蚋之聲嗟夫去聖愈遠此道漸墜或不得意而散其學或幸其能而犯禁忌庸愚知淺難契於玄微至道淵深得之者有幾通玄指要賦衛生寶鑑必欲治病莫如用針巧運神機之妙功開聖理之深外取砭針能蠲邪而輔正中含水火善回陽而倒陰原夫絡別支殊經交錯綜或溝渠溪谷以岐異或山海丘陵而隙共斯流派以難暌在條綱而出衆理繁而昧縱補瀉以何功法捷而明自迎隨而得用且如步履難移太衝最奇人中除脊膂之強痛神門去心性之呆癡風傷項急始求於風府頭暈目眩要覓於風池耳閉須聽會而治也眼疼則合谷以推之胸結身黃刺湧泉而即可頭昏目赤瀉攢竹以便宜若兩肘之拘攣仗曲池而平掃牙齒痛太溪堪治頸項強承漿可保太白宣導於氣衝陰陵開通於水道腹䐜而脹奪內庭以休遲筋轉而疼瀉承山之在早大抵腳腕痛崑崙可愈胻膝疼陰市能醫癇發癲狂兮憑後溪而料理瘧生寒熱兮仗間使以扶持期門退胸滿血膨而可止勞宮去胃翻心痛以何疑稽夫大敦除七疝之偏疼王公謂此三里卻五勞之羸瘦華他言之腕骨祛黃然谷瀉腎行間治膝腫腰疼尺澤去肘疼筋緊目昏不見二間宜求鼻窒無聞迎香可引肩井除兩臂痛不勝絲竹空療偏頭疼難忍咳嗽寒痰列缺堪憑眵䁾冷淚臨泣尤准髖骨將腿痛以祛殘腎俞把腰疼而瀉盡越人治尸厥於會維隨手而蘇文伯瀉死胎於三陰應針而隕所謂諸痛為實諸麻曰虛實則自外而入也虛則自內而出諸是故濟母而裨其不足奪子而平其有餘觀二十七之經絡一一能辨據四百四之疾證件件皆除故必使夭枉皆無躋斯民於壽域幾微以判彰往古之玄書又聞心胸病求掌後之大陵肩背痛責肘前之三里冷痹腎余取足陽明之土臍連腹痛瀉足少陰之水脊間心後者針中渚而立痊脅下肋邊者刺陽陵而即止頭項痛擬後溪以安然腰腳疼在委中而已矣靈光賦針灸大全黃帝岐伯針灸訣依他經里分明說三陰三陽十二經更有兩經分八脈靈光典注極幽深偏正頭疼瀉列缺睛明治目胬肉攀耳聾氣痞聽會間兩鼻鼻翁衄針禾髎鼻窒不聞迎香專滯氣上壅足三里天突宛中治喘痰心疼手顫針少海少澤應除心下寒兩足拘攣覓陰市五般腰痛委中安髀樞疼痛瀉丘墟復溜治腫如神驅犢鼻療治風邪濕住喘腳氣崑崙愈後跟痛在僕參求轉筋久痔承山居足掌下去尋湧泉妙法千金莫妄傳此穴多治婦人疾男蠱女孕兩能痊百會龜尾治痢疾大小腸俞大小便氣海血海療五淋中脘下脘治腹堅傷寒過經期門愈氣刺兩乳求太淵大敦二穴主偏墜水溝間使治邪癲吐血定喘補尺澤地倉能止口流涎勞宮醫得身勞倦水腫水分灸即安五指不使中渚取頰車可針牙齒愈陰蹺陽蹺兩踝邊腳氣四穴先尋取陰陽陵泉亦主之陰陽二蹺和三里諸穴一般治腳氣在要玄機宜正取膏肓豈止治百病灸得精良病俱愈針灸一穴數病除學者允宜加仔細悟得明師流注法頭目病兮針四肢針分補瀉明呼吸穴應五行順四時欲解人身中造化此歌端的是筌蹄席弘賦針灸大全凡欲行針須審穴要明補瀉迎隨訣胸背左右不相同呼吸陰陽男女別氣刺兩乳求太洲未應之時瀉列缺列缺頭痛及偏正重瀉太淵無不應耳聾氣痞聽會針迎香穴瀉功如神誰知天突治喉風虛喘須尋三里中手連肩脊痛難忍合谷針時又太衝曲池兩手不如意合谷下針宜仔細心疼手顫少海間若要除根覓陰市但患傷寒兩耳聾耳門聽會疾如風五般肘痛尋尺澤冷淵針後卻收功手足上下針三里食癖氣塊憑此取鳩尾能治五般癇若下湧泉人不死胃中有積刺璇璣三里功多人不知陰陵泉治心胸滿針到承山飲食思大杼若連長強尋小腸氣痛即行針委中專治腰間痛腳膝腫時尋至陰氣滯腰疼不能立橫骨大都堪救急氣海專能治五淋更針三里隨呼吸期門穴主傷寒患七日過經猶未汗但向乳根二肋間又治婦人生産難耳內蟬鳴腰欲折膝下明存三里穴若能補瀉五會間且莫向人容易說睛明治眼未效時合谷光明安可缺人中治癲功最高十三鬼穴不須饒水腫水分兼氣海皮內隨針氣自消冷嗽先宜補合谷卻有針瀉三陰交牙痛腰疼並喉痹二間陽溪疾怎逃更有三間腎俞妙善除肩背浮風勞若針肩井須三里不刺之時氣未調最是陽陵泉一穴膝間疼痛用針燒委中腰痛腳攣急取得其經血自調腳疼膝腫針三里懸鐘二陵三陰交更向太衝須引氣指頭麻木自輕飄轉筋目眩針魚際承山崑崙立便消肚疼須是公孫妙內關相應如吹毛冷風冷痹疾難愈環跳腰俞針用燒風府風池尋得到傷寒百病絶根苗陽明二日尋風府嘔吐休言上脘遙婦人心痛豐隆穴男子癥痃三里高小便不禁關元好大便閉澀大敦燒腕骨腿疼三里瀉復溜氣滯便離腰從來風府最難針須用工夫度淺深倘尚膀胱氣未散更宜三里穴中尋若逢七疝和陰痛陰交照海曲泉針仍不應時求氣海關元同瀉更如神小腸氣結痛連臍速瀉陰交莫待遲良久湧泉針取氣此中玄妙豈人知小兒脫肛患多時先灸百會次尾骶久患傷寒肩背痛但針中渚得其宜肩上痛連臍不休手中三里更須求下針麻重即須瀉得氣之時不用留腰連胯痛勢必大急於三里攻其隘下針一瀉三補之氣上攻噎只管在噎不住時氣海灸定瀉一時立便瘥補自卯南轉針高瀉從卯北莫辭勞逼針瀉氣須令吸若補隨呼氣自調左右拈針隨子午抽針行氣自迢迢用針補瀉分明說更用搜窮本與標咽喉最急先百會太衝照海及陰交學者潛心宜熟讀席弘治病最名高百證賦百證俞穴再三用心囟會連於玉枕頭風療以金針懸顱頷厭之中偏頭痛止強間豐隆之際頭痛難禁原夫面腫虛浮須仗水溝前項耳聾氣閉全憑聽會翳風面上蟲行有驗迎香可取耳中蟬噪有聲聽會堪攻目眩兮支正飛揚目黃兮陽綱膽俞攀睛攻少澤肝俞之所淚出刺臨泣頭維之處眼中漠漠即尋攢行三間目視䀮䀮急取養老天柱雀目肝氣睛明行間而細推項強傷寒溫溜期門而可主廉泉中衝舌下腫痛堪取天府合谷鼻中衄血宜追耳門絲竹空治牙疼於頃刻頰車地倉穴正口喎於片時喉痛兮液門魚際可療轉筋兮金門丘墟所醫陽谷俠溪頷腫口噤並治少商曲澤血虛口渴同施通天去鼻內無聞之苦復溜祛舌乾口燥之悲啞門關衝舌緩不言為要緊天鼎間使失音囁嚅之休遲太衝瀉唇吻以速愈承漿住牙疼而即移項強多惡風束骨相連於天柱熱病汗不出大都更接於經渠且如兩臂頑麻少海就旁於三里半身不遂陽陵遠達於曲池建里內關掃盡胸中之苦悶聽宮脾俞祛殘心下之悲悽久知脅肋痛疼氣戶華蓋有驗腸鳴腹內下脘陷谷能平膈疼蓄飲難禁巨闕膻中宜取胸脅肢滿可療章門不用細尋痞滿更加噎塞中府意舍施治胸膈停留瘀血腎俞巨髎當行膈滿項強神藏璇璣已試背連腰痛白環委中曾經脊強兮水道筋刺目瞤兮顴窖大迎痓病非顱息不愈臍風必然谷方醒委陽天池腋腫針而即散後溪環跳腿痛刺之即輕夢魘不寧厲兌相諧於隱白發狂奔走上脘同起於神門驚悸怔忡取陽溪解溪勿誤反張悲哭仗天衝大橫須精癲疾必身柱本神之令發熱仗少衝曲池之津歲熱時行陶道復求中膂治風癇常發神道還須心俞寧濕熱濕寒下髎定厥寒厥熱湧泉清寒栗惡寒二間疏通陰郤善煩心嘔吐幽門開徹玉堂明行間湧泉主消渴之腎竭陰陵水分去水腫之臍盈勞瘵傳尸趨魄戶膏肓之路中邪霍亂尋陰交三里之程治疸消黃向後溪勞宮而看倦言嗜臥往通里大鐘而行咳嗽連聲肺俞須迎天突穴小便赤澀兌端獨瀉太陽經刺長強與承山善主腸風新下血針三陰與氣海專司白濁久遺精且如肓俞橫骨瀉五淋之久積陰郤後溪治盜汗之多出脾虛谷以不消脾俞膀胱俞覓胃冷食而難化魂門胃俞堪責鼻痔必取齦交癭氣須求浮白大敦照海患寒證而善蠲五里臂臑生癧瘡而能愈至陰屋翳治遍身風癢之疼多肩髃陽溪消肌腠癮風之熱極婦人經事改常自有地機血海女子少氣漏血不無交信合陽帶下産崩衝門氣衝宜審月潮違限天樞水泉細詳肩井乳癰而極效商丘痔漏而尤良脫肛趨百會尾骶之所無子收陰交石關之鄉中脘主乎積利外丘收乎大腸寒瘧兮商陽太溪驗痃癖兮衝門血海強夫醫乃人之司命非智士而莫為針又理之玄微須至人之指教先究其病原後詳其穴道隨手見功應針取效長桑君天星祕訣天星祕訣少人知此法專分前後施若是胃中停宿食後尋三里起璇璣脾病血氣先合谷後刺三陰交莫遲如中鬼邪先間使手臂攣痛取肩髃腳若轉筋並眼花先針承山次內踝腳氣痠疼肩井先次尋三里陽陵泉如是連臍小腸痛先刺陰陵後湧泉耳鳴腰痛先五會次針耳門三里內小腸氣痛先長強後刺大敦不要忙足緩難行先絶骨再尋條口及衝陽牙疼頭痛兼喉痹先刺二間後三里胸膈痞滿先陰交針刺承山飲食喜肚腹浮腫脹膨膨先針水分瀉建里傷寒過經不出汗期門三里先後看寒瘧面腫及腸鳴先取合谷後內庭冷風濕痹針何處先取環跳次陽陵指疼攣急少商好依法施之無不靈此是長桑真口訣時醫莫作等閒輕四總穴肚腹三里留腰背委中求頭項尋列缺面口合谷收千金十一穴三里內庭穴肚腹中妙訣曲池與合谷頭疼病可徹腰背痛相連委中崑崙穴胸項如有痛後溪並列缺環跳與陽陵膝前兼腋脅可補即遲留當瀉即疏泄百而三百六不離十一訣馬丹陽天星十二穴三里內庭穴曲池合谷徹委中配承山太衝崑崙穴環跳與陽陵通里並列缺合擔用法擔合捷用法捷三百六十穴不出十二訣治病有神靈渾如湯潑雪北斗降真機金鎖教開徹至人可傳授匪才休浪說
