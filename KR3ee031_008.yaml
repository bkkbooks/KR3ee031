body:
  text: 卷八經絡六足少陽膽經穴膽經穴歌足少陽經瞳子髎四十三穴行迢迢聽會客主頷厭集懸顱懸釐曲鬢翹率谷天衝浮白次竅陰完骨本神至陽白臨泣開目窗正營承靈腦空是風池肩井淵腋長輒筋日月京門鄉帶脈五樞維道續居髎環跳下中瀆陽關陽陵復陽交外丘光明陽輔高懸鐘丘墟足臨泣地五俠溪竅陰畢瞳子髎一名太陽一名前關在目外去眥五分手太陽手足少陽三脈之會刺三分灸三壯主治頭痛目癢外眥赤痛翳膜青盲遠視䀮䀮淚出多眵一云兼少澤能治婦人乳腫聽會一名聽河一名後關在耳前陷中客主人下一寸動脈宛宛中去耳珠下開口有空側臥張口取之刺四分灸三壯主治耳聾耳鳴牙車脫臼齒痛中風瘛瘲喎斜玉龍賦云治耳聾腮腫席弘賦云耳聾針聽會更瀉迎香功如神又云兼金門治傷寒兩耳聾百證賦云兼翳風治耳聾氣閉客主人一名上關在耳前起骨上廉開口有空側臥張口取之手足少陽足陽明三脈之會本輸篇曰刺之則呿不能欠者即此穴刺一分留七呼灸三壯甲乙經曰刺太深令人耳無聞一曰禁刺一曰刺上關不得深下關不得久主治口眼偏斜耳聾耳鳴聤耳目眩齒痛瘛瘲口噤不能嚼物頷厭在耳前曲角顳顬上廉即腦空之上手足少陽足陽明之會刺三分留七呼灸三壯氣府論注曰刺深令人耳無所聞主治頭風偏頭頸項俱痛目眩耳鳴多嚏驚癇歷節風汗出百證賦云兼懸顱治偏頭痛懸顱在耳前曲角上顳顬之中寒熱病篇曰足陽明有挾鼻入於面者名曰懸顱是此為足少陽陽明之會故氣府論注為足陽明脈氣所發刺三分留三呼灸三壯主治頭痛齒痛偏頭痛引目熱病汗不出百證賦云兼頷厭治偏頭痛懸釐在耳前曲角上顳顬下廉手足少陽陽明四脈之會刺三分留七呼灸三壯主治偏頭痛面腫目鋭眥痛熱病煩心汗不出曲鬢在耳上入髮際曲隅陷中鼓頷有空足太陽少陽之會刺三分灸三壯主治頷頰腫引牙車不得開口噤難言項強不得顧頭角痛巔風目眇率谷在耳上入髮際一寸半陷中嚼牙取之足太陽少陽之會刺三分灸三壯主治腦病兩頭角痛胃膈寒痰煩悶嘔吐酒後皮風膚腫神農經云治頭風兩角疼痛可灸三壯至五壯小兒急慢驚風灸三壯炷如小麥天衝在耳後入髮際二寸一曰在耳上如前三分足太陽少陽之會刺三分灸三壯主治癲疾風痙牙齦腫驚恐頭痛百證賦云兼大橫治反張悲哭浮白在耳後入髮際一寸足太陽少陽之會刺三分灸三壯主治咳逆胸滿喉痹耳聾齒痛項癭痰沫不得喘息肩臂不舉足不能行百證賦云專治癭氣一傳治眼目四時疼痛頭風痛竅陰一名枕骨在完骨上枕骨下搖動有空足少陽太陽之會刺三分灸三壯主治四肢轉筋目痛頭項痛耳鳴癰疽發熱手足煩熱汗不出咳逆喉痹舌強脅痛口苦完骨在耳後入髮際四分足太陽少陽之會刺三分留七呼灸三壯主治頭痛頭風耳鳴齒齲牙車急口眼喎斜喉痹頰腫癭疾便赤足痿不收本神在曲差旁一寸五分一曰直耳上入髮際四分足少陽陽維之會刺三分灸七壯主治驚癇吐沫目眩項強急痛胸脅相引不得轉側偏風癲疾百證賦云兼身柱治癲疾效陽白在眉上一寸直瞳子甲乙經曰足少陽陽維之會氣府論王氏注曰足陽明陰維二脈之會刺二分灸三壯主治頭痛目昏多眵背寒栗重衣不得溫臨泣在目上直入髮際五分陷中正睛取之足太陽少陽陽維三脈之會刺三分留七呼灸七壯一曰禁灸主治鼻塞目眩生翳眵䁾冷淚眼目諸疾驚癇反視卒暴中風不識人脅下痛瘧疾日西發百證賦云兼頭維可治目中淚出目窗一名至榮在臨泣後一寸足少陽陽維之會刺三分灸五壯主治頭目眩痛引外眥遠視不明面腫寒熱汗不出正營在目窗後一寸足少陽陽維之會刺三分灸三壯主治頭痛目眩齒齲痛唇吻強急承靈在正營後一寸五分足少陽陽維之會刺三分灸五壯一曰禁針主治腦風頭痛惡風鼻窒不通腦空一名顳顬在承靈後一寸五分夾玉枕骨下陷中氣府論王氏注曰夾枕骨後枕骨上足少陽陽維之會刺四分灸五壯主治勞瘵身熱羸瘦腦風頭痛不可忍項強不得顧目瞑鼻衄耳聾驚悸癲風引目眇鼻痛昔魏公苦患頭風發即心亂目眩華他刺此立愈風池在耳後顳顬後腦空下髮際陷中按之引耳一云耳後陷中後髮際大筋外廉足少陽陽維之會刺四分灸三壯七壯炷不用大主治中風偏正頭痛傷寒熱病汗不出痃瘧頸項如拔痛不得回目眩赤痛淚出鼽衄耳聾腰背俱痛傴僂引項筋力不收腳弱無力千金云治癭氣灸百壯太乙歌云兼環跳間使治瘧疾又云兼風府取之治傷寒玉龍賦云兼絶骨可療傴僂席弘賦云尋到風府風池治傷寒百病通玄賦云頭暈目眩覓風池捷徑云治溫病煩滿汗不出一傳治中風不語牙關緊閉湯水不能入口肩井一名膊井在肩上陷解中缺盆上大骨前一寸半以三指按取之當中指下陷者中手足少陽足陽明陽維之會刺五分灸三壯孕婦禁針一曰此足陽明之會連五臟氣若刺深令人悶倒速補三里須臾平復凡針肩井者皆以三里下其氣一曰此臟氣所聚之處不宜補主治中風氣塞涎上不語氣逆五勞七傷頭項頸痛臂不能舉或因撲傷腰痛腳氣上攻若婦人難産墜胎後手足厥逆針之立愈若灸更勝千金云凡産難針兩肩井一寸瀉之須臾即生又云臂重不舉灸隨年壯至百壯刺五分補之又治卒忤灸百壯又治上氣咳逆短氣風勞百病灸二百壯又灸㿗疝隨年壯席弘賦云針肩井須針三里方可使氣調百證賦云治乳癰極效通玄賦云除兩臂之不勝標幽賦云兼曲池甄權刺臂痛而復射天星祕訣云兼三里陽陵治腳氣痠痛淵腋一名泉腋在腋下三寸宛宛中舉臂取之刺三分禁灸灸之不幸生腫蝕馬刀瘍內潰者死主治寒熱馬刀瘍胸滿無力臂不舉輒筋在腋下三寸復前行一寸著脅刺六分灸三壯主治太息多唾善悲言語不正四肢不收嘔吐宿汁吞酸胸中暴滿不得臥日月一名神光在期門下五分氣府論注曰在第三肋端橫直心蔽骨旁各同身寸之二寸五分上直兩乳膽之募也足太陰少陽陽維之會刺七分灸五壯主治太息善悲小腹熱欲走多唾言語不正四肢不收千金云嘔吐宿汁吞酸灸神光百壯三報之京門一名氣俞一名氣府在監骨腰中季脅本夾脊一云在臍上五分旁九寸半季肋本夾脊倒臥屈上足伸下足舉臂取之腎之募也刺三分留七呼灸三壯一云刺八分主治腸鳴洞泄水道不利少腹急痛寒熱䐜脹肩背腰髀引痛不得俯仰久立帶脈在季脅下一寸八分陷中一云在臍旁八寸半肥人九寸瘦人八寸如帶繞身管束諸經足少陽帶脈之會刺六分灸五壯主治腰腹縱水狀婦人小腹痛急瘛瘲月經不調帶下赤白兩脅氣引背痛玉龍賦云合關元多灸堪攻腎敗五樞在帶脈下三寸一曰在水道旁一寸半陷中足少陽帶脈之會刺一寸灸五壯主治痃癖小腸膀胱氣攻兩脅小腹痛腰腿痛陰疝睪丸上入腹婦人赤白帶下玉龍賦云兼背縫治肩脊痛維道一名外樞在章門下五寸三分一曰在中極旁八寸五分足少陽帶脈之會刺八分灸三壯主治嘔逆不止三焦不調不食水腫居髎在章門下八寸三分監骨上陷中足少陽陽蹺之會刺八分灸三壯主治肩引胸臂攣急不得舉腰引小腹痛玉龍賦云兼環跳委中治腿風濕痛環跳在髀樞中側臥伸下足屈上足取之足少陽太陽之會刺一寸留十呼灸三壯甲乙經云留二十呼灸五十壯主治冷風濕痹不仁胸脅相引半身不遂腰胯痠痛膝不得伸遍身風疹太乙歌云兼風池間使能除冷風膝痹並瘧疾玉龍賦云兼居髎委中治腿風濕痛天星祕訣云兼陽陵治冷風濕痹百證賦云兼後溪刺腿痛標幽賦云中風宜刺此又云華他兼絶骨刺躄足而立行席弘賦云兼腰俞用燒針治冷風冷痹千金十一穴云兼陽陵治膝間並腋脅病馬丹陽天星十二穴云能針偏廢軀折腰莫能顧冷風並濕痹身體似繩拘腿胯連腨痛屈轉重欷吁若人能針灸頃刻病消除增治法云治偏風半身不遂胸脅相引急痛不能屈伸中瀆在髀骨外膝上五寸分肉間陷中足少陽絡別走厥陰刺五分留七呼灸五壯主治寒氣客於分肉間攻痛上下筋痹不仁陽關在陽陵泉上三寸犢鼻外陷中刺五分禁灸主治風痹不仁股膝冷痛不可屈伸陽陵泉在膝下一寸外廉陷中尖骨前筋骨間蹲坐取之足少陽所入為合為筋之會刺六分留十呼灸七壯至七七壯主治偏風半身不遂足膝冷痹不仁無血色腳氣筋攣神農經云治足膝冷痹不仁屈伸不得半身不遂脅肋疼痛可灸十四壯至二十一壯玉龍賦云兼陰陵驅膝腫之難消席弘賦云專治膝間疼痛宜用針燒又云腳痛膝腫針三里又須絶骨二陵三陰交更兼太衝以行氣百證賦云遠達曲池治半身不遂通玄賦云治脅下肋邊疾天星祕訣云兼環跳治冷風濕痹又云兼肩井三里治腳氣痠痛千金十一穴云環跳與陽陵治膝前兼腋脅病馬丹陽天星十二穴云治膝腫並麻木冷痹及偏風起坐腰背重面腫滿胸中舉足不能起坐臥似衰翁刺入六分止神功妙不同增治法云治筋軟筋縮筋疼寒熱頭疼口舌咽喉中及頭面腫胸脅脹滿心中怵惕此為筋會故治筋病陽交一名別陽一名足髎在足外踝上七寸斜屬三陽分肉間陽維之郤刺六分留七呼灸三壯主治胸滿喉痹膝痛足不仁寒厥驚狂面腫外丘在外踝上七寸甲乙經曰足少陽郤刺三分灸三壯主治頸項痛胸滿痿痹癲風惡犬傷毒不出百證賦云能收大腸光明在外踝上五寸足少陽絡別走厥陰刺六分留七呼灸五壯主治熱病汗不出卒狂齧頰淫濼脛胻痛不能久立虛則痿痹偏細坐不能起實則足胻熱膝痛身體不仁席弘賦云睛明治眼未效時合谷光明不可缺標幽賦云兼地五會治眼癢痛陽輔一名分肉在足外踝上除骨四寸輔骨前絶骨端如前三分刺腰痛篇注曰如後二分去丘墟七寸筋肉分間氣穴論注曰陽維脈氣所發足少陽所行為經刺三分留七呼灸三壯主治腰溶溶如水浸膝下膚腫筋攣百節痠疼痿痹馬刀厥逆頭項痛喉痹汗不出及汗出振寒痎瘧腰胻痠痛不能行立神農經云治膝胻痠疼偏風不隨可灸十四壯懸鐘一名絶骨在足外踝上三寸當骨尖前動脈中尋按取之針灸經曰尋摸尖骨者乃是絶骨兩分開為足三陽之大絡按之陽明脈絶乃取之為髓之會刺六分留七呼灸五壯主治心腹脹滿胃熱不食喉痹咳逆頭疽中風虛勞頸項痛手足不收腰膝痛腳氣筋骨攣玉龍賦云兼三里陰交治連延腳氣又云兼風池療傴僂席弘賦云腳氣膝腫針三里又須此穴兼二陵三陰交及太衝行氣標幽賦云兼環跳華他刺躄足而立行天星祕訣云兼條口衝陽治足緩難行丘墟在足外踝下如前陷中去臨泣三寸足少陽所過為原刺五分留七呼灸三壯主治胸脅滿痛不得息寒熱目生翳膜頸腫久瘧振寒痿厥腰腿痠痛髀樞中痛轉筋足脛偏細小腹堅卒疝神農經云治肋下疼不得息小腹腎痛腳腕疼可灸七壯玉龍賦云兼商丘解溪堪追腳痛靈光賦云髀樞疼痛瀉丘墟百證賦云兼金門能醫轉筋臨泣在足小指次指本節後間陷中去俠溪一寸五分足少陽所注為腧刺二分留五呼灸三壯主治胸滿氣喘目眩心痛缺盆中及腋下馬刀瘍痹痛無常厥逆痎瘧日西發者淫濼胻酸灑淅振寒婦人月經不利季脅支滿乳癰一云木有餘者宜瀉此或兼陽輔使火虛而木自平千金云頸漏腋下馬刀灸百壯玉龍賦云兼內庭能理小腹之䐜捷法云治足跗腫痛不消手足麻痹不知痛庠手足顫掉不能握物行動手足指拘攣疼痛足心足踝足跗膝胻發熱或為紅腫兩手發熱臂膊痛連肩背腰脊腿胯疼痛白虎歷節走注遊風疼痛浮風渾身瘙癢頭項紅腫強痛腎虛挫閃腰痛舉動艱難諸虛百損濕滯四肢行動無力脅下肝積氣塊刺痛以上諸證先以臨泣為主後隨證分穴治之地五會在足小指次指本節後陷中去俠溪一寸刺一分禁灸甲乙經曰灸之令人瘦不出三年死主治腋痛內損吐血足外無膏脂乳癰席弘賦云兼三里治耳內蟬鳴腰欲折標幽賦云兼光明治眼癢眼疼天星祕訣云耳內蟬鳴先五會次針耳門三里內俠溪在足小指次指本節前岐骨間陷中足少陽所溜為滎刺三分留三呼灸三壯主治胸脅支滿寒熱病汗不出目赤頷腫胸痛耳聾百證賦云兼陽谷治頷腫口噤竅陰在足小指次指端去爪甲如韭葉足少陽所出為井刺一分留三呼灸三壯主治脅痛咳逆不得息手足煩熱汗不出癰疽口乾頭痛喉痹舌強耳聾轉筋肘不能舉足厥陰肝經穴肝經穴歌足厥陰經一十四大敦行間太衝是中封蠡溝伴中都膝關曲泉陰包次五里陰廉上急脈章門才過期門至大敦在足大指端去爪甲如韭葉及三毛中一云內側為隱白外側為大敦足厥陰所出為井刺二分留十呼灸三壯主治卒心痛汗出腹脹腫滿中熱喜寐五淋七疝小便頻數不禁陰痛引小腹陰挺出血崩尸厥如死病左取右病右取左孕婦産前産後皆不宜灸一云凡疝氣腹脹足腫者皆宜灸之以泄肝木而脾胃之土自安玉龍賦云兼期門能治堅痃疝氣千金云大便難灸四壯又治五淋灸三十壯又失尿不禁灸七壯小兒灸一壯又尿血灸隨年壯席弘賦云大便祕結宜燒此百證賦云兼照海善蠲寒證通玄賦云能除七疝之偏墜天星祕訣云兼長強治小腸氣痛乾坤生意云兼三陰交治小腸氣痛又治一切冷氣連臍腹結痛小便遺溺行間在足大指間動脈應手陷中一云在足大指次指歧骨間上下有筋前後有小骨尖其穴正居陷中有動脈應手足厥陰所溜為滎刺三分留十呼灸三壯主治嘔逆咳血心胸痛腹脅脹色蒼蒼如死狀終日不得息中風口喎四逆嗌乾煩渴瞑不欲視目中淚出太息癲疾短氣肝積肥氣痎瘧洞泄遺尿癃閉崩漏白濁寒疝少腹腫腰痛不可俯仰小兒驚風一曰主便赤溺難白濁胸背心腹脹痛瀉行間火而熱自清木氣自下神農經云治小腹脹心疼寒濕肺氣可灸七壯千金云小兒重舌灸行間隨年壯又莖中痛灸五十壯又失尿不禁灸七壯百證賦云兼睛明可治雀目汗氣又云兼湧泉療消渴通玄賦云治膝腫腰疼捷法云兼膻中水分關元三里三陰交治血蠱太衝在足大指本節後二寸一云一寸五分內間陷者中動脈應手一云在足大指本節後行間上二寸內間有絡亙連至地五會二寸骨罅間動脈應手陷中足厥陰所注為腧即原也刺三分留十呼灸三壯主治虛勞嘔血恐懼氣不足嘔逆發寒肝瘧令人腰痛嗌乾胸脅支滿太息浮腫小腹滿腰引少腹痛足寒或大小便難陰痛遺溺溏泄小便淋癃小腹疝氣腋下馬刀瘍瘻胻酸踝痛女子月水不通或漏血不止小兒卒疝神農經云治寒濕腳氣痛行步難可灸三壯千金云産後出汗不止刺太衝急補之又云凡上氣冷發嘔逆不食腹中雷鳴不限壯數從痛灸至不痛止炷如雀矢又治氣短下氣灸五十壯此穴並主肺痿又治不得尿灸五十壯又治虛勞浮腫灸百壯席弘賦云兼合谷治並連肩脊痛難忍又兼百會照海陰交治咽喉疾又治腳痛膝腫針三里懸鐘三陰交二陵更向太衝引氣標幽賦云能除心脹咽痛通玄賦云治行步難移最奇馬丹陽天星十二穴云能治生死病能醫驚癇風咽喉並心脹兩足不能動七疝偏墜腫眼目似云蒙亦能療腰痛針下有神功中封一名懸泉在足內踝前一寸筋里宛宛中一云在內踝前一寸斜行小脈上貼足腕上大筋陷中仰足取之足厥陰所行為經刺四分留七呼灸三壯千金云五十壯主治痎瘧色蒼蒼然善太息如將死狀振寒溲白大便難小腹腫痛五淋足厥冷不嗜食身體不仁寒疝痿厥筋攣失精陰縮入腹相引痛或身微熱一云能止汗出千金云夢泄遺精陰縮灸五十壯又治五淋不得尿灸二七壯又治鼓脹灸二百壯又治癭氣灸隨年壯玉龍賦云合三里治行步艱楚蠡溝一名交儀在足內踝上五寸足厥陰絡別走少陽刺二分留三呼灸三壯主治疝痛小腹滿痛癃閉臍下積氣如石數噫恐悸少氣足脛寒酸屈伸難腰背拘急不可俯仰月經不調溺下赤白中都一名中郤在足內踝上七寸當胻骨中與少陰相直足厥陰郤刺三分留六呼灸五壯主治腸癖㿉疝小腹痛濕痹足熱脛寒不能行立婦人崩中産後惡露不絶膝關在犢鼻下二寸旁陷者中刺四分灸五壯主治風痹膝內腫痛引臏不可屈伸及寒濕走注白虎歷節風痛不能舉動咽喉中痛曲泉在膝內輔骨下大筋上小筋下陷中屈膝橫文頭取之足厥陰所入為合刺六分留七呼灸三壯主治㿉疝陰股痛小便難少氣泄痢膿血腹脅支滿膝痛筋攣四肢不舉不可屈伸風勞失精身體極痛膝脛冷陰莖痛實則身熱目痛汗不出目䀮䀮發狂衄血喘呼痛引咽喉女子陰挺出少腹痛陰癢血瘕千金云男子失精膝脛冷疼灸百壯席弘賦云兼照海陰交更求氣海關元同瀉治七疝小腹痛神效陰包在膝上四寸股內廉兩筋間蜷足取之看膝內側有槽者中足厥陰別走者刺六分灸三壯七壯主治腰尻引小腹痛小便難遺尿月水不調五里在氣衝下三寸陰股中動脈應手千金翼曰在陰廉下二寸刺六分灸五壯主治腸風熱閉不得溺風勞嗜臥四肢不能舉陰廉在羊矢下斜里三分直上去氣衝二寸動脈陷中羊矢在陰旁股內約文縫中皮肉間有核如羊矢刺八分留三呼灸三壯主治婦人不妊若經不調未有孕者灸三壯即有子急脈氣府論曰厥陰毛中急脈各一王氏注曰在陰毛中陰上兩旁相去同身寸之二寸半按之隱指堅然甚按則痛引上下其左者中寒則上引少腹下引陰丸善為痛為小腹急中寒此兩脈皆厥陰之大絡通行其中故曰厥陰急脈即睪之系也可灸而不可刺病疝小腹痛者即可灸之按此穴自甲乙經以下諸書皆無是遺誤也經脈篇曰足厥陰循股陰入毛中過陰器又曰其別者循脛上睪結於莖然此實厥陰之正脈而會於陽明者也今增入之章門一名長平一名脅髎在大橫外直臍季肋端側臥屈上足伸下足舉臂取之一云肘尖盡處是穴一云在臍上一寸八分兩旁各八寸半季肌端一云在臍上二寸兩旁各六寸寸法以胸前兩乳間橫折八寸約取之脾之募也為臟之會足厥陰少陽之會刺六分留六呼灸三壯一云百壯主治兩脅積氣如卵石膨脹腸鳴食不化胸脅痛煩熱支滿嘔吐咳喘不得臥腰脊冷痛不得轉側肩臂不舉傷飽身黃瘦弱泄瀉四肢懈墮善恐少氣厥逆難疏曰臟會季肋臟病治此千金云奔豚積聚堅滿脹痛吐逆不下食腰脊冷疼小便白濁灸脾募百壯三報之又治狂走癲癇灸三十壯又尿血灸百壯又治石水灸然谷氣衝四滿章門百證賦云治胸脅支滿一傳治久瀉不止癖塊脹疼期門在不容旁一寸五分上直乳第二肋端肝之募也足厥陰太陰陰維之會刺四分灸五壯七壯主治傷寒胸中煩熱奔豚上下目青而嘔霍亂瀉痢腹硬胸脅積痛支滿嘔酸善噫食不下喘不得臥一婦人患傷寒熱入血室醫者不識許學士曰小柴胡已遲當刺期門豫不能針請善針者針之如言而愈千金云主奔豚灸百壯上氣咳逆胸滿痛徹胸背灸巨闕期門各五十壯玉龍賦云兼大敦能治堅痃疝氣席弘賦云期門穴主傷寒患六日過經猶未汗但向乳根二肋間又治婦人坐産難百證賦云兼溫溜治傷項強通玄賦云期門退胸滿血膨而可止天星祕訣云兼三里治傷寒過經不出汗捷徑云治産後噎任脈穴任脈穴歌任脈中行二十四會陰潛伏兩陰間曲骨之前中極在關元石門氣海邊陰交神關水分處下脘建里中脘前上脘巨闕連鳩尾中庭膻中玉堂里紫宮華蓋運璇璣天突廉泉承漿止會陰一名屏翳在大便前小便後兩陰之間任脈別絡挾督脈衝脈之會一云任督沖三脈所起任由此而行腹督由此而行背沖由此而行少陰之分刺二寸留三呼灸三壯一曰禁刺惟卒死者針一寸補之溺死者令人倒馱出水用針補之尿屎出則活余不可針主治陰汗陰中諸病前後相引痛不得大小便穀道病久痔相通男子陰寒衝心女子陰門痛經不通一傳治婦人産後昏迷不省人事曲骨在橫骨上中極下一寸毛際陷中動脈任脈足厥陰之會刺一寸五分留七呼灸三壯一曰刺八分灸七壯至七七壯主治小腹脹滿水腫小便淋澀血癃㿉疝小腹痛失精虛冷婦人赤白帶下千金云水腫脹灸百壯中極一名玉泉一名氣原在臍下四寸膀胱募也足三陰任脈之會刺八分留十呼灸三壯一曰可灸百壯至三百壯孕婦不可灸主治陽氣虛憊冷氣時上衝心尸厥恍惚失精無子腹中臍下結塊水腫奔豚疝瘕五淋小便赤澀不利婦人下元虛冷血崩白濁因産惡露不行胎衣不下經閉不通血積成塊子門腫痛轉脬不得小便神農經云治血結成塊月水不調産後惡露不止臍下積聚疼痛血崩不止可灸十四壯太乙歌云兼氣海中極三里刺治小腹便澼千金云妊不成數墮落灸玉泉五十壯三報之又云為婦人斷緒最要穴又云腹脹水腫堅滿灸百壯又云腰痛小便不利轉胞灸七壯關元一名次門一名下紀在臍下三寸此穴當人身上下四旁之中故又名大中極乃男子藏精女子蓄血之處小腸募也足三陰陽明任脈之會刺八分留七呼灸七壯甲乙經云刺二寸氣府論注曰刺一寸二分一曰可灸百壯至三百壯千金曰婦人刺之則無子主治積冷諸虛百損臍下絞痛漸入陰中冷氣入腹少腹奔豚夜夢遺精白濁五淋七疝溲血小便赤澀遺瀝轉胞不得溺婦人帶下瘕聚經水不通不妊或妊娠下血或産後惡露不止或血冷月經斷絶一云但是積冷虛乏皆宜灸孕婦不可針針之則落胎如不落更針崑崙則立墜一云治陰證傷寒及小便多婦人赤白帶下俱當灸此多者千餘壯少亦不下二三百壯活人多矣然須頻次灸之仍下兼三里故曰若要丹田安三里不曾干神農經曰治痃癖氣痛可灸二十一壯千金云治瘕癖灸五十壯又久痢百治不瘥灸三百壯分十日灸之並治冷痢腹痛及臍下結痛流入陰中發作無時仍灸天井百壯又治霍亂灸三七壯又治氣淋石淋㿗疝及臍下三十六種疾灸五十壯至百壯又云胞門閉塞絶子灸關元三十壯報之玉龍賦云合湧泉豐隆為治尸勞之例又云兼帶脈多灸堪攻腎敗席弘賦云治小便不禁又云兼照海陰交曲泉氣海同瀉治七疝痛如神百證賦云無子收陰交石關之鄉一傳治婦人産後血氣痛子宮不成胎石門一名命門一名丹田一名精露一名利機在臍下二寸三焦募也刺六分留七呼灸五壯一曰灸二七壯至百壯一云不宜多灸令人敗傷婦人禁刺灸犯之終身絶孕主治腹脹堅硬水腫支滿氣淋小便黃赤不利小腹痛泄瀉不止身寒熱咳逆上氣嘔血卒疝疼痛婦人因産惡露不止遂結成塊崩中漏下血淋千金云大腸閉塞氣結心下堅滿灸百壯又治少腹絞痛泄痢不止灸丹田百壯三報之又治血淋灸隨年壯又治水腫人中滿灸百壯一傳欲絶産灸臍下二寸三分陰動脈中三壯氣海一名脖胦一名下肓在臍下一寸半宛宛中肓之原也為男子生氣之海刺八分灸五壯甲乙經曰刺一寸三分一曰灸百壯孕婦不可灸主治下焦虛冷上衝心腹或為嘔吐不止或陽虛不足驚恐不臥奔豚七疝小腸膀胱癥瘕結塊狀為覆杯臍下冷氣陽脫欲死陰證傷寒卵縮四肢厥冷小便赤澀羸瘦白濁婦人赤白帶下月事不調産後惡露不止繞臍㽱痛小兒遺尿一云治卒厥厥氣上攻兩脅心下痛奄奄欲絶此名奔豚先以熱湯洗兩足浸良久灸百壯此氣海也凡臟氣憊一切真氣不足久疾不瘥者悉皆灸之千金云治水泄痢及小腹癥積腹脹婦人癥聚瘠瘦灸氣海百壯三報之玉龍賦云兼璇璣治尫羸喘促席弘賦云治五淋須更針三里又兼水分治水腫又兼照海陰交曲泉關元同瀉治七疝小腹痛如神百證賦云針三陰與氣海專司白濁久遺精靈光賦云兼血海療五淋一傳治小腸氣痛傷寒腹痛氣脹水鼓黃腫四時宜多灸昔柳公度曰吾養生無他術但不使元氣佐喜怒使氣海常溫爾今人既不能不以元氣佐喜怒若能時灸氣海使溫亦其次也豫舊多病常若氣短醫者教灸氣海氣遂不促自是每歲一二次灸之則以氣怯故也陰交一名少關一名黃戶在臍下一寸一曰當膀胱上際三焦募也任沖少陰之會刺八分灸五壯一曰灸百壯孕婦不可灸主治衝脈生病從少腹衝心而痛不得小便疝痛陰汗濕癢奔豚腰膝拘攣婦人月事不調崩中帶下陰癢産後惡露不止繞臍冷痛神農經云治臍下冷疼可灸二十一壯千金云大小便不通灸三壯轉胞灸隨年壯又治水腫氣上下灸百壯玉龍賦云兼三里水分治鼓脹席弘賦云兼照海曲泉關元氣海同瀉治七疝小腹痛如神又云治小腸氣撮痛連臍急瀉此穴更於湧泉取氣甚妙又云兼百會太衝照海治咽喉疾標幽賦云陰交陽別定血暈百證賦云兼三里治中邪霍亂又云無子取陰交石關之鄉一傳治腹內風寒走痛脹疼神闕一名氣舍當臍中灸三壯禁刺刺之令人惡瘍潰矢死不治一曰納炒乾淨鹽滿臍上加厚薑一片蓋定灸百壯或以川椒代鹽亦妙主治陰證傷寒中風不省人事腹中虛冷傷憊腸鳴泄瀉不止水腫鼓脹小兒乳痢不止腹大風癇角弓反張脫肛婦人血冷不受胎者灸此永不脫胎此穴在諸傢俱不言灸只云禁針銅人云宜灸百壯有徐伻者卒中不省得桃源簿為灸臍中百壯始蘇更數月復不起鄭糾云有一親卒中風醫者為灸五百壯而赤後年逾八十向使徐伻灸至三五百壯安知其不永年耶故神闕之灸須填細鹽然後灸之以多為良若灸之三五百壯不惟愈疾亦且延年若灸少則時或暫愈後恐復發必難救矣但夏月人神在臍乃不宜灸千金云納鹽臍中灸三壯治淋病又云凡霍亂納鹽臍中灸二七壯並治脹滿水分一名分水一名中守在下脘下一寸臍上一寸當小腸下口至是而泌別清濁水液入膀胱渣滓入大腸故曰水分禁刺灸五壯甲乙經曰刺一寸孕婦不可灸主治水病腹堅黃腫如鼓沖胸不得息繞臍痛腸鳴泄瀉小便不通小兒陷囟若水病脹滿堅硬不能食灸之大良日七壯至四百壯止但不可刺刺而水盡即死神農經云腹脹水腫可灸十四壯至二十一壯千金云治反胃吐食灸二十壯又治腹脹繞臍結痛堅不能食灸百壯又霍亂轉筋入腹欲死用四人持其手足灸四五壯自不動即勿持之灸至十四壯太乙歌云腹脹瀉此兼三里陰谷利水消腫玉龍賦云兼陰交三里治鼓脹百證賦云兼陰陵能去水腫盈臍席弘賦云兼氣海治水腫天星祕訣云兼建里治肚腹浮腫脹膨膨下脘在建里下一寸臍上二寸當胃下口小腸上口足太陰任脈之會刺八分灸五壯一曰二七壯至百壯孕婦不可灸主治臍上厥氣堅痛腹脹滿寒穀不化虛腫癖塊連臍瘦弱少食翻胃小便赤靈光賦云兼中脘治腹堅百證賦云兼陷谷能平腹內腸鳴建里在臍上三寸中脘下一寸刺五分留十呼灸五壯一云宜針不宜灸孕婦尤忌之主治腹脹身腫心痛上氣腸鳴嘔逆不食千金云主霍亂腸鳴腹脹可刺八分瀉五吸疾出針日灸二七壯至百壯百證賦云兼內關掃盡胸中之苦悶天星祕訣云兼水分治肚腹腫脹中脘一名太倉一名胃脘一名上紀在上脘下一寸臍上四寸居岐骨與臍之中胃之募也為腑之會手太陽少陽足陽明所生任脈之會刺八分灸七壯一云二七壯至百壯孕婦不可灸主治心下脹滿傷飽食不化五隔五噎翻胃不食心脾煩熱疼痛積聚痰飲面黃傷寒飲水過多腹脹氣喘溫瘧霍亂吐瀉寒熱不已或因讀書得奔豚氣上攻伏梁心下寒癖結氣凡脾冷不可忍心下脹滿飲食不進不化氣結疼痛雷鳴者皆宜灸之此為腑會故凡腑病者當治之千金云虛勞吐血嘔逆不下食多飽多睡百病灸三百壯又治脹滿水腫氣聚寒冷灸百壯三報之又治奔豚伏梁冷氣刺八分留七呼瀉五吸仍日灸二七至四百壯又主五毒注不能食飲灸至千壯又治霍亂先腹痛灸二七壯不瘥更二七壯又治中惡灸五十壯玉龍賦云兼腕骨療脾虛黃疸又云合上脘治九種心疼百證賦云主治積痢靈光賦云兼下脘治腹堅捷徑云治食噎上脘在巨闕下一寸五分去蔽骨三寸臍上五寸足陽明手太陽任脈之會刺八分留七呼灸五壯千金云日灸二七壯至百壯三報之孕婦不可灸主治心中煩熱痛不可忍腹中雷鳴飲食不化霍亂翻胃嘔吐三焦多涎奔豚伏梁氣脹積聚黃疸心風驚悸嘔血身熱汗不出神農經云治心疼積塊嘔吐可灸十四壯玉龍賦云閣中脘治九神之心疼太乙歌云兼豐隆刺治心疼嘔吐傷寒吐蛔百證賦云合神門治發狂奔走捷徑云治風癇熱病蛔蟲心痛巨闕在鳩尾下一寸心之募也刺六分留七呼灸七壯一曰刺三分灸七七壯主治上氣咳逆胸滿氣短九種心疼冷痛引少腹蛔痛痰飲咳嗽霍亂腹脹恍惚發狂黃疸中隔不利煩悶卒心痛尸厥蠱毒息賁嘔血吐痢不止牛癇千金云治吐逆不下食灸五十壯上氣胸滿牽背徹痛灸五十壯若霍亂心痛先吐灸二七壯未愈再二七壯又治卒忤灸百壯神農經云治心腹積氣可灸十四壯又云治小兒諸癇病如口噦吐沫可灸三壯艾炷如小麥百證賦云兼刺膻中能除膈痛飲蓄難禁鳩尾一名𩩲骬一名尾翳在臆前蔽骨下五分人無蔽骨者從岐骨際下行一寸甲乙經曰一寸半膏之原也禁刺灸一云可刺三分灸三壯此穴大難下針非甚妙高手不可輕刺也主治心驚悸神氣耗散癲癇狂病席弘賦云鳩尾能治五般癇若下湧泉人不死中庭在膻中下一寸六分陷中仰而取之刺三分灸五壯主治胸脅支滿噎塞吐逆食入還出小兒吐乳膻中一名元兒一名上氣海在玉堂下一寸六分橫兩乳間陷中仰臥取之禁刺灸七壯刺之不幸令人夭甲乙經曰刺三分主治一切上氣短氣痰喘哮嗽咳逆噎氣隔食反胃喉鳴氣喘肺癰嘔吐涎沫膿血婦人乳汁少此氣之會也凡上氣不下及氣噎氣隔氣痛之類均宜灸之神農經云上氣喘咳可灸七壯千金云胸痹心痛灸百壯上氣咳逆灸五十壯玉龍賦云兼天突醫喘嗽百證賦云兼巨闕針之能除膈痛蓄飲難禁一傳治傷寒風痰壅盛玉堂一名玉英在紫宮下一寸六分陷中仰而取之刺三分灸五壯一云少灸主治胸膺滿痛心煩咳逆上氣喘急不得息喉痹咽壅水漿不入嘔吐寒痰百證賦云兼幽門能治煩心嘔吐紫宮在華蓋下一寸六分陷中仰而取之刺三分灸五壯主治胸脅支滿膺痛喉痹咽壅水漿不入咳逆上氣吐血煩心華蓋在璇璣下一寸陷中仰而取之刺三分灸五壯主治咳逆喘急上氣哮嗽喉痹胸脅滿痛水飲不下神農經云治氣喘咳嗽胸滿喘逆不能言語可灸七壯百證賦云兼氣戶治脅肋疼痛璇璣在天突下一寸陷中仰而取之刺三分灸五壯主治胸脅滿咳逆上氣喘不能言喉痹咽腫水飲不下玉龍賦云兼氣海治尫羸喘促席弘賦云治胃中有積兼三里功多百證賦云兼神藏治膈滿項強已試天突一名玉戶在結喉下三寸宛宛中陰維任脈之會刺五分留三呼灸三壯甲乙經曰低頭取之刺入一寸主治上氣哮喘咳嗽喉痹五噎肺癰吐咯膿血咽腫暴喑身寒熱咽乾舌下急不得下食神農經云治氣喘咳嗽可灸七壯玉龍賦云兼膻中醫咳嗽靈光賦云治喘痰百證賦云兼肺俞治咳嗽連聲千金云治上氣氣悶咽塞聲壞灸五十壯廉泉一名本池一名舌本在頷下結喉上中央舌本下仰而取之陰維任脈之會按刺瘧篇所載曰舌下兩脈者廉泉也氣府論曰足少陰舌下各一衛氣篇曰足少陰之標在背腧與舌下兩脈然則廉泉非一穴當是舌根下之左右泉脈而且為足少陰之會也刺三分留三呼灸三壯主治咳嗽喘息上氣吐沫舌縱舌下腫難言舌根急縮不食涎出口瘡百證賦云兼中衝堪攻舌下腫痛承漿一名天池一名懸漿在頤前下唇稜下陷中足陽明任脈之會刺二分留五呼灸三壯主治偏風半身不遂口眼喎斜口噤不開暴喑不能言刺三分徐徐引氣而出及治任之為病其苦內結男子為七疝女子為瘕聚一云療偏風口喎面腫消渴飲水不休口齒疳蝕生瘡灸之亦佳日可七壯至七七壯止即血脈宣通其風應時立愈艾炷不必大但令當脈即能愈疾千金云小兒唇緊灸三壯又云凡噦令人惋恨灸七壯炷如小麥又十三鬼穴云此名鬼市治百邪癲狂當在第八次下針百證賦云瀉牙疼而即移通玄賦云治頭項強督脈穴督脈穴歌督脈行背之中行二十八穴始長強腰俞陽關入命門懸樞脊中中樞長筋縮至陽歸靈臺神道身柱陶道開大椎啞門連風府腦戶強間後頂排百會前頂通囟會上星神庭素髎對水溝兌端在唇上齦交上齒縫之內凡取脊間督脈諸穴當於骨節突處取之但驗於魚骨為可知也若取於節下必不見效長強一名氣之陰郤一名撅骨靈樞謂之窮骨亦名骨骶在脊骶骨端伏地取之督脈之絡別走任脈足少陰所結刺二分留七呼灸三壯甲乙經曰刺三分一云日灸三十壯至二百壯止忌冷食房勞主治腰脊強急不可俯仰狂病大小便難腸風下血五痔五淋下部疳蝕洞泄失精嘔血小兒囟陷驚癇瘛瘲脫肛瀉血此穴為五痔之本一經驗治少年注夏羸瘦灸此最效千金翼云治赤白下痢灸窮骨頭百壯多多惟佳又下漏五痔疳蠱食下部刺三分伏地取之以大痛為度灸亦良日三十壯至七日止但不及針又灸尾翠骨七壯治脫肛神良千金作龜尾即窮骨也玉龍賦云兼承山灸痔最妙席弘賦云連大杼行針治小腸氣痛又云小兒脫肛患多時先灸百會後長強百證賦云兼百會穴專治脫肛又云刺長強與承山善主腸風新下血靈光賦云百會龜尾治痢疾天星祕訣云兼大敦治小腸疝氣腰俞一名腰柱一名背解一名腰戶一名髓空在二十一椎節下間宛宛中刺二分留七呼灸五壯一曰刺五分灸七七壯主治腰脊重痛不得俯仰舉動腰以下至足冷痹不仁強急不能坐臥灸隨年壯溫瘧汗不出婦人經閉溺赤灸後忌房勞強力千金云腰卒痛去窮骨上一寸灸七壯者即此席弘賦云兼環跳燒針治冷風冷痹陽關在十六椎節下間伏而取之甲乙經無此穴刺五分灸三壯主治膝痛不可屈伸風痹不仁筋攣不行命門一名屬纍在十四椎節下間伏而取之一云平臍用線牽而取之刺五分灸三壯一曰刺三分灸二十七壯若年二十以上者灸恐絶子主治腎虛腰痛赤白帶下男子泄精耳鳴手足冷痹攣疝驚恐頭眩頭痛如破身熱如火骨蒸汗不出痎瘧瘛瘲裡急腹痛千金云腰痛不得動者令病人正立以竹杖拄地度至臍乃取杖度背脊灸杖頭盡處隨年壯良丈夫痔漏下血脫肛不食長泄痢婦人崩中去血帶下淋濁赤白皆灸之此挾兩旁各一寸橫三間寸灸之神農經云治腰痛可灸七壯玉龍賦云治老人便多兼腎俞著艾標幽賦云兼肝俞能使瞽士視秋毫之末一俗傳以此穴灸寒熱多效懸樞在十三椎節下間伏而取之刺三分灸三壯五壯主治腰脊強不得屈伸腹中積氣上下疼痛水穀不化瀉痢不止脊中一名神宗一名脊俞在十一椎節下間俯而取之刺五分禁灸灸則令人僂主治風癇癲邪腹滿不食五痔積聚下痢小兒痢下赤白秋末脫肛每廁則肛痛不可忍者灸之亦無妨中樞在第十椎節下間俯而取之此穴諸書皆失之惟氣府論督脈下王氏注中有此穴及考之氣穴論曰背與心相控而痛所治天突與十椎者其穴即此刺五分禁灸灸之令人腰背傴僂一傳云此穴能退熱進飲食可灸三壯常用常效未見傴僂筋縮在九椎節下間俯而取之刺五分灸三壯五壯主治癲疾驚狂脊強風癇目上視百證賦云兼水道專治脊強至陽在七椎節下間俯而取之刺五分灸三壯主治腰脊強痛胃中寒不食少氣難言胸脅支滿羸瘦身黃淫濼脛酸四肢重痛寒熱解㑊一云灸三壯治喘氣立已神農經云治寒熱脛酸四肢重痛咳嗽可灸三壯至七壯玉龍賦云卻疸治神疲靈臺在六椎節下間俯而取之刺三分灸三壯甲乙經無此穴出氣府論注主治今俗以灸氣喘不能臥及風冷久嗽火到便愈神道在五椎節下間俯而取之刺五分留五呼灸五壯一曰可灸七七壯至百壯禁針主治傷寒頭痛寒熱往來痎瘧悲愁健忘驚悸牙車急張口不合小兒風癇瘛瘲可灸七壯百證賦云兼心俞治風癇常發自寧身柱在三椎節下間俯而取之刺五分留五呼灸五壯一曰灸七七壯主治腰脊痛癲癇狂走怒欲殺人瘛瘲身熱妄言見鬼小兒驚癇神農經云治咳嗽可灸十四壯玉龍賦云能蠲嗽除膂痛百證賦云兼本神穴治癲疾妙乾坤生意云同陶道肺俞膏肓治虛損五勞七傷緊要法一傳治四時傷寒陶道在大椎節下間俯而取之督脈足太陽之會刺五分留五呼灸五壯一曰刺三分主治痎瘧寒熱灑淅脊強煩滿汗不出頭重目瞑瘛瘲恍惚不樂乾坤生意云兼身柱肺俞膏肓治虛損五勞七傷百證賦云兼中膂俞治歲熱時行一傳此穴善退骨蒸之熱大椎一名百勞在第一椎上陷者中一曰平肩手足三陽督脈之會刺五分留五呼灸五壯一云以年為壯大椎為骨會骨病者可灸之主治五勞七傷乏力風勞食氣痎瘧久不愈肺脹脅滿嘔吐上氣背膊拘急項頸強不得回顧一云能瀉胸中之熱及諸熱氣若灸寒熱之法先大椎次長強以年為壯數一云治身痛寒熱風氣痛一云治衄血不止灸二三十壯斷根不發千金云凡瘧有不可瘥者從未發前灸大椎至發時滿百壯無不瘥又云諸煩熱時氣溫病灸大椎百壯刺三分瀉之又治氣短不語灸隨年壯又治頸癭灸百壯及大椎兩邊相去各一寸半少垂下各三十壯玉龍賦云百勞止虛汗神農經云治小兒急慢驚風竇太師治諸虛寒熱灸此捷徑云治熱不至肩時傳以此治百病啞門一名喑門一名舌厭一名舌橫在項後入髮際五分宛宛中仰頭取之督脈陽維之會入系舌本刺二分不可深禁灸灸之令人啞主治頸項強急不語諸陽熱盛衄血不止脊強反折瘛瘲癲疾頭風疼痛汗不出寒熱風痙中風尸厥暴死不省人事百證賦云兼關衝治舌緩不語為緊要風府一名舌本在項上入髮際一寸大筋內宛宛中疾言其肉立起言休其肉立下督脈陽維之會熱論曰巨陽者諸陽之屬也其脈連於風府刺三分留三呼禁灸灸則令人喑主治中風舌緩暴喑不語振寒汗出身重偏風半身不遂傷風頭痛項急不得回顧目眩反視鼻衄咽痛狂走悲恐驚悸欲自殺一云主瀉胸中之熱與大杼缺盆中府同席弘賦云風府風池尋得到傷寒百病一時消又云陽明二日尋風府又云從來風府最難尋須用功夫度淺深倘若膀胱氣未散更宜三里穴中尋通玄賦云風傷項急求風府一傳治感冒風寒嘔吐不止千金云邪病臥冥冥不自知風府主之又十三鬼穴云此名鬼枕治百邪癲狂當在第六次下針腦戶一名匝風一名會額一名合顱在枕骨上強間後一寸五分一曰在髮際上二寸督脈足太陽之會禁刺灸刺中腦戶入腦立死亦不可灸令人喑強間一名大羽在後頂後一寸五分刺二分灸五壯一曰禁灸主治頭痛項強目眩腦旋煩心嘔吐涎沫狂走百證賦云兼豐隆治頭痛難禁後頂一各交沖在百會後一寸五分枕骨上刺二分灸五壯主治頸項強急額顱上痛偏頭痛惡風目眩不明百會一名三陽五會一名巔上一名天滿在前頂後一寸五分頂中央旋毛心容豆許直兩耳尖上對是穴督脈足太陽之會手足少陽足厥陰俱會於此刺二分灸五壯甲乙經曰刺三分灸三壯一曰灸頭頂不得過七七壯主治頭風頭痛耳聾鼻塞鼻衄中風言語蹇滯口噤不開或多悲哭偏風半身不遂風癇卒厥角弓反張吐沫心神恍惚驚悸健忘痎瘧女人血風胎前産後風疾小兒風癇驚風脫肛久不瘥一曰百病皆治宜刺此二分得氣即瀉若灸至百壯停三五日後繞四畔用三稜針出血以井花水淋之令氣宣通否則恐火氣上壅令人目暗一曰治悲笑欲死四肢冷風欲絶身口溫可針人中三分灸百會三壯即蘇史記載扁鵲治虢太子尸厥針取三陽五會而蘇神農經云治頭風可灸三壯小兒脫肛可灸三壯至五壯艾炷如小麥玉龍賦云兼囟會治卒暴中風靈光賦云兼龜尾治痢疾席弘賦云小兒脫肛患多時先灸百會後尾骶又云兼太衝照海陰交治咽喉疾前頂在囟會後一寸五分骨陷中一云在百會前一寸刺二分灸五壯一曰灸七七壯主治頭風目眩面赤腫小兒驚癇瘛瘲鼻多清涕頸項腫痛神農經云治小兒急慢驚風可灸三壯艾炷如小麥百證賦云兼水溝治面腫虛浮囟會在上星後一寸陷中刺二分灸五壯一曰灸二七至七七壯小兒八歲以前禁針蓋其囟門未合刺之不幸令人夭主治腦虛冷痛頭風腫痛項痛飲酒過多頭皮腫風癇清涕一云治目眩面腫鼻塞不聞香臭驚癇戴目昏不識人可灸二七壯至七七壯初灸即不痛病去即痛痛即罷灸若是鼻塞灸至四日漸退七日頓愈針入二分留三呼得氣即瀉頭風生白屑多睡針之彌佳針訖以末鹽生麻油相和揩髮根下即頭風永除神農經云治頭風疼痛可灸三壯小兒急慢驚風灸三壯炷如小麥千金云邪病鬼癲囟上主之一名鬼門玉龍賦云兼百會治卒暴中風百證賦云連玉枕療頭風上星一名神堂在鼻直上入髮際一寸陷者中可容豆刺三分留六呼灸五壯一云宜三稜針出血以瀉諸陽熱氣主治頭風頭痛頭皮腫面虛惡寒痎瘧寒熱汗不出鼻血臭涕鼻塞不聞香臭目眩睛痛不能遠視以細三稜針刺之即宣泄諸陽熱氣無令上衝頭目千金云鼻中息肉灸二百壯又云兼大椎灸瘧至發時令滿百壯炷如黍米又治鬼魅灸百壯又十三鬼穴此名鬼堂主百邪癲狂當在第十次下針玉龍賦云治頭風鼻淵神庭直鼻上入髮際五分發高者髮際是穴發低者加二三分督脈足太陽陽明之會灸三壯禁刺刺之令人癲狂目失明一曰灸七壯至三七壯止主治發狂登高妄走風癇癲疾角弓反張目上視不識人頭風鼻淵流涕不止頭痛目淚煩滿喘喝驚悸不得安寢玉龍賦云專理頭風素髎一名面王在鼻端準頭刺一分禁灸主治鼻中瘜肉不消喘息不利多涕喎僻衄血一曰治酒酢風用三稜針出血水溝一名人中在鼻下人中陷中督脈手足陽明之會刺三分留六呼得氣即瀉灸三壯至七壯炷如小麥然灸不及針主治中風口噤牙關不開卒中惡邪鬼擊不省人事癲癇卒倒消渴多飲水氣遍身浮腫瘟疫口眼喎僻俱宜刺之若風水面腫針此一穴出水盡即頓愈一雲水氣腫病但宜針此三分徐徐出之以泄水氣若針他穴水盡則死神農經云治小兒急慢驚風可灸三壯炷如小麥玉龍賦云兼曲池穴治痿僕又云兼委中穴治腰脊閃痛又云合大陵頻瀉之全除口氣席弘賦云人中治癲功最高十三鬼穴不須饒千金云此穴為鬼市治百邪癲狂此當在第一次下針凡人中惡先掐鼻下是也鬼擊卒死者須即灸之百證賦云兼前頂治面腫虛浮靈光賦云水溝兼間使治邪癲兌端在上唇端甲乙經曰手陽明脈氣所發刺二分留六呼灸三壯炷如大麥主治癲癇吐沫齒齦痛消渴衄血口噤口瘡臭穢不可近百證賦云小便赤澀兌端獨瀉太陽經齦交齦音銀齒根肉在唇內上齒縫中任督二經之會刺三分逆刺之灸三壯主治面赤心煩痛鼻生瘜肉不消頭額中痛頸項強目淚多眵赤痛牙疳腫痛小兒面瘡久癬不除點烙亦佳百證賦云專治鼻痔
