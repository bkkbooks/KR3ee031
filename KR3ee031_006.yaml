內市刺三分留六呼灸三壯一云禁刺主治小便不通遺尿鼠鼷腫痛衝門一名慈宮上去大橫五寸在府舍下橫骨兩端約文中動脈去腹中行三寸半足太陰厥陰之會刺七分灸五壯主治中寒積聚淫濼陰疝妊娠衝心難乳百證賦云兼氣衝治帶下産崩又云兼血海治痃癖府舍在腹結下三寸去腹中行三寸半足厥陰太陰陰維之會甲乙經曰此脈上下入腹絡胸結心肺從脅上至肩此太陰郤三陰陽明支別刺七分灸五壯主治疝癖腹脅滿痛上下搶心積聚痹痛厥氣霍亂腹結一名腹屈在大橫下一寸三分去腹中行三寸半刺七分灸五壯主治咳逆繞臍腹痛中寒瀉痢心痛大橫在腹哀下三寸五分平臍去中行三寸半足太陰陰維之會刺七分灸五壯主治大風逆氣四肢不舉多寒善悲千金云主多寒洞痢四肢不舉灸隨年壯又云多汗四肢不舉少力灸橫文五十壯在挾臍相去七寸亦屬此穴百證賦云兼天衝穴治反張悲哭腹哀在日月下一寸五分去腹中行三寸半足太陰陰維之會刺三分灸五壯甲乙經云刺七分主治寒中食不化大便膿血腹痛食竇在天溪下一寸六分陷中舉臂取之刺四分灸五壯主治胸脅支滿咳唾逆氣飲不下膈有水聲天溪在胸鄉下一寸六分陷中仰而取之刺四分灸五壯主治胸滿喘逆上氣喉中作聲婦人乳腫賁癰胸鄉在周榮下一寸六分陷中仰而取之刺四分灸五壯主治胸脅支滿引背痛不得臥轉側周榮在中府下一寸六分陷中仰而取之刺四分灸五壯主治胸滿不得俯仰咳逆食不下大包在淵腋下三寸脾之大絡布胸脅中出九肋間及季脅端總統陰陽諸絡由脾灌溉五臟刺三分灸三壯主治胸中喘痛腹有大氣不得息實則其身盡寒虛則百節皆縱手少陰心經穴心經穴歌手少陰心起極泉青靈少海靈道全通里陰郤神門下少府少衝小指邊極泉在臂內腋下筋間動脈入胸中刺三分灸七壯主治心脅滿痛肘臂厥寒四肢不收乾嘔煩渴目黃青靈在肘上三寸伸肘舉臂取之滑氏曰自極泉下循臑內後廉行太陰心主兩經之後歷青靈穴甲乙經無此穴灸三壯主治頭痛目黃振寒脅痛肩臂不舉少海一名曲節在肘內廉節後陷中又云肘內大骨下去肘端五分肘內橫文頭屈肘向頭取之手少陰所入為合刺五分灸三壯一曰禁灸主治寒熱齒痛目眩發狂癲癇羊鳴嘔吐涎沫項不得回頭風疼痛氣逆瘰癧肘臂腋脅痛攣不舉千金云主腋下瘰癧漏臂疼痛風痹瘙漏屈伸不得針三分留七呼瀉五呼席弘賦云心疼手顫少海間若要除根覓陰市百證賦云兼三里穴治兩臂頑木靈道在掌後一寸五分一曰一寸手少陰所行為經刺三分灸三壯主治心痛悲恐乾嘔瘛瘲肘攣暴喑不能言通里在腕側後一寸陷中手少陰絡別走手太陽經刺三分灸三壯主治熱病頭痛目眩面熱無汗懊憹暴喑心悸悲恐畏人喉痹苦嘔虛損數欠少氣遺溺肘臂腫痛婦人經血過多崩漏神農經云治目眩頭疼可灸七壯玉龍賦云療心驚百證賦云兼大鐘治倦言嗜臥馬丹陽云欲言聲不出懊憹及怔忡實則四肢重頭腮面頰紅聲平仍欠數喉閉氣難通虛則不能食暴喑面無容毫針微微刺方信有神功陰郤一曰手少陰郤在掌後脈中去腕五分當小指之後刺三分灸三壯主治鼻衄吐血失音不能言霍亂胸中滿灑淅惡寒厥逆驚恐心痛標幽賦云止盜汗治小兒之骨蒸百證賦云兼二間能疏通寒栗惡寒又云兼後溪治盜汗之多出神門一名兌沖一名中都在掌後鋭骨端陷中當小指後手少陰所注為腧刺三分留七呼灸三壯一云七壯炷如小麥主治瘧疾心煩欲得冷飲惡寒則欲就溫咽乾不嗜食驚憒心痛少氣身熱面赤發狂喜笑上氣嘔血吐血遺溺失音健忘心積伏梁大人小兒五癇證手臂攣掣玉龍賦云治癲癇失意百證賦云同上脘治發狂奔走少府在小指本節後骨縫陷中直勞宮手少陰所溜為滎刺二分灸三壯一曰七壯主治痃瘧久不愈振寒煩滿少氣胸中痛悲恐畏人臂酸肘腋攣急陰挺出陰癢陰痛遺尿偏墜小便不利少衝一名經始在手小指內側端去爪甲角如韭葉手少陰所出為井刺一分留一呼灸一壯一曰三壯主治熱病煩滿上氣心火炎上眼赤血少嘔吐血沫及心痛冷痰少氣悲恐善驚口熱咽酸胸脅痛乍寒乍熱臑臂內後廉痛手攣不伸玉龍賦云可治心虛熱壅百證賦云兼曲池治發熱乾坤生意云此為十井穴凡初中風跌倒卒暴昏沉痰涎壅滿不省人事牙關緊閉藥水不下急以三稜針刺少商商陽中衝關衝少澤及此穴使氣血流通乃起死回生急救之妙穴手太陽小腸經穴小腸經穴歌手太陽經小腸穴少澤先於小指設前谷後溪腕骨間陽谷須同養老列支正小海上肩貞臑俞天宗秉風合曲垣肩外復肩中天窗循次上天容此經穴數一十九還有顴髎入聽宮少澤一名小吉在手小指外側端去爪甲角一分陷中甲乙經曰在小指之端去爪甲一分陷中手太陽所出為井刺一分留二呼灸一壯主治痎瘧寒熱汗不出喉痹舌強心煩咳嗽瘛瘲臂痛頸項痛不可顧目生翳及療婦人無乳先瀉後補千金云耳聾不得眠刺小指外側端近甲入一分半補之玉龍賦云治婦人乳腫百證賦云兼肝俞可治攀睛靈光賦云除心下寒乾坤生意云此為十井穴凡初中風卒暴昏沉痰涎壅盛不省人事急以三稜針刺少商商陽中衝少衝及此穴使氣血流通乃起死回生急救之妙穴前谷在手小指外側本節前陷中手太陽所溜為滎刺一分留三呼灸三壯主治熱病汗不出痎瘧癲疾耳鳴喉痹頸項頰腫引耳後咳嗽目翳鼻塞吐衄臂痛不得舉婦人産後無乳後溪在手小指本節後外側橫文尖上陷中仰手握拳取之一云在手腕前外側拳尖起骨下陷中手太陽所注為腧刺一分留二呼灸一壯一云三壯主治痎瘧寒熱目翳鼻衄耳聾胸滿項強癲癇臂肘攣急五指盡痛神農經云治項強不得回顧脾寒肘疼灸七壯玉龍賦云專治時疫痎瘧攔江賦云專治督脈病癲狂百證賦云兼環跳治腿痛又云偕勞宮可治消疸又云同陰郤治盜汗之多出通玄賦云治頭頂痛立安千金十一穴云兼列缺治胸項有痛一傳治早食午吐午食晚吐灸此左右二穴九壯立愈捷法云療手足攣急屈伸艱難手足俱顫不能行步握物頸項強痛不能回顧腮頰紅腫咽喉閉塞水飲不下心肺二經熱病雙蛾喉痛肺與三焦熱病單蛾咽腫上下牙兩頰疼痛牙關緊急不開頸項紅腫耳聾氣痞疼痛耳內或鳴或癢或痛雷頭風眩暈嘔吐痰涎腎虛頭痛頭重不舉肝厥頭暈及頭目昏沉偏正頭風疼痛兩額顱眉角疼痛太陽痛頭項拘急痛引肩背醉後頭風嘔吐不止惡聞人言眼赤痛衝風淚下不已破傷風因他事觸發渾身發熱癲狂以上凡三十餘證先以後溪主治後隨證加各穴分治之腕骨在手外側腕前起骨下陷中手太陽所過為原刺二分留三呼灸三壯主治熱病汗不出脅下痛不得息頸項腫寒熱耳鳴目出冷淚生翳狂惕偏枯臂肘不得屈伸瘧疾煩悶頭痛驚風瘛瘲五指掣攣凡心與小腸火盛者當瀉此渾身熱盛先補後瀉肩背冷痛先瀉後補玉龍賦云又兼中脘治脾虛黃疸通玄賦云腕骨祛黃陽谷在手外側腕中鋭骨下陷中手太陽所行為經刺二分留三呼灸三壯主治癲疾發狂妄言左右顧熱病汗不出脅痛項腫寒熱耳聾耳鳴齒痛臂不舉小兒瘛瘲舌強百證賦云兼俠溪治頷腫口噤養老在手外踝骨上一空腕後一寸陷中手太陽郤刺三分灸三壯主治肩臂痠痛肩欲折臂如拔手不能上下目視不明百證賦云兼天柱治目視䀮䀮張仲文傳灸治仙法療腰重痛不可轉側起坐艱難及筋攣腳痹不可屈伸支正在腕後外廉五寸手太陽絡別走少陰刺三分留七呼灸三壯主治五勞癲狂驚風寒熱頷腫項強頭痛目眩風虛驚恐悲憂腰背痠四肢乏弱肘臂不能屈伸手指痛不能握百證賦云兼飛陽可治目眩小海在肘內大骨外去肘端五分陷中屈手向頭取之手太陽所入為合刺二分留七呼灸五壯七壯主治肘臂肩臑頸項痛寒熱齒根腫風眩瘍腫小腹痛五癇瘛瘲肩貞在肩曲胛下兩骨解間肩髃後陷中刺五分灸三壯主治傷寒寒熱頷腫耳鳴耳聾缺盆肩中熱痛風痹手足不舉臑俞在肩髎後大骨下胛上廉陷中舉臂取之手足太陽陽維陽蹺之會刺八分灸三壯主治臂酸無力肩痛引胛寒熱氣腫痠痛天宗在秉風后大骨下陷中刺五分留六呼灸三壯主治肩臂痠疼肘外後廉痛頰頷腫秉風在肩上天髎外小髃骨舉臂有空手太陽陽明手足少陽之會刺五分灸三壯主治肩痛不可舉曲垣在肩中央曲胛陷中按之應手痛刺五分灸三壯甲乙經曰十壯主治肩臂熱痛拘急周痹肩外俞在肩胛上廉去脊三寸陷中與大杼平刺六分灸三壯主治肩胛痛發寒熱引項攣急周痹寒至肘肩中俞在肩胛內廉去脊大椎旁二寸陷中刺三分留七呼灸十壯甲乙經作三壯主治咳嗽上氣唾血寒熱目視不明天窗一名窗籠在頸大筋前曲頰下扶突後動脈應手陷中刺三分灸三壯甲乙經作刺六分主治頸癭腫痛肩胛引項不得回顧頰腫齒噤耳聾喉痛暴喑千金云狂邪鬼語灸九壯癮疹灸七壯天容在耳下曲頰後刺一分灸三壯主治癭氣頸癰不可回顧不能言齒噤耳鳴耳聾喉痹咽中如梗寒熱胸滿嘔逆吐沫顴髎名兌骨在面頄骨下廉鋭骨端陷中手少陽太陽之會刺二分禁灸主治口喎面赤目黃眼瞤不止䪼腫齒痛百證賦云兼大迎治目眩妙聽宮一名多所聞在耳中珠子大如赤小豆手足少陽手太陽之會刺三分灸三壯主治失音癲疾心腹滿耳內蟬鳴耳聾百證賦云兼脾俞能祛心下之悲悽
