body:
  text: 卷六經絡四手太陰肺經穴肺經穴歌手太陰經十一穴中府雲門天府列俠白尺澤孔最存列缺經渠太淵涉魚際直出大指端內側少商如韭葉中府一名膺中俞在雲門下一寸去任脈中行六寸乳上三肋間陷中動脈應手仰而取之肺之募也募結募也經氣之所聚他仿此手足太陰之會刺三分留五呼灸三壯五壯埤雅云壯者言以壯人為法也主治肺急胸滿喘逆善噎食不下肺膽寒熱咳嘔膿血肺風面腫汗出肩息背痛涕濁喉痹少氣不得臥飛尸遁注癭瘤此穴主瀉胸中之熱其治多與大杼缺盆風府同千金云身體煩熱刺中府又云上氣咳逆短氣氣滿食不下灸五十壯百證賦云同意舍能治胸滿哽噎雲門在巨骨下挾氣戶旁二寸去中行六寸陷中動脈應手舉臂取之刺三分灸五壯甲乙經云刺太深令人逆息千金云灸五十壯主治傷寒四肢熱不已咳逆短氣上衝心胸脅肋煩滿徹痛喉痹癭氣臂不得舉此穴主瀉四肢之熱其治與肩髃委中腰俞大同千金云病癭上氣胸滿灸百壯天府在胸臑內廉腋下三寸動脈陷中以鼻取之刺四分留三呼禁灸灸之令人氣逆主治暴痹內逆肝邪相搏卒中惡風邪氣血溢口鼻飛尸鬼注惡語悲泣善忘喘息不得安臥痎瘧寒熱目眩癭氣千金翼云身重嗜臥不自覺灸五十壯刺三分補之又病癭惡氣灸五十壯百證賦云兼合谷可追鼻中衄血俠白在天府下去肘上五寸動脈中手太陰之別刺四分留三呼灸五壯主治心痛氣短乾嘔煩滿尺澤在肘中約文上屈肘橫文筋骨罅中動脈手太陰所入為合肺實瀉之刺三分留三呼灸三壯五壯甄權云臂屈伸橫文間筋骨罅中不宜灸主治嘔吐上氣喉痹鼓頷心煩身痛不得汗舌乾咳唾膿血心痛氣短肺積息賁痎瘧汗出中風肩背痛灑淅寒熱風痹肘攣四肢腫痛不得舉脅痛腹脹小便數溺色變遺失無度面白善嚏悲愁不樂及小兒慢驚風可灸一壯千金翼云邪病四肢重痛諸雜候尺澤主之一名鬼堂又治嘔吐上氣灸三壯七壯又治氣短不語灸百壯玉龍賦云理筋急又云兼曲池療肘臂攣痛靈光賦云吐血定喘須補此穴席弘賦云治五般肘痛又須針清冷淵以收功孔最在腕上七寸陷中手太陰之郤刺三分留三呼灸五壯主治熱病汗不出灸三壯即汗出及咳逆肘臂痛屈伸難吐血失音頭疼咽痛列缺在腕後側上一寸五分滑氏曰以手交叉當食指末筋骨罅中是穴此手太陰之絡從腕後別走陽明直出食指內廉出其端凡人有反關脈者寸關尺三部正脈不見而見於列缺陽溪此經脈虛而絡脈滿千金翼謂陽脈逆反大於寸口三倍者是也刺二分留三呼灸三壯慎酒面生冷等物主治偏風口眼喎斜手肘痛無力半身不遂口噤不開痎瘧寒熱煩躁咳嗽喉痹嘔沫縱唇健忘驚癇善笑妄言妄見面目四肢癰腫小便熱痛實則肩背暴腫汗出虛則肩背寒栗少氣不足以息四肢厥逆瘛瘲尸厥若患偏風灸至百壯若患腕勞灸七七壯甚妙千金云男子陰中疼痛尿血精出灸五十壯玉龍賦云兼太淵治咳嗽風痰攔江賦云頭部痛須尋之痰涎壅塞咽乾宜此席弘賦云氣刺兩乳求太淵未應須瀉此穴偏正頭疼求此又須重瀉太淵無不應通玄賦云堪治咳嗽寒痰四總穴云頭項須尋列缺千金十一穴云後溪並列缺治胸項有痛馬丹陽天星十二穴云此穴善療偏頭患遍身風痹麻痰涎頻上壅口噤不開牙若能明補瀉應手疾如拿經渠在寸口陷中手太陰所行為經刺三分留三呼禁灸灸則傷人神明主治痎瘧寒熱胸背拘急膨脹喉痹咳逆上氣數欠傷寒熱病汗不出心痛嘔吐百證賦云兼大都治熱病汗不出太淵在手掌後陷中手太陰所注為腧即原也脈會太淵每日平旦寅時脈從此始故一難曰寸口者脈之大會刺二分留二呼灸三壯主治胸痹氣逆咳嗽嘔噦飲水肺脹喘息不休噫氣咳血心痛咽乾煩躁狂言不得臥目痛生翳赤筋口噼缺盆痛肩背痛引臂髆溺色變遺失無度神農經曰治牙疼手腕無力疼痛可灸七壯玉龍賦云兼列缺治咳嗽風痰席弘賦云氣刺兩乳求太淵未應之時針列缺又云偏正頭疼尋列缺重瀉太淵無不應又云五般肘痛尋尺澤太淵針後卻收功魚際在手大指本節後內側陷中又云散脈中白肉際手太陰所溜為滎刺二分留三呼灸三壯主治酒病身熱惡風寒虛熱舌上黃頭痛咳噦傷寒汗不出痹走胸背痛不得息目眩煩心少氣寒栗喉咽乾燥嘔血唾血心痹悲恐腹痛食不下乳癰肢滿肘攣溺出及瘧方欲寒刺手足太陰陽明出血席弘賦云此穴兼承山崑崙治轉筋目眩百證賦云兼液門能治喉痛一傳此穴兼經渠通里可治汗不出者便得淋漓更兼三間三里便得汗至遍身一傳齒痛不能食飲左患灸左右患灸右男三女四少商在手大指內側端去爪甲角如韭葉白肉際宛宛中手太陰所出為井刺一分留三呼五吸宜用三稜針刺微出血泄諸臟之熱不宜灸甲乙經云灸一壯一云三壯忌生冷主治項腫喉痹煩心嘔噦心下滿汗出咳逆痎瘧振寒腹脹腸滿雀目不明唇乾唾沫引飲食不下寒栗鼓頷手攣指痛小兒乳蛾唐刺史成君綽忽項腫如升喉閉水粒不下甄權以三稜針刺之微出血立愈乾坤生意云此為十井穴凡初中風卒暴昏沉痰涎壅盛不省人事牙關緊閉藥水不下急以三稜針刺此穴及少衝中衝關衝少澤商陽使血氣流行乃起死回生急救之妙穴太乙歌云男子痃癖取少商百證賦云兼曲澤治血虛口乾天星祕訣云專治指痛攣急手陽明大腸經穴大腸經穴歌手陽明穴起商陽二間三間合谷藏陽溪偏歷歷溫溜下廉上廉三里長曲池肘髎迎五里臂臑肩髃巨骨起天鼎扶突接禾髎終以迎香二十止商陽一名絶陽在手食指內側去爪甲角如韭葉手陽明所出為井刺一分留一呼灸三壯主治胸中氣滿喘咳熱病汗不出耳鳴耳聾寒熱痎瘧口乾頤腫齒痛目盲惡寒肩背肢臂腫痛相引缺盆中痛灸三壯左取右右取左如食頃立已百證賦云兼太溪治寒瘧有驗乾坤生意云此為十井穴凡初中風跌倒卒暴昏沉痰盛不省人事牙關緊閉藥水不下急以三稜針刺此穴及少商中衝少衝使血氣流通乃急救回生之妙穴二間一名間谷在食指本節前內側陷中手陽明所溜為滎刺三分留六呼灸三壯主治頷腫喉痹肩背臑痛鼽衄齒痛目黃口乾口眼歪斜飲食不通振寒傷寒水結玉龍賦云治牙疼妙席弘賦云兼陽溪治牙疼腰痛咽痹百證賦云兼陰郤能疏通寒栗惡寒通玄賦云治目昏不見天星祕訣云兼三里治牙疼頭痛喉痹三間一名少谷在食指本節後內側陷中手陽明所注為腧刺三分留三呼灸二壯主治鼽衄熱病喉痹咽中如梗下齒齲痛嗜臥胸腹滿腸鳴洞泄寒熱瘧唇焦口乾氣喘目眥痛善驚寒熱結水多唾席弘賦云兼腎俞善除背痛風勞百證賦云兼攢竹治目中之漠漠捷徑云治身熱氣喘口乾目急合谷一名虎口在手大指次指岐骨間陷中手陽明所過為原刺三分留六呼灸三壯主治傷寒大渴脈浮在表發熱惡寒頭痛脊強風疹寒熱痎瘧熱病汗不出偏正頭痛面腫目翳唇吻不收喑不能言口噤不開腰脊引痛痿躄小兒乳蛾一云能下死胎婦人妊娠補合谷即墮胎千金云産後脈絶不還刺合谷入三分急補之神農經云治鼻衄目痛不明牙疼喉痹疥瘡可灸三壯至七壯攔江賦云傷寒無汗瀉合谷補復溜若汗多不止便補合谷瀉復溜神效席弘賦云兼太衝治手連肩脊痛難忍又兼曲池治兩手不如意又云睛明治眼若未效合谷光明不可缺又云冷嗽先宜補合谷又須針瀉三陰交百證賦云兼天府治鼻衄天星祕訣云兼三陰交治脾病血氣又云兼內庭治寒瘧面腫及腸鳴四總穴云面口合谷收千金十一穴云曲池兼合谷可徹頭疼馬丹陽天星十二穴云頭疼並面腫瘧病熱還寒體熱身汗出目暗視茫然齒齲鼻衄血口噤不開言針入五分深能令病自安陽溪一名中魁在手腕中上側兩筋間陷中手陽明所行為經刺三分留七呼灸三壯主治狂言喜笑見鬼熱病煩心掌中熱汗不出目赤爛翳厥逆頭痛胸滿不得息寒熱痰瘧嘔沫喉痹耳鳴齒痛驚掣肘臂不舉痂疥席弘賦云兼二間治牙疼腰痛喉痹百證賦云兼解溪治驚悸怔忡又云兼肩髃能消癮風之熱極偏歷在手腕後三寸手陽明絡別走太陰刺三分留七呼灸三壯主治痎瘧寒熱癲疾多言目視䀮䀮耳鳴喉痹口喎咽乾鼻衄齒痛汗不出標幽賦云刺偏歷利小便治大人水蠱溫溜一名逆注一名蛇頭在手腕後小士五寸大士六寸大士小士謂大人小兒也明堂云腕後五寸六寸間手陽明郤刺三分灸三壯主治傷寒噦逆噫隔氣閉寒熱頭痛喜笑狂言見鬼吐沫口舌腫痛喉痹面虛腫腸鳴腹痛四肢腫疼肩不得舉百證賦云兼期門治傷寒項強下廉在曲池下四寸輔骨下去上廉一寸輔兌肉其分外斜刺五分留五呼灸三壯主治勞瘵狂言頭風痹痛飧泄小腹滿小便血小腸氣面無顏色痃癖腹痛不可忍食不化氣喘涎出乳癰此穴主瀉胃中之熱與氣衝三里巨虛上廉治同上廉在三里下一寸曲池下三寸其分獨抵陽明之會外斜刺五分灸五壯主治腦風頭痛胸痛喘息半身不遂腸鳴小便澀大腸氣滯手足不仁此穴主瀉胃中之熱與氣衝三里巨虛下廉治同三里一名手三里在曲池下二寸兌肉之端按之肉起刺三分灸三壯主治中風口僻手足不隨五勞虛乏羸瘦霍亂遺失失音齒痛頰腫瘰癧手痹不仁席弘賦云此穴治腰背痛連臍不休下針麻重須瀉得氣不用留又云手足上下針三里食癖氣塊憑此取百證賦云兼少海治手臂麻頑通玄賦云專治肩背痛曲池在肘外輔骨屈肘曲骨之中以手拱胸取之手陽明所入為合刺七分留七呼灸三壯一云百壯主治傷寒振寒餘熱不盡胸中煩滿熱渴目眩耳痛瘰癧喉痹不能言瘛瘲癲疾繞踝風手臂紅腫肘中痛偏風半身不遂風邪泣出臂膊痛筋緩無力屈伸不便皮膚乾燥痂疥婦人經脈不通神農經云治手肘臂膊疼細無力半身不遂發熱胸前煩滿可灸十四壯玉龍賦云兼人中可治痿僕兼尺澤治肘痛標幽賦云兼肩井甄權刺臂痛而復射百證賦云遠達陽陵治半身不遂又云兼少衝治發熱驗席弘賦云兼合谷治兩手不如意千金云治癭惡氣諸癮疹灸隨年壯又十三鬼穴此名鬼臣若遇百邪癲狂當於第十二次下火針千金十一穴云此與合谷可徹頭疼秦承祖明堂云主大人小兒遍身風疹痂疥馬丹陽天星十二穴云善治肘中痛偏風手不收挽弓開不得臂瘓莫梳頭喉痹促欲死發熱更無休遍身風癬癩針著即時瘳肘髎在肘大骨外廉陷中與天井相併相去一寸四分刺三分灸三壯主治肘節風痹臂痛不舉麻木不仁嗜臥五里在肘上三寸行向里大脈中央一云在天府下五寸禁刺灸三壯一曰十壯玉版篇曰迎之五里中道而止五至而已五往而臟之氣盡矣小針解曰奪陰者死言取尺之五里五往者也皆謂此穴主治風勞驚恐吐血咳嗽嗜臥肘臂疼痛難動脹滿氣逆寒熱瘰癧目視䀮䀮痎瘧百證賦云兼臂臑能愈瘰癧臂臑在肘上七寸䐃肉端肩髃下一寸兩筋兩骨罅宛宛陷中平手取之手陽明絡也絡手少陽之臑會一曰手足太陽陽維之會刺三分灸三壯明堂禁刺灸七壯一曰灸至百壯主治臂痛無力寒熱瘰癧頸項拘急千金云治癭氣灸隨年壯百證賦云兼五里能愈瘰癧肩髃一名中肩井一名偏肩在膊骨頭肩端上兩骨罅陷中舉臂取之有空手太陽陽明陽蹺之會一曰足少陽陽蹺之會刺六分留六呼灸三壯至七七壯以瘥為度主治中風偏風半身不遂肩臂筋骨痠痛不能上頭傷寒作熱不已勞氣泄精憔悴四肢熱諸癭氣瘰癧昔有病風痹臂痛無力不能挽弓甄權於此進針即可射此穴若灸偏風不遂自七壯至七七壯止不可過多恐致臂細若風病筋骨無力久不瘥當多灸不畏細也然灸不如刺忌酒肉五辛漿水此穴主瀉四肢之熱與雲門委中腰俞治同千金云灸癭氣左右相當男左十八右十七壯女右十八左十七壯再三以瘥止玉龍賦云可療風濕摶於兩肩天星祕訣云手臂攣痛取肩髃百證賦云兼陽溪能消癮風之熱極巨骨在肩尖上行兩叉骨間陷中手陽明陽蹺之會刺一寸五分灸三壯五壯一曰禁刺主治驚癇吐血胸中有瘀血臂痛不得屈伸天鼎在頸中缺盆上直扶突後一寸甲乙經曰直扶突氣舍後一寸五分氣府論注曰在扶突後半寸刺三分灸三壯主治喉痹嗌腫不得食暴喑氣哽百證賦云兼間使治失音扶突一名水穴在頸當曲頰下一寸甲乙經曰在人迎後一寸五分仰而取之一雲氣舍後一寸五分由此上貫頰入下齒中刺四分灸三壯甲乙經曰刺三分主治咳嗽多唾上氣喘息喉中如水雞暴喑氣破項癭禾髎一名長頻直鼻孔下夾水溝旁五分刺三分灸三壯主治尸厥口不可開鼻瘡息肉鼻塞鼽衄靈光賦云刺兩鼻鼻翁衄迎香一名衝陽在禾髎上一寸鼻孔旁五分手足陽明之會刺三分禁灸主治鼻塞不聞香臭瘜肉多涕有瘡鼽衄喘息不利偏風喎斜浮腫風動面癢狀如蟲行玉龍賦云能消眼熱之紅又攻鼻窒為最席弘賦云耳聾氣痞針聽會更瀉此穴足陽明胃經穴胃經穴歌四十五穴足陽明承泣四白巨髎經地倉大迎登頰車下關頭維對人迎水突氣舍連缺盆氣戶庫房屋翳屯膺窗乳中下乳根不容承滿出梁門關門太乙滑肉起天樞外陵大巨里水道歸來達氣衝髀關伏兔走陰市梁丘犢鼻足三里上巨虛連條口底下巨虛下有豐隆解溪衝陽陷谷同內庭厲兌陽明穴大指次指之端終承泣一名面髎一名鼷穴在目下七分上直瞳子陷中陽蹺任脈足陽明三脈之會刺三分禁灸一曰禁不宜針主治冷淚出瞳子癢遠視䀮䀮昏夜無見口眼喎斜四白在目下一寸直瞳子向頄骨顴空正視取之刺三分禁灸甲乙經曰灸七壯一曰下針宜慎若深即令人目烏色主治頭痛目眩目赤生翳瞤動流淚眼弦癢口眼喎僻不能言巨髎挾鼻孔旁八分直瞳子陽蹺足陽明之會由此入上齒中復出循地倉刺三分灸七壯主治瘛瘲唇頰腫痛口喎目瞕青盲無見遠視䀮䀮面風鼻䪼腫腳氣膝脛腫痛百證賦云兼腎俞治胸膈停留瘀血地倉一名會維夾口吻旁四分外如近下微有動脈若久患風其脈亦有不動者手足陽明任脈陽蹺之會刺三分留五呼灸七壯或二七壯重者七七壯病左治右病右治左艾炷宜小如粗叉腳若過大口反喎卻灸承漿即愈主治偏風口眼歪斜牙關不開齒痛頰腫目不得閉失音不語飲食不收水漿漏落眼瞤動遠視䀮䀮昏夜無見靈光賦云地倉能止口流涎玉龍賦云兼頰車療口喎大迎一名髓孔在曲頷頷腮下也前一寸三分骨陷中動脈本經自大迎循頰車上耳前下關頭維其支者從大迎前下人迎寒熱病篇曰臂陽明有入鳩遍齒者名曰大迎則此為手足陽明之會刺三分留七呼灸三壯主治風痙口喑口噤不開唇吻瞤動頰腫牙痛舌強不能言目痛不得閉口喎數欠風壅面腫寒熱瘰癧百證賦云兼顴髎治目眩頰車一名機關一名曲牙在耳下曲頰端近前陷中側臥開口取之刺三分灸三壯一曰灸七壯至七七壯炷如小麥主治中風牙關不開失音不語口眼歪斜頰腫牙痛不可嚼物頸強不得回顧凡口眼喎斜者喎則左瀉右補斜則左補右瀉靈光賦云針齒痛玉龍賦云兼地倉療口喎下關在客主人下耳前動脈下廉合口有空開口則閉側臥閉口取之足陽明少陽之會刺三分留七呼灸三壯本輸篇曰刺之則欠不能呿者此也耳中有干擲禁不可灸一曰不可久留針擲一作䘓音摘主治偏風口眼喎斜耳鳴耳聾痛癢出膿失欠牙關脫臼頭維在額角入髮際挾本神旁一寸五分神庭旁四寸五分足少陽陽明之會刺三分沒皮向下禁灸主治頭風疼痛如破目痛如脫淚出不明玉龍賦云兼攢竹能治目疼頭痛百證賦云兼臨泣可治淚出人迎一名天五會在頸下挾結喉旁一寸五分大動脈應手仰而取之足陽明少陽之會甲乙經曰挾結喉以候五臟氣禁灸氣府論注曰刺可入四分過深殺人主治吐逆霍亂胸滿喘呼不得息項氣悶腫食不下針入四分天星祕訣云耳鳴腰痛先此後耳門及三里水突一名水門在頸大筋前直人迎下挾氣舍上內貼氣喉刺三分灸三壯主治咳逆上氣咽喉癰腫短氣喘息不得臥氣舍在頸大筋前直人迎下挾天突邊陷中貼骨尖上有缺刺三分灸五壯主治咳逆上氣肩腫項強不能回顧喉痹哽咽食飲不下癭瘤缺盆一名天蓋在肩上橫骨陷者中為五臟六腑之道刺三分留七呼灸三壯刺太深令人逆息孕婦禁針主治喘急息賁咳嗽胸滿水腫瘰癧寒熱缺盆中腫外潰傷寒胸中熱不已喉痹汗出一曰主瀉胸中之熱治與大杼中府風府同氣戶在巨骨下挾俞府兩旁各二寸去中行四寸陷中仰而取之刺三分灸三壯五壯主治咳逆上氣胸背痛支滿喘急不得息不知味席弘賦云此穴攻噎若不愈兼灸氣海百證賦云兼華蓋穴除脅肋痛有驗庫房在氣戶下一寸六分去中行四寸陷中仰而取之刺三分灸三壯五壯主治胸脅滿咳逆上氣呼吸不利唾膿血濁沫屋翳在庫房下一寸六分去中行四寸陷中仰而取之刺三分灸五壯主治咳逆上氣唾膿血濁痰身腫皮膚痛不可近衣淫濼瘛瘲不仁百證賦云兼至陰穴治遍身風癢之疼多膺窗在屋翳下一寸六分巨骨下四寸八分去中行四寸陷中仰而取之刺四分灸五壯主治胸滿短氣不得臥腸鳴注泄乳癰寒熱乳中當乳之中微刺禁灸甲乙經曰禁不可刺氣府論注曰刺灸之生蝕瘡瘡中有清汁膿血者可治瘡中有瘜肉若蝕瘡者死一傳胎衣不下以乳頭向下盡處俱灸之即下乳根在乳中下一寸六分去中行四寸陷中仰而取之刺三分灸三壯五壯主治胸下滿痛臂痛乳痛悽悽寒熱霍亂轉筋四厥神農經云治胸下滿痛上氣喘急可灸七壯玉龍賦云兼俞府治氣嗽痰哮捷徑云治憂噎華他明堂云主膈氣不下食噎病千金云治反胃吐食上氣灸兩乳下各一寸以瘥為度居家必用云灸咳逆凡久病得咳逆最為惡候其法於乳下一指許正與乳相直間陷中女人即屈乳頭度之乳頭齊處是穴艾炷如小豆許灸三壯男左女右火到肌即瘥不瘥則不可治不容在第四肋端幽門旁一寸五分去中行二寸對巨闕甲乙經曰去任脈二寸至兩肘端相去四寸按甲乙經曰腹自不容以下至氣衝二十四穴挾幽門兩旁各一寸五分諸書皆同及考幽門則止去中行五分是不容以下諸穴當去中行二寸而諸云三寸者非今悉改為二寸刺五分灸五壯主治腹滿痃癖胸背肩脅引痛心痛唾血喘嗽嘔吐痰癖腹虛鳴不嗜食疝瘕承滿在不容下一寸去中行二寸對上脘刺三分灸五壯甲乙經云刺八分主治腹脹腸鳴脅下堅痛上氣喘急食飲不下肩息隔氣唾血千金云夾巨闕相去五寸名承滿主腸中雷鳴相逐痢下灸五十壯梁門在承滿下一寸去中行二寸對中脘刺三分灸五壯甲乙經作刺八分孕婦禁灸主治胸脅積氣飲食不思氣塊疼痛大腸滑泄完穀不化可灸七壯至二十一壯關門在梁門下一寸去中行二寸對建里刺八分灸五壯一云五分三壯主治積氣脹滿腸鳴切痛泄痢不食走氣挾臍急痛痎瘧振寒遺溺太乙在關門下一寸去中行二寸對下脘刺八分灸五壯一云五分三壯主治心煩癲狂吐舌滑肉門在太乙下一寸天樞上一寸去中行二寸對水分刺八分灸五壯一云五分三壯主治癲狂嘔逆吐血重舌舌強天樞一名長溪一名谷門挾臍旁二寸去肓俞一寸五分陷中大腸募也刺五分留七呼灸五壯拔萃云百壯千金云魂魄之舍不可針孕婦不可灸主治奔豚泄瀉赤白痢水痢不止食不化水腫腹脹腸鳴上氣衝胸不能久立久積冷氣繞臍切痛時上衝心煩滿嘔吐霍亂寒瘧不嗜食身黃瘦女人癥瘕血結成塊漏下月水不調淋濁帶下千金云久冷及婦人癥癖小便不通腸鳴瀉痢繞臍絞痛灸百壯三報之又云吐血腹痛雷鳴灸百壯又云狂言恍惚灸百壯又云霍亂先下痢灸二七壯不瘥更二七壯男左女右標幽賦云治虛損百證賦云兼水泉治月潮違限一傳治挾膝疼痛腹中氣塊久瀉不止虛損勞弱可灸二十一壯外陵在天樞下一寸去中行二寸對陰交刺三分灸五壯甲乙經作刺八分主治腹痛心下如懸下引臍痛大巨一名腋門在天樞下二寸去中行二寸對石門刺五分灸五壯甲乙經刺八分主治小腹脹滿煩渴小便難㿉疝四肢不收驚悸不眠水道在大巨下三寸去中行二寸刺一寸五分灸五壯一曰刺八分半主治肩背強急痠痛三焦膀胱腎氣熱結大小便不利疝氣偏墜婦人小腹脹痛引陰中月經至則腰腹脹痛胞中瘕子門寒千金云主三焦膀胱腎中熱氣灸隨年壯百證賦云兼筋縮專治脊強歸來一名溪穴在水道下二寸去中行二寸刺八分灸五壯一曰刺二分半主治奔豚九疝陰丸上縮入腹引痛婦人血藏積冷氣衝一名氣街在歸來下鼠溪上一寸動脈應手宛宛中去中行二寸骨空論王氏注曰在毛際兩旁鼠鼷上一寸脈動處也刺禁論王氏注曰氣街之中膽胃脈也膽之脈循脅裡出氣街繞毛際胃之脈挾臍入氣街中衝脈所起刺三分留七呼灸七壯甲乙經曰灸之不幸使人不得息一云禁不可針艾炷如大麥主治逆氣上攻心腹脹滿不得正臥奔豚㿗疝淫濼大腸中熱身熱腹痛陰腫莖痛婦人月水不利小腹痛無子妊娠子上衝心産難胞衣不下一云此穴主瀉胃中之熱與三里巨虛上下廉同千金云治石水灸然谷氣衝四滿章門百證賦云兼衝門治帶下産崩東垣曰主血多諸證以三稜針刺此穴出血立愈髀關在膝上伏兔後交文中一云在膝上一尺二寸刺六分灸三壯一云刺三分禁灸主治腰痛膝寒足麻木不仁黃疸痿痹股內筋絡急小腹引喉痛伏兔在膝上六寸起肉間正跪坐而取之一云在膝蓋上七寸左右各三指按捺上有肉起如兔狀因以此名刺五分禁灸千金云狂邪鬼語灸百壯亦可五十壯主治腳氣膝冷不得溫風痹婦人八部諸疾陰市一名陰鼎在膝上三寸伏兔下陷中拜而取之一云在膝內輔骨後大筋下小筋上屈膝得之刺三分留七呼禁灸刺腰痛論注曰伏兔下陷者中灸三壯即此主治腰膝寒如注水痿痹不仁不得屈伸寒疝小腹痛滿少氣千金云水腫大腹灸隨年壯玉龍賦云兼風市能驅腿足之乏力通玄賦云膝胻痛陰市能醫靈光賦云專治兩足拘攣席弘賦云心疼手顫少海間若要除根覓陰市梁丘在膝上二寸兩筋間足陽明郤刺三分灸三壯主治腳膝痛冷痹不仁不可屈伸足寒大驚乳腫痛神農經云治膝痛屈伸不得可灸三壯七壯犢鼻在膝臏下胻骨上骨解大筋陷中形如牛鼻故名一曰在膝頭下近外窟解中刺六分灸三壯一曰刺三分刺禁論曰刺膝臏出液為跛故刺此者不可輕也主治膝痛不仁難跪起腳氣若膝臏癰腫潰者不可治不潰者可療若犢鼻堅硬勿便攻之先用洗尉而後微刺之愈靈光賦云善治風邪濕三里即下陵出本輸篇在膝眼下三寸胻骨外廉大筋內宛宛中坐而豎膝低跗取之極重按之則跗上動脈止矣足陽明所入為合刺五分留七呼灸三壯千金云灸二百壯至五百壯一云小兒忌灸三里三十外方可灸不爾反生疾秋月不宜出血恐土虛也主治胃中寒心腹脹痛逆氣上攻臟氣虛憊胃氣不足惡聞食臭腹痛腸鳴食不化大便不通腰痛膝弱不得俯仰小腸氣此穴主瀉胃中之熱與氣衝巨虛上下廉同秦承祖曰諸病皆治食氣水氣蠱毒痃癖四肢腫滿膝胻痠痛目不明華他云療五勞七傷羸瘦虛乏瘀血乳癰外臺明堂云人年三十以外若不灸三里令氣上衝目使眼無光蓋以三里能下氣也一傳心疼者灸此穴及承山立愈以其中有瘀血故瀉此則愈千金云三里內庭治肚腹病妙又身重腫坐不欲起風勞腳疼灸五十壯刺五分補之又邪病大呼罵走三里主之名鬼邪神農經云治心腹脹滿胃氣不足飲食不化痃癖氣塊吐血腹內諸疾五勞七傷灸七壯太乙歌云兼束骨刺治項強腫痛體重腰癱玉龍賦云兼絶骨三陰交能治連延腳氣又治心悸虛煩又兼水分陰交蠱脹宜刺又合太衝中封治行步艱楚百證賦云兼陰交治中邪霍亂靈光賦云治氣上壅又兼陽陵陰陵申脈照海治腳氣及在腰之疾席弘賦云治手足上下疾亦治食癖氣塊又云虛喘宜尋三里中又胃中有積刺璇璣此穴功亦多又氣海專治五淋又須針三里又治耳內蟬鳴腰欲折須兼五會補瀉之始妙又云若針肩井須三里不刺之時氣未調又治腰連胯痛又治腳腫腳痛須兼懸鐘陽陵陰陵三陰交太衝行氣並治指頭麻木又腕骨腿疼瀉此穴又兼風府針度淺深更尋三里治膀胱氣未散通玄賦云能卻五勞之羸瘦又云治冷痹捷法云治食不充肌天星祕訣云耳鳴腰痛先五會後耳門三里又云胃停宿食後尋三里起璇璣又云兼二間治牙疼頭痛並喉痹又云兼期門治傷寒過經不出汗四總穴云肚腹三里留馬丹陽天星十二穴云能除心脅痛腹脹胃中寒腸鳴並泄瀉眼腫膝脛酸傷寒羸瘦損氣蠱及諸般年過三旬後針灸眼光全增治法云治五勞七傷腰痛不舉喉痹脅間暴痛不得息咳嗽多痰足痿足熱腹中瘀血水腫陰氣不足熱病汗不出喜嘔口乾身反折口噤鼓頷胃氣不足聞食即吐泄痢水穀不化消渴遺尿失氣陽厥惡寒頭眩小便不利悉宜針灸上巨虛一名巨虛上廉在三里下三寸兩筋骨陷中舉足取之海論曰衝脈者其輸下出於巨虛之上下廉巨虛上廉足陽明與大腸合上廉屬大腸下廉屬小腸出本輸篇及邪氣臟腑病形篇刺三分灸三壯甲乙經作刺八分千金云灸以年為壯數主治臟氣不足偏風腳氣腰腿手足不仁足脛酸骨髓冷疼不能久立挾臍腹痛腸中切痛飧泄食不化喘息不能行腹脅支滿狂走此穴主瀉胃中之熱與氣衝三里下巨虛治同條口在三里下五寸下廉上一寸舉足取之刺五分灸三壯甲乙經云刺八分主治足膝麻木寒酸腫痛趺腫轉筋濕痹足下熱足緩不收不能久立天星祕訣云兼衝陽絶骨治足緩難行下巨虛一名巨虛下廉在上廉下三寸兩筋骨陷中蹲地舉足取之巨虛下廉足陽明與小腸合又為衝脈下輸刺三分灸三壯一曰刺八分主治胃中熱毛焦肉脫汗不得出少氣不嗜食暴驚狂言喉痹面無顏色胸脅痛飧泄膿血小腸氣偏風腿痿足不履地熱風風濕冷痹胻腫足跗不收女子乳癰此穴主瀉胃中之熱與氣衝三里上巨虛同豐隆在外踝上八寸下廉胻骨外廉陷中足陽明絡別走太陰刺三分灸三壯主治頭痛面腫喉痹不能言風逆癲狂見鬼好笑厥逆胸痛如刺大小便難怠惰腿膝痠痛屈伸不便腹痛肢腫足清寒濕太乙歌云兼上脘刺心疼嘔吐傷寒吐蛔玉龍賦云兼肺俞治痰嗽又云合湧泉關元可治尸勞席弘賦云專治婦人心痛百證賦云兼強間治頭痛難禁解溪在衝陽後一寸五分足腕上繫鞋帶處陷中一曰在足大指次指直上跗上陷者宛宛中刺瘧論注曰在衝陽後三寸半氣穴論注曰二寸半甲乙經曰一寸半足陽明所行為經刺五分留五呼灸三壯主治風氣面浮頭痛目眩生翳厥氣上衝喘咳腹脹顛疾煩心悲泣驚瘛轉筋霍亂大便下重股膝胻腫又瀉胃熱善飢不食食即支滿腹脹及療痎瘧寒熱須兼刺厲兌三里解溪商丘出血神農經云治腹脹腳腕痛目眩頭疼可灸七壯玉龍賦云兼商丘丘墟堪追腳痛百證賦云兼陽谷治驚悸怔忡一傳腹虛腫及足脛虛腫灸之效一傳氣逆發噎將死灸之效衝陽一名會原即仲景所謂趺陽也在足跗上五寸高骨間動脈去陷谷二寸足陽明所過為原刺三分留十呼灸三壯刺禁論曰刺跗上中大脈血出不止死即此穴也主治偏風面腫口眼喎斜齒齲傷寒發狂振寒汗不出腹堅大不嗜食發寒熱足痿跗腫或胃瘧先寒後熱喜見日月光得火乃快然者於方熱時刺之出血立寒天星祕訣云兼條口絶骨治足緩難行陷谷在足大指次指外間本節後陷中去內庭二寸足陽明所注為腧刺五分留七呼灸三壯一曰刺三分主治面目浮腫及水病善噫腸鳴腹痛汗不出振寒痎瘧疝氣少腹痛或胃脈弦者瀉此則水平而胃氣自盛千金云治水病灸隨年壯百證賦云兼下脘能平腹內腸鳴內庭在足大指次指外間陷中足陽明所溜為滎刺三分留十呼灸三壯甲乙經云刺二分留二十呼主治四肢厥逆腹滿不得息惡聞人聲振寒咽痛口喎齒齲鼻衄癮疹赤白痢瘧不嗜食一傳主療久瘧不愈並腹脹玉龍賦云兼臨泣能理小腹之䐜通玄賦云治腹膨休遲千金十一穴云三里內庭治肚腹病妙捷經云治石蠱又云大便不通宜瀉此天星祕訣云兼合谷治寒瘧面腫及腸鳴馬丹陽天星十二穴云能治四肢厥喜靜惡聞聲癮疹咽喉痛數欠及牙疼瘧疾不思食耳鳴針便清厲兌在足大指次指端去爪甲如韭葉按本輸篇曰厲兌者足大指內次指之端也經脈經筋等篇俱雲中指繆刺篇曰邪客於足陽明之絡刺足中指次指爪甲上各一痏據此諸篇之説可見中指次指之間皆陽明脈氣所發也足陽明所出為井刺一分留一呼灸一壯主治尸厥口噤氣絶狀如中惡心腹滿水腫熱病汗不出寒熱瘧不食面腫喉痹齒齲惡風鼻不利多驚發狂好臥足寒膝臏腫痛百證賦云與隱白相諧治夢魘不寧足太陰脾經穴脾經穴歌足太陰脾由足拇隱白先從內側起大都太白繼公孫商丘直上三陰