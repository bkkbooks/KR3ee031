body:
  text: 類經附翼卷二律原宮音五音之首其聲極長極下極濁徵音宮所生其聲次短次高次清商音徵所生其聲次長次下次濁羽音商所生其聲極短極高極清角音羽所生其聲在長短高下清濁之間此圖長律下生短律短律上生長律下生者皆左旋隔八上生者皆右旋隔六律解樂者天地之和氣也律呂者樂之聲音也蓋人有性情則有詩辭有詩辭則有歌詠歌詠生則被之五音而為樂音樂生必調之律呂而和聲書曰詩言志歌永言聲依永律和聲此之謂也是律也者出乎聲音而為正樂之具也樂記曰樂者音之所由生也其本在人心之感於物也是故其哀心感者其聲噍以殺其樂心感者其聲嘽以緩其喜心感者其聲發以散其怒心感者其聲粗以厲其敬心感者其聲直以廉其愛心感者其聲和以柔六者非性也感於物而後動也又曰治世之音安以樂其政和亂世之音怨以怒其政乖亡國之音哀以思其民困聲音之道與政通矣是故知律呂聲音之道者可以行天地人事也律呂相感而聲音生天地萬物之情見於此矣噍音焦殺音賽嘽昌展切律原律乃天地之正氣人之中聲也律由聲出音以聲生禮曰聲成文謂之音音之數五律之數六分陰分陽則音以宮商角徵羽分太少而為十故音以應日律以黃鐘太簇姑洗蕤賓夷則無射為陽是為六律林鐘南呂應鐘大呂夾鍾仲呂為陰是為六呂合而言之是為十二律故律以應辰一律所生各有五音十二律而生六十音因而六之六六三百六十音以當一歲之日故曰律歷之數天地之道也然律呂皆生於黃鐘而黃鐘為萬事之本一陽之律也黃者土德之色鍾者氣之所種所以言其本也律生於冬至氣起於一陽所以言其始也故黃鐘之聲中而正合德於土也黃鐘之音重而濁發聲於初也觀康節先生冬至吟曰冬至子之半天心無改移一陽初起處萬物未生時玄酒味方淡太音聲正希此言如不信更請問庖犧夫玄酒方淡指天一之初生太音正希謂黃鐘之將起知乎此則知黃鐘之為義矣黃鐘為萬事本歐陽子曰造律者以黍一黍之廣積為分寸以著於度一黍多少積為圭合以著於量一黍銖兩積為輕重以著於權衡三者皆起於黃鐘故曰萬事之本鄭世子曰夫度量權量所以取法於黃鐘者蓋貴其與天地之氣相應也朱子所謂與先天圖一般者夫先天圖者河圖雒書也河圖之位十天地之體數也雒書之位九天地之用數也蓋一切萬事不離陰陽圖書二義則陰陽之道盡矣是為律歷之本原數學之鼻祖也故古人算律之妙惟此二種而已一以縱黍之長為分九分為寸九寸為黃鐘九而九之得八十一分取象雒書之九自相乘之數也是為律本此載於淮南子者一以橫黍之廣為分十分為寸十寸為黃鐘十而十之得百分取象河圖之十自相乘之數也是為度母此載於太史公者二術雖異其律則同蓋縱黍之八十一分適當橫黍之百分而橫黍之廣適與縱黍之長相合耳此河圖之偶雒書之奇參伍錯綜而律度方備誠天地自然之妙非由人力安排者也二法之外本無九十分為黃鐘者至於劉歆班固乃以九十分為黃鐘是又合於斜黍度者推原其誤蓋自京房始房時去古未遠明知古法九分為寸以其布算頗煩初學難曉乃創為之法而變九為十故前後漢志皆云九寸今人宗九寸不宗余法者惑於漢志之偏見耳苟能變通而不惑於一偏則縱橫斜黍皆合黃鐘之律矣辨黍唐禮樂志曰聲無形而樂有器古之作樂者知夫器之必有敝而聲不可以言傳懼夫器失而聲遂忘也乃多為之法以著之故求聲者以律而造律者以黍自一黍之廣積而為分寸一黍之多積而為籥合一黍之重積而為銖兩是三物者亦必有時而敝則又總其法而著之於數使其分寸籥合銖兩皆起於黃鐘然後律度量衡相用為表裡使得律者可以制度量衡因度量衡亦可以制律此古君子知物之終始而憂世之慮深其多為之法而丁寧纖悉可為至矣然黃鐘之律生於尺而尺乃生於黍纍黍造尺不過三法皆自古有之曰橫黍者一黍之廣為一分也曰縱黍者一黍之長為一分也曰斜黍者非縱非橫而斜倚相排也凡黃鐘之長以橫黍言之則為一百分太史公所謂子一分是也以縱黍言之則為八十一分淮南子所謂其數八十一是也以斜黍言之則為九十分前後漢志所謂九十分是也三法雖異而律則同也擇黍之法以上黨境內土地肥處産者為佳即今之糯小米俗名黃米者是也鄭世子曰古上黨郡即今山西潞安州境內産五色黍其黑色黍亦有數種軟黍堪釀酒者名秬硬黍堪炊飯者名穄一稃內兩顆黍名秠律家所用惟秬而已古云取秬黍中者蓋謂中用之黍非中等之謂如俗語選物曰中用不中用亦非指中等也或曰中字讀去聲謂中式也其義亦通詩曰誕降嘉種惟秬惟秠既用一嘉字其義可見則知異常者方為嘉種且秬之為言巨也蓋謂最大者為佳黍大則尺大而黃鐘之聲遂濁黍小則尺小而黃鐘之聲遂清夫黃鐘之音宮音也最長最濁是其本體然則黍之最大者乃為真秬黍耳後人不知此理而泥於漢志中黍之文遂致所纍之尺短所造之樂哀非中和之音矣此不可不辨也籥音藥秬音巨穄音祭稃音夫秠飄米切律候陰陽相生鄭世子曰按陽律生陰下生陰律生陽上生陰陽之分古有二說其一說者十二律呂各照方位在子午以東屬陽子午以西屬陰是故子黃鐘一陽復卦醜大呂二陽臨卦寅太簇三陽泰卦卯夾鍾四陽大壯卦辰姑洗五陽夬卦巳仲呂六陽乾卦午蕤賓一陰姤卦未林鐘二陰遁卦申夷則三陰否卦酉南呂四陰觀卦戌無射五陰剝卦亥應鐘六陰坤卦乾為老陽故仲呂亢極不生坤為老陰故應鐘極短為終大呂夾鍾仲呂三呂以陰居陽故皆屬陽蕤賓夷則無射三律以陽居陰故皆屬陰凡律清者皆上生濁者皆下生此一說也又一說云六律數奇屬陽六呂數偶屬陰是故子黃鐘乾之初九寅太簇乾之九二辰姑洗乾之九三午蕤賓乾之九四申夷則乾之九五戌無射乾之上九此六律數奇各居本位屬陽也醜林鐘坤之初六卯南呂坤之六二巳應鐘坤之六三未大呂坤之六四酉夾鍾坤之六五亥仲呂坤之上六此六呂數偶各居對衝屬陰也居本位者皆下生居對衝者皆上生此又一說也以上二說自漢至今是非不決蓋太史公律書兼有此二種故漢晉梁唐爭執不定而朱子經世大訓所解甚明蓋以一歲言則冬至以後屬陽夏至以後屬陰以一日言則子時以後屬陽午時以後屬陰所謂大陰陽也子陽醜陰寅陽卯陰之類所謂小陰陽也律呂陽下生陰陰上生陽蓋指其大者耳凡陰呂居陽方即皆屬陽陽律居陰方即皆屬陰故別論小陰陽乃變例也其餘諸律則只論大陰陽乃正例也朱子此論非蔡元定所及一曰律左呂右其行不同如筮法然故黃鐘至仲呂子至巳陽升陰退故律生呂言下生呂生律言上生蕤賓至應鐘午至亥陰升陽退故律生呂言上生呂生律言下生至午而變故蕤賓重上生若論捷法不出乾坤六陽六陰者為便子寅辰午申戌黃太姑蕤夷無一如乾之左旋是之謂律而下生未巳卯醜亥酉林仲夾大應南又如坤之右轉是之謂呂而上生此鄭玄筮法之言得之太玄也隔八隔六相生鄭世子曰律呂相生左旋隔八則右轉隔六右轉隔八則左旋隔六何謂左旋隔八右轉隔六如黃生林林生太太生南南生姑姑生應應生蕤蕤生大大生夷夷生夾夾生無無生仲仲生黃是也何謂右轉隔八左旋隔六如黃生仲仲生無無生夾夾生夷夷生大大生蕤蕤生應應生姑姑生南南生太太生林林生黃是也右轉左旋左右逢源周而復始循環無端乃律呂之妙古人算律往而不返但曉右旋不知右轉此所以未密也律管有大小大生小為下生小生大為上生一言盡之矣黃鐘至大而應鐘至小故為上下之終始也三分損益天地之間聲之大者如雷霆小者如蠓蟻皆不得其和故聖人設音律以調之而後聲之大者不過宮聲之小者不過羽其於和陰陽贊化育之道莫善於此乃為三分損益之法以正五音然音止於五猶不足以盡其變由是截竹為管作十二律以應十二月而亦以三分損益之法正之如黃鐘為宮宮者音之君也一陽之律也陽生於子而數始於九因而九之九九八十一而黃鐘之數立焉陽下生陰長管生短管也三損其一則為短陰上生陽短管生長管也三益其一則為長如黃鐘九寸分九為三而去其一則為六寸便為隔八下生林鐘六月之管又三分林鐘之六而益其一以二加六得八寸便為上生太簇正月之管余律亦然又以宮數數之九九八十一宮音也三分去其一分二十七則得五十四為徵音以五十四為三分而又添一分十八則得七十二為商音以七十二為三分而損去一分二十四則得四十八為羽音以四十八為三分而又添一分十六則得六十四為角音此音律三分損益之數皆出於自然而然古人算律有三種其一以黃鐘為九寸每寸九分共計八十一分其二以黃鐘為十寸每寸十分共計百分其三以黃鐘為九寸每寸十分共計九十分其一出淮南子及晉書宋書此縱黍度也黃鐘之數八十一一曰八寸一分下同宮音數也林鐘之數五十四徵音同太簇之數七十二商音同南呂之數四十八羽音同姑洗之數六十四角音同應鐘之數四十三蕤賓之數五十七大呂之數七十六夷則之數五十一夾鍾之數六十八無射之數四十五仲呂之數六十其二出太史公律書此橫黍度也黃鐘長十寸整一百分如前三分損益相生得林鐘之數長六寸六分六釐六毫太簇之數長八寸八分八釐八毫而十二律之數自見其三出京房律准及後漢志此斜黍度也黃鐘長九寸每寸十分如前三分損益相生各得十二律之數上古法下生者三分減一三減其一則為二故用二因三歸上生者三分添一以三添一則為四故用四因三歸別法下生者五十乘之七十五除之上生者一百乘之七十五除之所得與古同而算法不同假如黃鐘長十寸古法置黃鐘為實下生者二因三歸得林鐘別法以五十乘之七十五除之亦得林鐘又如林鐘長六寸六分六釐六毫古法置林鐘為實上生者四因三歸得太簇別法以一百乘之七十五除之亦得太簇余仿此一律生五音十二律各就其宮以起四聲而後六十律之聲備非以黃鐘定為宮太簇定為商姑洗定為角林鐘定為徵南宮定為羽也如黃鐘屬子子有五焉甲子徵丙子羽戊子宮庚子角壬子商此黃鐘五聲也大呂亦有五焉乙丑丁丑己丑辛丑癸丑五音亦如之余律自寅至亥皆然朱子曰律凡十二各以本律為宮而生四律如黃鐘為宮則太簇為商姑洗為角林鐘為徵南呂為羽是黃鐘一宮之聲也若林鐘為宮則南呂為商應鐘為角太簇為徵姑洗為羽是林鐘一宮之聲也夫五音長短之序則宮商角徵羽五時相生之序則宮徵商羽角故黃鐘之宮作而林鐘之徵應大呂之宮作而夷則之徵應天然妙合不假人為所謂同聲相應者也律呂夫妻母子黃鐘乾之初九下生林鐘為坤之初六林鐘上生太簇為乾之九二太簇下生南呂坤之六二南呂上生姑洗乾之九三姑洗下生應鐘坤之六三應鐘上生蕤賓乾之九四蕤賓下生大呂坤之六四大呂上生夷則乾之九五夷則下生夾鍾坤之六五夾鐘上生無射乾之上九無射下生仲呂坤之上六如初九生初六一陽一陰也是為同位同位者象夫妻初六生九二一陰二陽也是為異位異位者象母子所謂律娶妻而呂生子也聲音翻切邵子曰律感呂而聲生呂感律而音生故聲為律律為陽律有闢翕音為呂呂為陰呂有唱和律隨天而變呂隨地而化闢隨陽而出翕隨陰而入唱隨剛而上和隨柔而下然後律呂隨聲音宮徵羽角之道各得其正矣伊川先生曰一闢一翕而平上去入備一唱一和而開發收閉備平上去入備而萬聲生開發收閉備而萬音生故康節以二百六十四字母總括律呂聲音之數其內用一百五十二字括音一百十二字括聲音與聲互相翻切各得一萬七千二十四音聲音為母聲為韻音分唇舌牙齒喉聲分平上去入音辨開發收閉聲別內外八轉而音聲之道盡之矣候氣辨疑候氣之說古之所無埋管飛灰以候十二月之氣不經之談也學者感之久矣自宋元以來諸儒皆未嘗辨論近賴本朝二三儒臣漸得辨明今採其略以解後世之疑或有不無少補者按王氏家藏集曰天地之氣有升有降天氣降地氣升則達而為陽天氣升地氣降則閉而為陰時之寒暑其氣也日之進退其機也氣無微不入者也達即不可御矣豈拘拘於九寸之間哉豈膠固留滯於方寸之差而月餘始達以應耶若曰夏至以前陽律應冬至以前陰律應是一歲之中陰陽皆上升而不下降矣天下古今安有是理故曰謬幽之說也又按劉氏樂經元義曰六律為陽陽數九而始於子故黃鐘象陽以次而短至無射而極六呂為陰陰數六而始於未故林鐘象陰以次而短至仲呂而極此十二律取象取義於十二月之微旨也後世既不識月令肇造之原又不識聖王造律簡易之心遂以十二律為神物真可以通天地而合神明及考其法皆極為不通然後知其非聖人之制也夫一歲之氣有升有降天氣上升地氣下降閉塞而為陰秋冬之事也升者上降者下埋管於地將誰候乎天氣下降地氣上升暢達而為陽春夏之事也氤氳兩間發育萬物地下無氣不可候矣氣無微而不入者也十二管飛則皆飛不飛則皆不飛若曰冬至動黃鐘夏至動蕤賓其餘皆以辰位應動不爽是氣為有知擇管而入管為有知擇氣而施天下古今有是理乎其說始於張蒼定律推五勝之法京房劉歆又傅會以五行幽謬之術大叛於先王之教也又按何氏樂律管見曰律呂本為正五音而設候氣其用之一端耳或問古有十二律管候氣之法其理何如曰此相傳之訛也候氣止用黃鐘之管候子月冬至之氣余月則否何以知之蓋古法占候恆在歲始冬至蓋陽生之始也氣在地中且無形可見故以黃鐘之管候之當冬至之日氣至灰飛則氣節相應是為和平若氣至灰飛在冬至之前或在其後則為太過不及於是乎有占與冬至登臺望雲物以占吉凶蓋同一意也若謂余月皆候則丑月陽氣未出地中候之猶可寅月以後陽月已出地上又何候乎況午月以後陽氣皆自上降下又安有飛灰之理然則謂十二月皆以律管候氣者非也其為相傳之謬無疑矣鄭世子曰候氣之說六經不載即鄒衍吹律生黍京房吹律知姓亦無吹灰之說或謂始於蔡雍然雍月令章句但云律率也率公之管也截竹為管謂之律律者清濁之率法也聲之清濁以律長短為制亦為按月奏樂言也前漢志言律甚詳但云律呂唱和以育生成化歌奏用焉而已初無吹灰之說吹灰之說其始於後漢乎光武以讖興命解經從讖漢儒遵時制不得不然也隋唐以後疏家遞相祖述而遂為定論矣按後漢晉隋志所載候氣之法各有異同既云以木為案加律其上又云埋之上與地平又云置於案上而以土埋之上平於地此置律有淺深高下其說不一也既云以葭莩灰抑其內端氣至者灰去又云以竹莩灰實律中以羅縠復律口氣至吹灰動縠而有小動大動不動三說又云灰飛沖素散出於外而氣應有早晚灰飛有多少其說又不一也總似道聽途說而未嘗試驗耳又如後齊信都芳埋輪扇以測二十四氣尤為虛誕孟子曰盡信書則不如無書儒家以格物窮理為要務乃被無稽之辭欺惑千載而未能覺則格物致知之學安在哉率音律率之正體約數也律管鄭世子曰八音之內當以竹音為首竹音之內當以律管為首律管之為器吹之以候氣奏之以和聲舜典所謂律和聲月令所謂律中某之類皆指律管而言是知管即律律即管一物而二名也形而上者謂之道形而下者謂之器律者其道也管者其器也書曰下管鞉鼓詩曰磬管將將嘒嘒管聲禮曰下管新宮下而管象與夫孤竹孫竹陰竹之管皆是物也然則先王雅樂何嘗不用管哉近代雅樂廢之何也蓋由前儒不識管者謂管如䔿而小並兩而吹疏引廣雅云管長尺圍寸八孔無底或云六孔此漢大豫樂官之雙管非古所謂管也今按八孔雙管聲如頭管俚俗有之不入雅樂舊說非是後儒不識管者謂管除睪子外長六寸余此係教坊俗樂之頭管亦非所謂管也所謂管者無孔凡有孔者非也惟管端開豁口壯如洞簫形似洞門俗名洞簫者以此禮運載孔子之言曰五聲六律十二管還相為宮據此明言管有十二而世儒止知雙管頭管何哉鞉音桃嘒音諱睪音叫按律呂精義管制有三即前縱黍斜黍橫黍之謂依縱黍尺黃鐘管長八寸一分外徑四分零五毫內徑二分八釐六亳吹口廣一分四釐三亳斜黍尺長九寸橫黍尺長一尺三制圍徑之數及十二管詳數具載本書茲不備録黃鐘生度歷代尺度皆本諸黃鐘而損益不同有以黃鐘之長均作九寸而寸皆九分此黃帝命伶倫始造律之尺也是名古律尺又名縱黍尺選中式之秬黍一黍之縱長命為一分九分為一寸九寸共八十一分是為一尺有以黃鐘之長均作十寸而寸皆十分者此舜同律度量衡之尺至夏后氏而未嘗改故名夏尺傳曰夏禹十寸為尺蓋指此尺也又名古度尺又名橫黍尺選取中式之秬黍一黍之橫廣命為一分十分為一寸十寸共計百分是為一尺有以黃鐘之長均作四段加出一段而為尺者此商尺也適當夏尺十二寸五分傳曰成湯十二寸為尺蓋指此尺也有以黃鐘之長均作五段減去一段而為尺者此周尺也適當夏尺八寸傳曰武王八寸為尺蓋指此尺也有以黃鐘之長均作九寸外加一寸為尺此漢尺也唐尺即成湯尺而唐人用之故又名唐尺宋尺即黃帝尺而宋人用之故又名宋尺上七代尺共五種縱黍之尺黃帝尺也宋尺也橫黍之尺夏尺也斜黍之尺漢尺也互相考證皆有補於律者蔡元定曰周家十寸八寸皆為尺以十寸之尺起度則十尺為丈十丈為引以八寸之尺起度則八尺為尋倍尋為常說文曰十寸為尺八寸為咫然則尺之與咫二器之名也今人但知八寸為咫乃別是一物之名而非尺也禮記王制曰古者以周尺八尺為步今以周尺六尺四寸為步禮記王制撰自漢文時鄭世子曰今以周尺周字當作夏字陳祥道曰六尺四寸者十寸之尺也十寸尺之六尺四寸乃八寸尺之八尺也小爾雅廣度篇曰跬一舉足也倍跬謂之步跬音傀司馬法曰六尺為步鄭世子曰按唐虞及夏后氏之制步也皆以夏尺六尺為步商以夏尺一尺二寸五分為尺故以五尺為步周以夏尺八寸為尺故以八尺為步置一尺二寸五分為實五因得六尺二寸五分置八寸為實八因得六尺四寸然則商之一步乃夏尺六尺二寸五分周之一步乃夏尺六尺四寸也今工部收藏寶源局所鑄量地銅尺五尺為步今之五尺乃夏尺之六尺四寸周之八尺也以夏尺八寸均作十寸即周尺也周尺最小以夏尺一尺二寸五分均作十寸即商尺也商尺最大即今木匠所用曲尺也蓋自魯班家傳以至於唐唐人謂之大尺由唐至今用之名曰今尺又名營造尺蓋此尺即殷湯尺也去二寸即夏禹之尺夏禹之尺去二寸即周武王之尺是今一曲尺包括三代之制不待纍黍而自明矣且夫黃帝至於舜禹歷世因仍未嘗損益惟殷周始改統易朔而損益之道興焉故又因此以知黃帝針經孔穴舜同律度量衡皆與夏尺同而禹之身為度者亦因夏尺而可想見也又曰岐伯云八尺之士與周禮云人長八尺相符則是上自黃帝下至成周數千年間人與尺度未嘗有異此蓋言魁偉丈夫之身非衆人之度也故黃帝問於伯高曰衆人之度長七尺五寸是也外臺亦作七尺五寸正與此同梁陶弘景撰本草序録一用纍黍之法孫思邈從而用之其書言尺則用夏家古尺而又參諸司馬法六尺為步以互證之其立意之精豈尋常醫家者所及但孫氏云夏尺古尺即江淮吳越所用八寸小尺是也當唐尺八寸唐會要云唐高祖武德四年行開元通寶錢徑八分蓋唐尺之八分也夫一錢徑八分十錢徑八寸即孫氏所謂夏家古尺之一尺也開元錢今固有之以錢考尺則尺可知矣近世醫家取同身寸法其說一出無復考古幸孫氏之方及唐會要可證耳衆人身度當以黍尺七尺五寸為準其如曹交之長九尺為有餘晏子之短六尺為不足二者折衷之亦得七尺五寸故孔子荀子皆謂七尺之體為中人之率黍尺七尺五寸蓋今曲尺六尺也素問周禮所謂八尺者黍尺八尺比今曲尺六尺四寸也其偉人之度歟故素有八尺及七尺五寸二說而庸俗弗曉古今尺度不同乃謂古今人品有異豈不謬哉步法三種夏尺六尺為步比營造尺五尺短二寸商尺五尺為步即今營造尺周尺八尺為步比營造尺五尺長一寸二分今制三種尺鈔尺即裁衣尺三尺是夏四尺用四因三歸銅尺即量地尺比裁衣尺短四分曲尺即營造尺比裁衣尺短六分即商湯尺古制三種尺商尺法天五尺為步象天中數夏尺法地六尺為步象地中數周尺法人八尺為步以象綱常黍法三種尺此下三尺於營造尺減去二寸是為真黃鐘縱黍尺九黍為寸計八十一分軒轅氏尺宋尺宗之橫黍尺十黍為寸計一百分夏后氏尺唐尺宗之斜黍尺十黍為寸九寸為尺周景王尺漢尺宗之黃鐘生量嘉量起於黃鐘律籥前漢志曰量本起於黃鐘之籥籥者黃鐘律之實也律籥樂器也尺寸之數與黃鐘同容黍一千二百粒是為半合嘉量量器也其形圓以銅為之下有圓足曰臀上有兩耳量腹內徑一尺四寸一分四釐微強高深一尺臀內徑一尺高深一寸耳內徑二寸五分高深四寸俱厚一分造用夏尺量腹容二十豆是為一釜臀容四升是為一豆耳容一十籥是為一升二圖具律呂全書嘉量為器端直以應繩者表裡上下皆端直也平正以應准者內外中邊皆平正也後世好古之士欲為此器者八法之義不可不知八法者律度量衡規矩繩准也此器體圓應規函方應矩端直應繩平正應准容受應量輕重應衡聲音應律八法具焉是為嘉量矣五量所起六十黍為圭舊云六十四黍四字衍文今刪之四圭為撮三指撮之曰撮五撮為一籥一千二百黍也十撮為合黃鐘律籥容千二百黍二籥為合也十合為升十升為鬥孫子算法以六粟為圭十圭為抄十抄為撮十撮為勺十勺為合此流俗之鄙談非先王之法制儒者所不道也五量正數即黃帝所設也周公嘉量太公舊量並同四豆為區四升曰豆區為一斗六升三百二十籥區或作鏂五區為釜八斗也為一千六百籥釜或作釜即所謂斛也倍釜為庾十六斗也庾或作庾又作逾又作籔五庾為鍾八十斗也倍鍾為秉一百六十斗也陳氏三量此非周制而與漢制頗同五豆為區二斗也比舊區多四升五區為釜十斗也比舊釜多二斗十釜為鍾百斗也比舊鐘多二十斗我朝斛法成化十五年奏准鑄成斛法依寶源局量地尺斛口外方一尺內方九寸斛底外方一尺六寸內方一尺五寸深一尺厚三分平稱一百斤依古黍度尺斛口外方一尺二寸八分內方一尺一寸五分有奇底外方二尺零五分內方一尺九寸二分深一尺二寸八分厚四分鄭世子曰按古人未嘗以五斗為斛五斗為斛蓋自唐宋始也算法依寶源局尺量置斛口內方九寸自乘得八十一寸置底一尺五寸自乘得二百二十五寸又以口底相乘得一百三十五寸三宗相併得四百四十一寸三歸得一百四十七寸以深一尺乘之得一千四百七十寸是為鐵斛五斗實積倍之得二千九百四十寸是兩鐵斛即十斗實積然則今之斛法非二千五百也民間俗傳算術多以二千五百為斛法者疑術士之杜撰也黃鐘生衡衡曰平衡謂欲得其平也此器有小有大總名曰衡小者曰等大者曰稱古文作稱稱去聲虞書曰律度量衡言衡不言權論語曰謹權量言權不言衡蓋權衡合德而相須為用舉其一則可以互見矣吳韋氏曰衡有斤兩之數生於黃鐘黃鐘之管容秬黍千二百粒是為一籥二籥為合合重一兩故律度量衡於是乎生而三代之制權衡之起信乎出於律矣夫一籥所容千二百黍之重是為半合即古之半兩也兩籥所容三千四百黍之重是為一合即古之一兩也然則一升之重為十兩一斗之重為百兩一斛之重為千兩矣故一斤之重為一升六合一均之重乃四斗八升一石之重乃一斛九斗二升也權量相合未有得其量而不得其權者今考羊頭山秬黍以時制等子稱之其中者百粒得二分五釐整積至兩籥二千四百粒稱重六錢可見今之六錢為古一兩今之六斤為古十斤其餘可以類推大率古之於今乃五分之三耳先儒以為三分之一非也置今求古則用六歸以古求今則用六因求度量亦如之但率法不同耳度以八為率今之八寸即古之一尺量以三為率今之三斗即古一斛權以六為率今之六錢即古一兩也凡度量衡以今求古皆置今為實而用歸以古求今皆置古為實而用因則得之矣古今衡數不同鄭世子曰按淮南子謂十二粟而當一分十二分而當一銖則一銖者一百四十四粟也漢志謂一千二百黍為十二銖則一銖乃一百黍也後漢志注又謂十粟重一圭十圭重一銖則一銖者亦惟百粟耳更減淮南之數而不相合也且漢制律度量衡悉紛亂無紀臣家有漢錢數十枚凡若干種每種雖度數分寸倣佛而厚薄輕重不勻以漢食貨志校之彼志云貨泉重五銖貨布重二十五銖大泉重十二銖大布重二十四銖臣以今時等子將錢每種或十枚或五枚總稱之以均其輕重而用算法求之合其一兩之數則大泉合今三錢三分貨泉合今三錢五分貨布合今三錢七分大布合今三錢八分此皆漢時一兩之數而率皆乖異與宋呂大臨考古圖之說相同大率漢之一兩惟有今之三錢半強是漢三兩為今之一兩強其數與秬黍之法不同者蓋因劉歆誤以秠黍為秬故律度量衡四器皆失之小其餘器皿率多舛謬矣又史言晉之稱兩不與古同梁陳依古稱齊以古稱一斤八兩為一斤後周玉稱四兩當古稱四兩半隋以古稱三斤為一斤唐量衡與古校皆三之一然史文缺略今不能的悉其數唐孫真人千金方曰古稱惟有銖兩而無分名今則以十十當作百傳寫之誤黍為一銖六銖為一分四分為一兩合今之六錢也十六兩為一斤此則神農之稱也吳人以二兩為一兩隋人以三兩為一兩今依四分為一兩稱為定此唐稱十斤正合今之六斤此說足以破其惑而肘後方鹿鳴山序云古方藥品分兩灸穴分寸與今不類為古今人體大小或異血脈亦有差焉此說非也宋林億等千金方凡例曰無稽之言莫此為甚者是也又如千金方所載藥升之制上徑一寸下徑六分深八分此升甚小不知何代之量有如此者又云半夏一升稱重五兩校之不同即所云諸藥權量大率類此姑存其說以見度量權衡長短大小輕重之不同耳隋唐宋元之度量校之纍黍則失於長大漢魏南北朝之度量校之纍黍則失於短小宋儒論樂律者率舍高而取下論度量者又舍大而取小夫豈知適中之道哉今選羊頭山秬黍中者一千二百粒實於黃鐘之籥無缺無餘以天平稱之整有三錢乃古半兩也兩籥之黍當天平六錢為古一兩然則古稱一斤當天平九兩六錢今之平稱一斤是古一斤十兩蓋三分兩之二也今大明鈔尺七尺五寸適合黍尺一丈鐵斛三升二合適合黍量一斗平稱九斤適合黍權一稱十五斤曰一稱雖不同而實同雖不用而實用妙理存乎其間而人未之知也臣若不纍黍親驗亦不信有如此之妙後世為鐘律之學者不可以其常用而忽之也五權所起五者權之餘也權起於黍黑色圓黍一粒之重起十黍為纍以今等子校之重二釐半十纍為銖百黍也重二分半六銖為錙六百黍也重一錢五分出說文四錙為兩黃鐘兩籥二千四百黍也五權正數五者權之正也十六兩為斤古量一升六合黍之重為今稱九兩六錢十斤為衡古量一斗六升黍之重為今稱六斤三衡為均古量四斗八升黍之重為今稱十八斤四均為石古量一石九斗二升黍之重為今稱七十二斤四石為鼓古量七石六斗八升黍之重為今稱二百八十八斤擬古天平法馬數十得今之六一銖一百黍之重今之二分半二銖三銖以上以遞而增十銖一千黍之重今之二錢五分十二銖即黃鐘一籥一千二百黍之重古之半兩今之三錢一兩兩籥黍之重今之六錢也八兩十六籥黍之重即古半斤今之四兩八錢也一斤三十二籥黍之重今之九兩六錢也
