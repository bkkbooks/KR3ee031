front:
  text: 序內經者三墳之一蓋自軒轅帝同岐伯鬼臾區等六臣互相討論發明至理以遺教後世其文義高古淵微上極天文下窮地紀中悉人事大而陰陽變化小而草木昆蟲音律象數之肇端臟腑經絡之曲折靡不縷指而臚列焉大哉至哉垂不朽之仁慈開生民之壽域其為德也與天地同與日月並豈直規規治疾方術已哉按晉皇甫士安甲乙經敘曰黃帝內經十八卷今針經九卷素問九卷即內經也而或者謂素問針經明堂三書非黃帝書似出於戰國夫戰國之文能是乎宋臣高保衡等敘業已闢之此其憶度無稽固不足深辨而又有目醫為小道並是書且辨髦置之者是豈巨慧明眼人歟觀坡仙楞伽經跋云經之有難經句句皆理字字皆法亦豈知難經出自內經而僅得其什一難經而然內經可知矣夫內經之生全民命豈殺於十三經之啓植民心故玄晏先生曰人受先人之體有八尺之軀而不知醫事此所謂遊魂耳雖有忠孝之心慈惠之性君父危困赤子塗地無以濟之此聖賢所以精思極論盡其理也由此言之儒其可不盡心是書乎奈何今之業醫者亦置靈素於罔聞昧性命之玄要盛盛虛虛而遺人夭殃致邪失正而絶人長命所謂業擅專門者如是哉此其故正以經文奧衍研閲誠難其於至道未明而欲冀夫通神運微印大聖上智於千古之邈斷乎不能矣自唐以來雖賴有啓玄之注其發明玄祕盡多而遺漏亦復不少蓋有遇難而默者有於義未始合者有互見深藏而不便檢閲者凡其闡揚未盡靈樞未注皆不能無遺憾焉及乎近代諸家尤不過順文敷演而難者仍未能明精處仍不能發其何裨之與有初余究心是書嘗為摘要將以自資繼而繹之久久則言言金石字字珠璣竟不知孰可摘而孰可遺因奮然鼓念異有以發隱就明轉難為易盡啓其祕而公之於人務俾後學瞭然見便得趣由堂入室具悉本原斯不致誤己誤人咸臻至善於是乎詳求其法則唯有盡易舊制顛倒一番從類分門然後附意闡發庶晰其韞然懼擅動聖經猶未敢也粵稽遠古則周有扁鵲之摘難晉有玄晏先生之類分唐有王太僕之補削元有滑櫻寧之撮鈔鑑此四君子而後意訣且此非十三經之比蓋彼無須類而此欲醒瞶指迷則不容不類以求便也由是遍索兩經先求難易反復更秋稍得其緒然後合兩為一命曰類經類之者以靈樞啓素問之微素問發靈樞之祕相為表裡通其義也兩經既合乃分為十二類夫人之大事莫若死生能葆其真合乎天矣故首曰攝生類生成之道兩儀主之陰陽既立三才位矣故二曰陰陽類人之有生臟氣為本五內洞然三垣治矣故三曰臟象類欲知其內須察其外脈色通神吉凶判矣故四曰脈色類臟腑治內經絡治外能明終始四大安矣故五曰經絡類萬事萬殊必有本末知所先後握其要矣故六曰標本類人之所賴藥食為天氣味得宜五宮強矣故七曰氣味類駒隙百年誰保無恙治之弗失危者安矣故八曰論治類疾之中人變態莫測明能燭幽二豎遁矣故九曰疾病類藥餌不及古有針砭九法搜玄道超凡矣故十曰針刺類至若天道茫茫運行今古苞無窮協惟一推之以理指諸掌矣故十一曰運氣類又若經文連屬難以強分或附見於別門欲求之而不得分條索隱血脈貫矣故十二曰會通類匯分三十二卷此外復附著圖翼十五卷蓋以義有深邃而言不能該者不拾以圖其精莫聚圖象雖顯而意有未達者不翼以説其奧難窺自是而條理分綱目舉晦者明隱者見巨細通融歧二畢徹一展卷而重門洞開秋毫在目不惟廣裨乎來學即凡志切尊生者欲求茲妙無不信手可拈矣是役也余誠以前代諸賢注有未備聞多舛錯掩質埋光俾至道不盡明於世者逮四千余祀矣因敢忘陋效矉勉圖數負固非敢弄斧班門然不屑沿街持鉢故凡遇駁正之處每多不諱誠知非雅第以人心積習既久訛以傳訛即決長波猶虞難滌使辨之不力將終無救正日矣此余之所以載思而不敢避也籲余何人斯敢妄正先賢之訓言之未竟知必有闞余之謬而隨議其後者其是其非此不在余而在乎後之明哲矣雖然他山之石可以攻玉斷流之水可以鑑形即壁影螢光能資志士竹頭木屑曾利兵家是編者倘亦有千慮之一得將見擇於聖人矣何幸如之獨以應策多門操觚隻手一言一字偷隙毫端凡歷歲者三旬易稿者數回方就其業所謂河海一流泰山一壤蓋亦欲共掖其高深耳後世有子云其憫余勞而錫之斤正焉豈非幸中又幸而相成之德謂孰非後進之吾師云時大明天啓四年歲次甲子黃鐘之吉景嶽子自序於通一齋序夫生者天地之大德也醫者贊天地之生者也人參兩間惟生而已生而不有他何計焉故聖人體天地好生之心闡明斯道誠仁孝之大端養生之首務而達人之必不可廢者惟其理趣幽深難於窮究欲徹其蘊須悉天人蓋人之有生惟天是命天之所育惟人最靈故造化者天地之道而斡旋者聖人之能消長者陰陽之幾而燮理者明哲之事欲補天功醫其為最惟是死生反掌千里毫釐攸系匪輕談非容易故不有精敏之思不足以察隱不有果敢之勇不足以回天不有圓融之智不足以通變不有堅持之守不足以萬全凡此四者缺一不可必欲備之則惟有窮理盡性格物致知以求聖人之心斯可也然心法之傳止賴內經一書苟欲舍是而言醫不過索方書求糟粕以圖僥幸皆苟且之流耳醫而苟且害可勝言哉故扁鵲採靈素之精要設為八十一難以開來學而邵庵虞先生曰未必經之當難者止此八十一條蓋亦有感而云然余因醉心有年遂通為類注並圖翼附翼等義雖辭多煩贅俚鄙不文蓋亦慮初學之難明而求悉於理耳昔人云醫者意也意思精詳則得之余曰醫者理也理透心明斯至矣夫扁鵲之目洞垣者亦窺竅於理耳故欲希扁鵲之神必須明理欲明於理必須求經經理明而後博採名家廣資意見其有不通神入聖者未之有也高明者以謂然否通一子又序
