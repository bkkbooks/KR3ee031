body:
  text: 卷十一針灸要覽十四經針灸要穴歌肺經要穴歌手太陰兮經屬肺尺澤肘中約紋是列缺腕側一寸半經渠寸口陷中記太淵掌後橫紋里魚際大指節後起少商大指內側端相離爪甲如韭耳大腸經要穴歌手之陽明屬大腸食指內側號商陽本節前二間可取本節後三間勿忘岐骨間可尋合谷腕上側陽溪所藏三里去曲池二寸曲池在肘節中央肩端上肩髃骨罅鼻孔旁乃是迎香胃經要穴歌足陽明兮胃之經頭維額角兩邊行頰車耳下曲頰處地倉夾吻四分平伏兔還離膝六寸陰市須從減半論三里上廉和下廉膝下相挨各三寸解溪腕上系鞋處趺上動脈衝陽遇陷谷兩指節後間內庭次指外間連厲兌存於足次指去甲如韭陽明全脾經要穴歌足太陰脾家經絡隱白起足拇內角大都在節後肉際太白從核骨下摸公孫節後一寸加商丘踝下微前些踝上陰交三寸遠輔下陰陵內不差心經要穴歌手少陰經心脈透少海內廉居肘後靈道去掌寸半長通里一寸應非謬神門掌後鋭骨端少府相隨本節邊少衝甲角須求內二穴皆從小指連小腸經要穴歌手太陽經小腸脈小指外端尋少澤前谷還求本節前後溪節後須從側腕骨腕前無待卜腕中鋭下求陽谷小海肘端外五分聽宮耳內如珠伏膀胱經要穴歌足之太陽屬膀胱睛明起自內眥旁攢竹二穴眉頭取絡郤後發四寸五肺俞三椎膈俞七肝俞九椎之下出腎俞十四椎間算膏肓相近四椎半委中膝膕約紋看承山腨下分肉間崑崙踝下後五分外踝之下尋金門申脈也從踝下起肉際陷中容爪耳腎經要穴歌足有少陰經屬腎湧泉卷指足中心然谷踝前高骨下太溪踝後動中尋踝下四分尋照海踝上二寸復溜在陰谷須尋內輔下大筋小筋中可揣心包經要穴歌手厥陰者心包絡肘內橫紋求曲澤間使掌後三寸量內關二寸非難索大陵掌後兩筋間欲取勞宮掌內看中衝須是求中指爪甲相連向指端三焦經要穴歌手少陽與三焦連液門名指節根前中渚退居本節後陽池腕上陷中旋外關腕後二寸地再加一寸支溝位天井肘外上一寸角孫耳廓上邊記絲竹空從眉後取耳門耳缺之前際膽經要穴歌足少陽膽經聽會開口耳前有空位臨泣髮際上五分目窗更加一寸存風池陷居後髮際肩井在肩大骨內帶脈肋下一寸八環跳髀樞中是穴膝下一寸陽陵泉踝上四寸陽輔前丘墟踝下如前陷臨泣四指節後邊俠溪小次岐間縫竅陰四指內之端肝經要穴歌足厥陰肝在何處大敦拇指毛中聚行間動在岐節前太衝節後有脈據中封內踝前一寸曲泉輔下橫紋盡章門臍上二寸量季肋之端居兩旁期門乳旁一寸半直下寸半二肋詳督脈要穴歌督脈水溝人中起上星入發一寸止百會正在頂之巔風府一寸後發里啞門入發五分中大杼一椎骨上逢腰俞二十一椎下穴得其真功自隆任脈要穴歌任脈中行正居腹臍下關元三寸録氣海離臍一寸半神闕臍中隨所欲水分一寸居臍上中脘還須四寸足膻中正在兩乳間欲得承漿唇下蓄以上要穴乃十四經溪谷氣血所聚之處皆極切於用者較之諸穴有所不同故撮為此歌以便記誦凡業針灸家者不可不加之意也諸證灸法要穴凡用灸者所以散寒邪除陰毒開鬱破滯助氣回陽火力若到功非淺鮮故古人灸法有二報三報以至連年不絶者前後相催其效尤速或自三壯五壯以至百壯千壯者由漸而增多多益善也然灸頭面者艾炷宜小亦不宜多灸手足者稍倍之灸腹背者又倍之若上下俱灸必須先上而後下不可先下後上也凡用火補者勿吹其火必待其從容徹底自滅灸畢即可用膏貼之以養火氣若欲報者直待報畢貼之可也用火瀉者可吹其火傳其艾宜於迅速須待灸瘡潰發然復貼膏此補瀉之法也其有脈數躁煩口乾咽痛面赤火盛陰虛內熱等證俱不宜灸反以助火不當灸而灸之災害立至矣圖翼四卷有針灸諸則所當並察中風中臟氣塞痰上昏危不省人事百會風池大椎肩井間使曲池足三里凡覺手足攣痹心神昏亂將有中風之候不論是風與氣可依次灸此七穴則愈合谷風市手三里崑崙申脈神闕凡卒中風者神闕最佳羅天益曰中風服藥只可扶持要收全功艾火為良蓋不惟逐散風邪宣通血脈其於回陽益氣之功真有莫能盡述者詳見本穴偏風半身不遂左患灸右右患灸左肩髃百會肩井客主人主口歪列缺手三里風市曲池陽陵泉環跳足三里絶骨崑崙申脈口眼喎斜頰車地倉水溝承漿偏風口喎聽會合谷凡口喎向右者是左脈中風而緩也宜灸左喎陷中二七壯喎向左者是右脈中風而緩也宜灸右喎陷中二七壯艾炷如麥粒可矣口噤不開頰車承漿合谷喑啞天突靈道陰谷復溜豐隆然谷戴眼神庭脊骨三椎五椎各灸五七壯齊下火立效癱瘓肩井肩髃曲池中渚合谷陽輔陽溪足三里崑崙角弓反張百會神門間使僕參七壯命門太衝風痹不仁天井尺澤少海陽輔中渚環跳太衝厥逆人中灸七壯或針入至齒妙膻中二十一壯百會暴厥逆泠氣海一法以繩圍男左女右臂腕為則將繩從大椎向下度至脊中繩頭盡處是穴灸二十一壯尸厥卒倒氣脫百會人中合谷間使氣海關元卒忤肩井巨闕傷寒頭疼身熱二間合谷神道風池期門間使足三里汗不出合谷腕骨通里期門足三里復溜發狂百會間使復溜陰谷足三里陰證期門間使氣海關元聲啞天突期門間使合谷刺太衝刺所謂開四關者即合谷太衝也耳聾腎俞偏歷聽會小便閉陰谷關元陰陵泉舌卷囊蜷天突廉泉合谷腎俞復溜然谷血海腹脹太白復溜足三里餘熱曲池間使後溪虛癆虛損注夏羸瘦大椎肺俞膈俞胃俞三焦俞腎俞中脘天樞氣海真氣不足足三里三陰交長強崔氏四花六穴一法取手掌中大指根稍前肉魚間近內側大紋半指許外與手陽明合谷相對處按之極酸者是穴此同長強各灸七壯甚妙傳尸癆第一代蟲傷心宜灸心俞穴並上下如四花樣第二代灸肺俞四穴如前第三代灸肝俞四穴如前第四代灸厥陰俞四穴如前第五代灸腎俞四穴如前第六代灸三焦俞四穴如前此證五日輕五日重輕日其蟲大醉方可灸一法灸腰眼穴法在圖翼十卷一法凡取癆蟲可於三椎骨上一穴並膏肓二穴各灸七壯然後以飲食調理方下取蟲等藥骨蒸寒熱夜熱百勞膏肓肺俞魄戶脾俞腎俞四花穴間使足三里虛怯飲食不化膈俞脾俞胃俞中脘梁門內關天樞足三里多汗少力大橫盜汗肺俞復溜譩嘻瘧多汗下無痼冷此腎與膀胱虛寒也多灸愈妙腎俞神闕關元氣海陽脫三陰交陰寒腹痛欲死人有房事之後或起居犯寒以致臍腹痛極頻危者急用大附子為末唾和作餅如大錢厚置臍上以大艾炷灸之如倉卒難得大附只用生薑或蔥白頭切片代之亦可若藥餅焦熱或以津唾和之或另換之直待灸至汗出體溫為止或更於氣海丹田關元各灸二七壯使陽氣內通逼寒外出手足溫暖脈息起發則陰消而陽復矣血證吐血百勞肺俞心俞夏止五壯膈俞肝俞脾俞腎俞脊骨詳後便血中脘虛勞吐血天樞太淵通里間使大陵外關刺足三里怒氣傷肝吐血膈俞肝俞脾俞腎俞間使足三里衄血上星灸一壯即止一曰須七七壯少則不能斷根囟會亦如上星百勞風門膈俞脊骨詳後便血合谷湧泉一法於項後髮際兩筋間宛中穴灸三壯蓋血自此入腦注鼻中故灸此立止便血中脘氣海上二穴灸脫血色白脈濡弱手足冷飲食少思強食即嘔宜灸之其效如神凡大便下血諸治不效者但取脊骨中與臍相平須按脊骨高突之處覺痠疼者是穴方可於上灸之不疼者非也灸七壯即止如再發即再灸七壯永可除根至於吐血衄血一切血病百治不效者經灸永不再發一法於脊中第二十椎下隨年壯灸之尿血膈俞脾俞三焦俞腎俞列缺章門大敦鼓脹大抵水腫極禁針刺十般鼓腫要先知切忌臍高凸四圍腹上青筋休用藥陰囊無縫不堪醫背平如板終難治掌上無紋有限時五穀不消十日死肚光如鼓療應遲痰多氣短皆無藥十個當知九個危任使神醫難措手勸君切記此篇書又氣腫從來不可醫肚光如鼓甚蹺蹊按之如石彈之響泄氣方能見效奇水溝三壯水分灸之大良神闕三壯主水鼓甚妙膈俞肝俞脾俞胃俞腎俞中脘氣海氣脹水鼓黃腫陰交水腫石門水腫七壯中極水脹曲骨水腫章門石水內關陰市水腫陰陵泉水腫足三里復溜解溪虛腫中封太衝陷谷水腫然谷石水照海公孫以上諸穴擇宜用之血鼓膈俞脾俞腎俞間使足三里復溜行間單腹脹肝俞脾俞三焦俞水分公孫大敦虛勞浮腫太衝積聚痞塊久痞灸背脊中命門穴兩旁各四指許是穴痞在左灸右在右灸左一法曰凡治痞者須治痞根無不獲效其法於十三椎下當脊中點墨為記墨之兩旁各開三寸半以指揣摸自有動處即點穴灸之大約穴與臍平多灸左邊或左右俱灸此痞根也或患左灸右患右灸左亦效上脘中脘幽門通谷結積留飲梁門天樞期門百壯冶積氣上奔甚急欲絶章門一切積聚痞塊氣海百壯冶一切氣塊關元百壯治奔豚氣逆痛不可忍脾俞三焦俞上穴皆灸積塊可按證選用肺積名息奔在右脅下尺澤章門足三里心積名伏梁起臍上上至心下神門後溪巨闕足三里肝積名肥氣在左脅下肝俞七壯章門三七壯行間七壯脾積名痞氣橫在臍上二寸脾俞胃俞腎俞通谷章門二七壯足三里上俱七壯腎積名奔豚生臍下或上下無時腎俞關元瘕癖中極臍下積聚疼痛湧泉四五壯不可太過炷如麥粒氣塊脾俞胃俞腎俞梁門疼痛天樞長桑君針積塊癥瘕先於塊上針之甚者又於塊首一針塊尾一針針訖灸之立應心腹胸脅痛脹肺心痛臥若伏龜太淵五壯尺澤五壯上脘膻中胸痹痛脾心痛痛如針刺內關大都五壯太白五壯足三里連承山公孫肝心痛色蒼蒼如死狀終日不得休息行間七壯太衝七壯腎心痛悲懼相控太溪然谷各七壯胃心痛腹脹胸滿或蛔結痛甚蛔心痛也巨闕二七壯大都太白足三里連承山胃脘痛膈俞脾俞胃俞內關陽輔商丘腹痛腹脹膈俞脾俞胃俞腎俞大腸俞中脘脾寒水分天樞石門心下堅滿內關足三里商丘脾虛腹脹公孫少腹脹痛三焦俞章門陰交臍下冷疼足三里氣海治臍下三十六疾小腹痛欲死者灸之即生丘墟太白行間寒濕上氣胸背滿痛肺俞肝俞雲門乳根巨闕期門梁門內關尺澤諸氣痛氣膈上氣不下天突膻中中府膈俞繞臍痛大腸病也水分天樞陰交足三里脅肋脹痛膈俞章門七壯陽陵泉丘墟三壯噎隔諸隔證心俞七壯膈俞七壯膏肓百壯以多為佳脾俞膻中七壯乳根七壯中脘七壯天府七壯足三里三七壯氣噎天突膈俞脾俞腎俞乳根關衝三五壯足三里解溪氣逆噎將死大鐘勞噎勞宮思慮噎神門脾俞諸咳喘嘔噦氣逆咳嗽天突七壯俞府七壯華蓋乳根三壯風門七壯肺俞身柱至陽十四壯列缺寒痰嗽肺俞膏肓靈臺九壯不可多至陽合谷列缺熱痰嗽肺俞膻中尺澤太溪諸喘氣急天突璇璣華蓋膻中乳根期門氣海背脊中第七椎骨節下穴灸三壯神效哮喘五哮中惟水哮乳哮酒哮為難治璇璣華蓋俞府膻中肩井冷風哮妙有孕勿灸肩中俞風哮妙太淵足三里小兒鹽哮於男左女右手小指尖上用小艾炷灸七壯無不除根未除再灸嘔吐氣逆膈俞三焦俞巨闕不下食上脘中脘三七壯治嘔吐不思飲食氣海章門大陵嘔逆間使乾嘔吐食後溪吐食尺澤太衝冷氣嘔逆不食噦逆乳根三壯火到肌即定其不定者不可救也承漿中府風門肩井膻中中脘期門氣海足三里三陰交霍亂巨闕中脘建里水分最效承筋轉筋承山三陰交逆冷照海大都湧泉轉筋十指拘攣不能屈伸灸足外踝骨尖上七壯凡霍亂將死者用鹽填臍中灸七壯立愈凡霍亂吐瀉不止灸中脘天樞氣海四穴立愈乾霍亂即俗名攪腸痧也急用鹽湯探吐並以細白乾鹽填滿臍中以艾灸二七壯則可立蘇翻胃脾俞胃俞膻中乳根上脘二七壯中脘二七壯下脘二七壯水分天樞三七壯大陵足三里吞酸嘔吐食不化日月中脘脾俞胃俞噯氣中脘經曰足太陽之脈是動則病腹脹善噫視其盛虛熱寒陷下者取之即此善太息中封商丘公孫善悲心俞大陵大敦玉英膻中經曰厥陰為闔闔折即氣絶而喜悲悲者取之厥陰視有餘不足厥陰根於大敦結於玉英絡於膻中也氣短大椎不語肺俞不語肝俞不語天突肩井氣海氣短陽脫內關尺澤氣短不語足三里太衝瘧疾大椎三壯立愈一曰百壯三椎骨節上灸亦可愈譩嘻多汗章門間使久瘧後溪先寒後熱環跳承山飛陽崑崙太溪寒瘧公孫為主冶至陰寒瘧無汗合谷久瘧不愈黃瘦無力者灸脾俞七壯即止蓋瘧由寒濕飲食傷脾而然故此穴甚效黃疸公孫消渴腎俞小腸俞瀉痢百會久瀉滑脫下陷者炙三壯脾俞腎俞洞泄不止五壯命門長強赤白雜者承滿腸鳴者梁門中脘神闕中氣虛寒腹痛瀉痢甚妙天樞腹痛氣海石門腹痛關元久痢冷痢腹痛三陰交腹滿泄瀉脾泄色黑脾俞胃泄色黃胃俞天樞大腸泄色白大腸俞小腸泄色赤小腸俞大瘕泄裡急後重天樞水分上各三七壯腎泄夜半後及寅卯之間泄者命門天樞氣海關元狂癇癲狂百會人中天窗狂邪鬼語身柱神道心俞筋縮骨骶二十壯章門天樞少衝女灸此勞宮內關神門陽溪足三里下巨虛豐隆二七壯衝陽男灸此太衝申脈照海厲兌男灸此兩手足拇指甲角其法以二指並縛一處須甲肉四處著火七壯癡心俞神門風癇百會上星身柱心俞筋縮章門神門天井陽溪灸此不必合谷灸合谷不必陽溪合谷足三里太衝頭面七竅病頭風頭痛百會頭風上星三壯囟會神庭三壯曲差後頂率谷風池天柱上穴擇灸一處即可愈風門通里列缺偏頭痛陽溪豐隆解溪面疾頰車面頰腫痛口急不能嚼針灸皆可地倉面頷瘡腫合谷列缺陷谷面目壅腫刺出血立愈眼目疼痛合谷痛而不明外關後溪頭目痛青盲眼肝俞膽俞腎俞養老七壯商陽五壯光明目昏不明足三里目眩通里解溪風爛眼肝俞膽俞腎俞腕骨光明耳聾上星治風聾二七壯翳風耳痛而聾灸七壯聽宮腎俞外關偏歷合谷停耳聽宮頰車合谷鼻瘜鼻痔上星流清濁涕曲差迎香刺囟會七壯鼻癰鼻痔通天七壯鼻中去臭積一塊即愈百會風池風府人中大椎上穴皆治前證鼻淵上星曲差印堂風門合谷鼻塞不聞香臭囟會自七壯至七七壯灸至四日漸退七日頓愈上星迎香刺天柱風門口舌瘡痛糜爛疳蝕頰車地倉廉泉承漿天突金津玉液上二穴刺出血合谷陽陵泉治膽熱口苦善太息齒牙痛承漿頰車耳垂下盡骨上穴三壯如神肩髃七壯隨左右灸之列缺七壯立止太淵風牙痛魚際陽谷上牙合谷三間下齒七壯足三里上齒痛者七七壯愈太溪內庭下牙腎虛牙痛出血不止頰車合谷足三里太溪喉痹喉癬天柱廉泉天突陽谷合谷刺五分立愈後溪乳蛾三間少商關衝足三里豐隆三陰交行間胸背腰膝痛龜背肩中俞膏肓心俞腎俞曲池合谷雞胸中府膻中靈道二七壯足三里胸背痛風門腰挫閃疼起止艱難脊中腎俞三壯七壯命門中膂內俞腰俞俱七壯腰背重痛難行章門腰脊冷痛腰俞委中腰腳腫痛刺出血崑崙七壯灸腰痛不可俯仰令患人正立以竹杖柱地量至臍中用墨點記乃用度脊中即於點處隨年壯灸之腰膝痠痛養老環跳陽陵泉治腳膝冷痹不仁崑崙申脈筋骨攣痛三陰交手足病肩臂冷痛凡人肩冷臂痛者每遇風寒肩上多冷或日須熱手撫摩夜須多被擁蓋庶可支持此以陽氣不足氣血衰少而然若不預為之治恐中風不遂等證由此而成也須灸肩髃二穴方免此患蓋肩髃系兩手之安否環跳系兩足之安否此不可不灸之輕者七壯風寒盛者十四壯為率或分二三次報之但不可過多恐臂細也若灸環跳則四五十壯無害臂痛不舉肩井肩髃淵腋曲池曲澤後溪項強肘痛太淵手腕痛受濕手足拘攣曲池尺澤腕骨外關中渚五痹曲池外關合谷中渚腿叉風腎俞環跳陽陵泉懸鐘崑崙膝風腫痛天樞梁丘膝眼可刺詳奇俞類膝關足三里陽陵泉陰陵泉太衝寒濕腳氣肩井足三里陽陵泉陽輔崑崙照海太衝白虎歷節風膝關轉筋照海足內廉腫痛肩井三陰交三七壯大敦足腕腫痛解溪丘墟寒濕腳瘡取足跗上二寸許足腕正中陷處是穴灸七壯神效此穴當即解溪也照海二陰病夢遺精滑鬼交春秋冬可灸心俞灸不宜多膏肓腎俞灸隨年壯其效立見命門遺精不禁者五壯立效白環俞五十壯中極隨年壯三陰交中封然谷失精膝脛冷疼曲泉白濁脾俞小腸俞章門氣海五壯關元中極中封五淋膈俞肝俞脾俞腎俞氣海石門血淋關元間使能攝心包之血血海三陰交勞淋復溜血淋然谷大敦小便不利不通三焦俞小腸俞陰交中極兼腹痛中封太衝至陰小便不禁氣海兼治小兒遺尿關元陰陵泉大敦行間治失尿大便祕結章門二七壯陰交氣海刺石門足三里三陰交照海刺太白刺大敦大都疝氣大都痛甚者為肝疝肩井㿗疝章門氣海歸來關元主㿗疝偏大灸百壯衝門急脈會陰三陰交肝脾太溪寒疝太衝大敦隱白脾疝闌門在陰莖根兩旁各開三寸是穴針一寸半灸二七壯治木腎偏墜一法於關元兩旁相去各三寸青脈上灸七壯即愈一法令病者合口以草橫量兩口角為一折照此再加二折共為三折屈成三角如樣以上角安臍中心兩角安臍下兩旁當兩角處是穴左患灸右右患灸左左右俱患即兩穴俱灸艾炷如麥粒灸十四壯或二十一壯即安陽不起命門腎俞氣海然谷陰挺曲泉太衝然谷照海莖中痛列缺陰痛尿血行間痔漏命門腎俞長強五痔便血最效隨年壯灸之三陰交痔血承山久痔凡痔疾腫大勢甚者先以槐柳枝煎湯乘熱熏洗過後用壯盛男子篦下頭垢捻成小餅約厚一分置痔上又切獨蒜片厚如錢者置垢上用艾灸二七壯或三七壯無不消散又法單用生薑切薄片放痔痛處用艾炷於姜上灸三壯黃水即出自消散矣若有兩三個者過三五日照依前法逐一灸之神效脫肛百會三壯此穴屬督脈居巔頂為陽脈之都綱統一身之陽氣凡脫肛者皆因陽氣下陷經曰下者舉之故當借火力以提下陷之氣則脾氣可升而門戶固矣小兒亦然胃俞長強又有洞泄寒中脫肛者須灸水分穴百壯內服溫補藥自愈邪祟凡暴厥不省人事若四肢雖冷無氣但覺目中神采不變心腹尚溫口中無涎舌不卷囊不縮及未出一時者尚可刺之復蘇也五邪皆然此下治法出素問遺篇肺虛者肺俞刺入一寸半得氣則補留三呼次進一分留一呼徐徐出針合谷刺三分得氣則補留三呼退一分留一呼徐徐出針心虛者心俞以毫針刺之得氣留補即蘇陽池刺同肝虛者肝俞以毫針刺三分得氣留補丘墟以毫針刺三分得氣則補留三呼腹中鳴者可治也脾虛者脾俞刺三分留二呼進二分氣至徐徐退針即蘇衝陽以毫針刺三分得氣則補留三呼次進一分留一呼徐徐退針以手摸之腎虛者腎俞刺三分得氣則補留三呼又進二分留三呼徐徐出針一云在十五椎下兩旁疑是奇俞類氣海俞也以上刺法必先以口含針令溫暖而刺之則經脈之氣無拒逆也鬼魅上星水溝鬼擊卒死秦承祖灸鬼法見前奇俞類四肢部中夢魘鬼擊人中七壯足鬼眼穴在奇俞類婦人病血結月事不調氣海中極照海月事不行血崩不止膈俞肝俞腎俞命門氣海中極下元虛冷血崩白濁間使血海復溜行間淋帶赤白命門神闕中極七壯冶白帶極效余用前五淋穴癥瘕三焦俞腎俞中極會陰子宮子戶左子宮右子戶在關元旁各開三寸千金翼以三寸為氣門穴詳奇俞類復溜不孕命門腎俞氣海中極關元七壯至百壯或三百壯胞門子戶二穴詳奇俞類陰廉然谷照海子宮泠一法灸神闕穴先以淨干鹽填臍中灸七壯後去鹽換川椒二十一粒上以薑片蓋定又灸十四壯灸畢即用膏貼之艾炷須如指大長五六分許胎屢墮命門腎命中極交信然谷産難橫生合谷三陰交一治橫逆難産危在頃刻符藥不靈者急於本婦右腳小指尖灸三壯炷如小麥下火立産如神蓋此即至陰穴也子鞠不能下巨闕合谷三陰交至陰三稜針出血橫者即轉直胎衣不下三陰交崑崙下死胎合谷刺補之即下欲取胎肩井合谷三陰交産後惡露不止中極欲絶産臍下二寸三分灸三壯或至七七壯即終身絶孕小兒病忌灸三里年三十外方可灸此羸瘦骨立百勞胃俞腰俞長強急慢驚風百會五七壯囟會上星率谷三壯水溝尺澤慢驚間使合谷太衝五壯臍風撮口在母腹中氣逆所致或産時不慎受寒而然承漿然谷一法以小艾炷隔蒜灸臍中俟口中覺有艾氣亦得生者又法凡臍風若成必有青筋一道自下上行至腹而生兩岔即灸青筋之頭三壯截住若見兩岔即灸兩處筋頭各三壯十活五六不則上行攻心而死矣食積肚大脾俞胃俞腎俞泄瀉胃俞水分天樞神闕腹痛乳痢甚妙霍亂水分轉筋入腹外踝上尖三壯夜啼心氣不足中衝三壯疳眼合谷五壯重舌行間小兒氣弱數歲不語心俞口中轉屎因母食寒涼所致中脘九壯大人十四壯陰腫崑崙疝氣會陰大敦五癇神庭治風癇吐舌角弓反張灸三壯前頂治小兒一切驚癇證灸三壯長強治諸驚癇灸七壯囟會巨闕章門天井少海內關少衝一法云癇為小兒惡證古云驚風三發便為癇癇證有五即牛羊豬馬雞之類也治法俟其病發之時將患者兩手大拇指相併以綿繩縛定當兩指爪甲角是名手鬼眼穴用艾灸七壯須甲肉四處著火方效又二穴在足大拇指亦如取手穴法是名足鬼眼穴如前灸之大效大人病此則名為癲灸亦如之最良牛癇大杼鳩尾尖下五分炙三壯不可多羊癇目直作羊聲百會神庭心俞肝俞天井神門太衝豬癇痰涎如綿作豬聲百會巨闕心俞神門馬癇張口搖頭角弓反張百會心俞命門神門僕參太衝照海雞癇張手前僕提住即醒申脈外科發背心俞疽委陽一曰在尻臀下一寸六分大腿上有縫騎竹馬穴左右搭手加會陽癰疽隔蒜灸法凡患背疽惡毒肉色不變背如負石漫腫無頭者勢必重大尋頭之法用濕紙拓在腫處看有一點先乾者即是癰頭結聚之處用大獨頭蒜切作三分厚片貼疽頂以艾於蒜上灸之每三壯一換其蒜又有背上初發赤腫中間有如黃小米一粒者有十數粒一片者尤宜隔蒜灸之青囊書云外形如粟內可容谷外狀如錢里可著拳慎勿視為微小致成莫大之患設或瘡頭開大則以紫皮大蒜十餘頭淡豆豉半合乳香二錢同搗成膏照毒大小拍成薄餅置毒上鋪艾灸之務要痛者灸至不痛不痛者灸至知痛蓋痛者為良肉不痛者為毒氣先不痛而後覺痛者其毒輕淺先痛而後反不痛者其毒深重故灸者必令火氣直達毒處不可拘定壯數昔人有灸至八百壯而愈者灸後須隨人虛實服補中托裡助胃壯氣等藥萬無一失蓋未潰而灸則能拔散郁毒不令開大已潰而灸則能補接陽氣易於收斂然惟早覺早灸方為上策淵然劉真人曰毒發一二日者十灸十愈三四日者六七愈五六日者三四愈過七日則雖灸不能消散矣緣其內膿已成必須針去方得寬鬆也雖然疽之為病有五善七惡臨證之時先須識此前哲云五善見三則吉七惡見四則凶倘見七惡慎勿為灸徒召謗耳又有疔瘡一證其形不一其色不同或如小癗或如水泡或痛不可當或癢而難忍或皮肉麻木或寒熱頭疼或噁心嘔吐或肢體拘急其候多端難以盡狀皆須用前灸法甚則以蒜膏遍塗四圍只露毒頂用艾著肉灸之以爆為度如不爆者難愈更宜多灸百壯以上無弗愈者乳癰乳疽乳岩乳氣乳毒侵囊近膻中者是肩髃靈道二七壯溫溜小人七壯大人二七壯足三里條口乳癰下巨虛各二七壯熱毒大陵肺癰吐膿腎俞三七壯合谷二七壯太淵二七壯頂上偏枕風門二七壯胃癰生於左者胃口疽生於右者胃口癰曲池二穴各三七壯內關七壯腎癰自腎俞穴起會陽二七壯附骨疽環跳穴痛恐生附骨疽也大陵懸鐘三七壯骨旋肘尖七七壯不愈百壯瘰癧蜂窠癧自左邊起七七竅皆出膿肩髃七壯九壯曲池此二穴乃治癧祕法也天池天井二七壯三間三七壯錐鋭癧右邊生起肩髃曲池天井盤蛇癧延頸生者肩尖即肩髃肘尖即曲池人迎七壯肩外俞二七壯天井二七壯騎竹馬穴三七壯瓜藤癧胸前生者肘尖少海騎竹馬穴馬刀腋下者淵腋支溝外關足臨泣頸腋俱治癧瘡出於頰下及頰車邊者當於手足陽明經取穴治之然肩髃曲池二穴亦妙合谷足三里各七壯以上凡感毒深者灸後再二三次報之無有不愈瘰癧隔蒜灸法用獨蒜片先從後發核上灸起至初發母核而止多灸自效又傳驗方用癩蝦蟆一個破去腸覆癧上外以真蘄艾照癧大小為炷於蝦蟆皮上當癧灸七壯或十四壯以熱氣透內方住亦從後發者先灸至初發者而止若蝦蟆皮焦須移易灸之灸畢服煎藥一劑其方用牙皂七個殭蠶七條栝蔞一個連皮子切碎五味子一歲一粒上四味以水二鍾煎熟外加生煎大黃三五錢量人虛實用之一服即消百試百效不問已潰未潰經灸必愈癭瘤肩髃男左灸十八壯右十七壯女右灸十八壯左十七壯天突治一切癭瘤初起者灸之妙通天癭風池百壯大椎頸癭氣舍灸五壯雲門癭臂臑癭臑會五壯天府五七壯曲池癭中封癭衝陽三壯身面贅疣當疣上灸三壯即消亦有止灸一壯以水滴之自去者癮疹曲池瘡疥風門間使合谷大陵胸前瘡疥毒瘡久不收口凡患癰毒潰後久不收口膿水不臭亦無歹肉者此因消敗太過以致血氣虛寒不榮肌肉治失其宜便為終身之患須內服十全大補等藥外用大附子以溫水泡透切作二三分厚片置漏孔上以艾灸之或以附子為末用唾和作餅灸之亦可隔二三日再灸之不三五次自然肌肉長滿而宿患平矣又方用麥面硫黃大蒜三味搗爛如患大小捻作三分厚餅安患上灸三七壯每三壯一易餅子四五日後再灸一次無弗效者腋氣除根凡腋氣先用快刀剃去腋毛淨乃用好定粉水調搽患處六七日後看腋下有一點黑者必有孔如針大或如簪尖即氣竅也用艾炷如米大者灸之三四壯愈永不再發諸毒傷五蠱毒注中惡不能食中脘照海中蠱毒瘋犬咬傷急令人吮盡惡血於咬處灸百壯以後日日灸之百日乃止忌豬肉與酒一生慎之孫真人曰春末夏初犬多發狂被其咬者無出於灸其法只就咬處牙跡上灸之一日灸三壯灸至一百二十日乃止宜常灸食韭菜永不再發亦良法也又治一切犬傷毒氣不出者須灸外丘一曰灸所齧處立愈蛇毒凡蛇傷中毒者灸毒上三七壯若一時無艾以火炭頭稱瘡孔大小爇之諸蟲毒凡蛇蠍蜈蚣咬傷痛極勢危者急用艾火於傷處灸之拔散毒氣即安或用獨蒜片隔蒜灸之二三壯換一片毒甚者灸五十壯或內服紫金丹亦妙或馬汗入瘡及蠶毒蜘蛛等毒灸之皆效
