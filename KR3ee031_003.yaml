body:
  text: 類經附翼卷三求正録三焦包絡命門辨附子宮血室客有問曰三焦包絡命門者醫者之要領臟腑之大綱或言其有狀或言其無形或言三焦包絡為表裡或言三焦命門為表裡或言五臟各一惟腎有兩左為腎右為命門命門者男子以藏精女子以系胞若此數者弗能無疑千載而下議論不定夫理無二致豈容紛紛若是哉果亦有歸一之義否豫曰噫醫道之始始自軒岐軒岐之旨昭諸靈素靈素之妙精確無遺凡其所論必因理而發凡其命名必因形而生故內經之文字無苟言句無空發自後凡紹此統者孰能外靈素之範圍而今之所以紛紛者不無其由蓋自難經始也難經述靈素而作為諸家之最先因其頗有謬誤遂起後世之惑三千年來無敢違背而後世之疑莫可解救請先悉三焦心包絡而次及其他焉夫三焦者五臟六腑之總司包絡者少陰君主之護衛也而二十五難曰心主與三焦為表裡俱有名而無形若謂表裡則是謂無形則非夫名從形立若果有名無形則內經之言為鑿空矣其奈叔和啓玄而下悉皆宗之而直曰三焦無狀空有名自二子不能辨此後孰能再辨及至徐遁陳無擇始創言三焦之形云有脂膜如掌大正與膀胱相對有二白脈自中出夾脊而上貫於腦豫因遍考兩經在靈樞本輸篇曰三焦者中瀆之府水道出焉屬膀胱是孤之府也本藏篇曰密理厚皮者三焦膀胱厚粗理薄皮者三焦膀胱薄以及緩急直結六者各有所分論勇篇曰勇士者目深以固長衡直揚三焦理橫怯士者目大而不減陰陽相失其焦理縱決氣篇曰上焦開發宣五穀味熏膚充身澤毛若霧露之溉是謂氣中焦受氣取汁變化而赤是謂血營衛生會篇曰營出於中焦衛出於下焦又曰上焦出於胃上口並咽以上貫膈而布胸中中焦亦並胃中出上焦之後泌糟粕蒸津液化精微而為血以奉生身故獨得行於經隧命曰營氣下焦者別回腸注於膀胱而滲入焉水穀者居於胃中成糟粕下大腸而成下焦又曰上焦如霧中焦如漚下焦如瀆素問五臟別論曰夫胃大腸小腸三焦膀胱此五者天氣之所生也其氣象天故瀉而不藏六節藏象論曰脾胃大腸小腸三焦膀胱者倉廩之本營之居也其在心包絡則靈樞邪客篇曰心者五臟六腑之大主其臟堅固邪弗能容容之則心傷心傷則神去神去則死矣故諸邪之在於心者皆在於心之包絡凡此是皆經旨夫既曰無形矣何以有水道之出又何以有厚薄緩急直結之分又何以有曰縱曰橫之理又何以如霧如漚如瀆及謂氣謂血之別心主亦曰無形矣則代心而受邪者在於心之包絡使無其形又當受之何所即此經文有無可見夫難經者為發明內經之難故曰難經而難經實出於內經今內經詳其名狀難經言其無形將從難經之無乎抑從內經之有乎再若徐陳二子所言三焦之伏指為腎下之脂膜果若其然則何以名為三又何以分為上中下又何以言其為府此之為說不知何所考據更屬不經客曰心之包絡於文於義猶為可曉而古今諸賢歷指其為裹心之膜固無疑矣至若三焦者今既曰有形又非徐陳之論然則果為何物耶曰但以字義求之則得之矣夫所謂三者象三才也際上極下之謂也所謂焦者象火類也色赤屬陽之謂也今夫人之一身外自皮毛內至臟腑無巨無名無細無目其於腔腹周圍上下全體狀若大囊者果何物耶且其著內一層形色最赤象如六合總護諸陽是非三焦而何如五癃津液別論曰三焦出氣以溫肌肉充皮膚固已顯然指肌肉之內臟腑之外為三焦也又如背腧篇曰肺腧在三焦之間心腧在五焦之間膈腧在七焦之間肝腧在九焦之間脾腧在十一焦之間腎腧在十四焦之間豈非以軀體稱焦乎惟虞天民曰三焦者指腔子而言總曰三焦其體有脂膜在腔子之內包羅乎五臟六腑之外也此說近之第亦未明焦字之義而脂膜之說未免又添一層矣至其相配表裡則三焦為臟腑之外衛心包絡為君主之外衛猶夫帝闕之重城故皆屬陽均稱相火而其脈絡原自相通允為表裡靈樞經脈篇曰心主乎厥陰之脈出屬心包絡下膈歷絡三焦手少陽之脈散絡心包合心主素問血氣形志篇曰手少陽與心主為表裡此固甚明無庸辨也客曰既三焦心主為表裡何以復有命門三焦表裡之說曰三焦包絡為表裡此內經一陰一陽之定耦初無命門表裡之說亦無命門之名唯靈樞根結衛氣及素問陰陽離合等篇云太陽根於至陰結於命門命門者目也此蓋指太陽經穴終於睛明睛明所夾之處是為腦心乃至命之處故曰命門此外並無左右腎之分亦無右腎為命門之說而命門之始亦起於三十六難曰腎有兩者非皆腎也左者為腎右者為命門命門者精神之所舍原氣之所繫男子以藏精女子以系胞王叔和遂因之而曰腎與命門俱出尺部以致後世遂有命門表裡之配而內經實所無也客曰內經既無命門難經何以有之而命門之解終當何似曰難經諸篇皆出內經而此命門或必有據意者去古既遠經文不無脫誤誠有如七難滑氏之注云者滑氏注七難曰首篇稱經言二字考之靈素無所見豈越人之時別有所謂上古文字耶將內經有之而後世脫簡耶是不可知也唯是右腎為命門男子以藏精則左腎將藏何物乎女子以系胞則胞果何如而獨系右腎乎此所以不能無疑也豫因歷考諸書見黃庭經曰上有黃庭下關元後有幽闕前命門又曰閉塞命門似玉都又曰丹田之中精氣微玉房之中神門戶梁丘子注曰男以藏精女以約血故曰門戶又曰關元之中男子藏精之所元陽子曰命門者下丹田精氣出飛之處也是皆醫家所未言而實足為斯發明者又脈經曰腎以膀胱合為腑合於下焦在關元后左為腎右為子戶又曰腎名胞門子戶尺中腎脈也此言右為子戶者仍是右者為命門之說細詳諸言默有以會夫所謂子戶者即子宮也即玉房之中也俗名子腸居直腸之前膀胱之後當關元氣海之間男精女血皆存乎此而子由是生故子宮者實又男女之通稱也道家以先天真一之氣藏乎此為九還七返之基故名之曰丹田醫家以衝任之脈盛於此則月事以時下故名之曰血室葉文叔曰人受生之初在胞胎之內隨母呼吸受氣而成及乎生下一點元靈之氣聚於臍下自為呼吸氣之呼接乎天根氣之吸接乎地根凡人之生唯氣為先故又名為氣海然而名雖不同而實則一子宮耳子宮之下有一門其在女者可以手探而得俗人名為産門其在男者於精泄之時自有關闌知覺請問此為何處客曰得非此即命門耶曰然也請為再悉其解夫身形未生之初父母交會之際男之施由此門而出女之攝由此門而入及胎元既足復由此出其出其入皆由此門謂非先天立命之門戶乎及乎既生則三焦精氣皆藏乎此故金丹大要曰氣聚則精盈精盈則氣盛梁丘子曰人生繫命於精珠玉集曰水是三才之祖精為元氣之根然則精去則氣去氣去則命去其固其去皆由此門謂非後天立命之門戶乎再閲四十四難有七衝門者皆指出入之處而言故凡出入之所皆謂之門而此一門者最為巨會焉得無名此非命門更屬何所既知此處為命門則男之藏精女之系胞皆有歸著而千古之疑可頓釋矣客曰若夫然則命門既非右腎而又曰子宮是又別為一腑矣所配何經脈居何部曰十二經之表裡陰陽固已配定若以命門而再配一經是腎臟唯一而經居其兩必無是理且夫命門者子宮之門戶也子宮者腎臟藏精之府也腎臟者主先天真一之氣北門鎖鑰之司也而其所以為鎖鑰者正賴命門之閉固蓄坎中之真陽以為一身生化之原也此命門與腎本同一氣道經謂此當上下左右之中其位象極名為丹田夫丹者奇也故統於北方天一之臟而其外腧命門一穴正是督脈十四椎中是命門原屬於腎非又別為一腑也三十九難亦曰命門其氣與腎通則亦不離乎腎耳唯是五臟各一獨腎有二既有其二象不無殊譬以耳目一也而左明於右手足一也而右強於左故北方之神有蛇武蛇主陽而武主陰兩尺之脈分左右左主水而右主火夫左陽右陰理之常也而此曰左水右火又何為然蓋腎屬子中氣應冬至當陰陽中分之位自冬至之後天左旋而時為春斗杓建於析木日月右行合在亥辰次會於娵訾是陽進一月則會退一宮而太陽漸行於右人亦應之故水位之右為火也且人之四體本以應地地之剛在西北亦當右尺為陽理宜然者故脈經以腎臟之脈配兩尺但當曰左尺主腎中之真陰右尺主腎中之真陽而命門為陽氣之根故隨三焦相火之脈同見於右尺則可若謂左腎為腎右腎為命門則不可也雖然若分而言之則左屬水右屬火而命門當附於右尺合而言之則命門象極為消長之樞紐左主升而右主降前主陰而後主陽故水象外暗而內明坎卦內奇而外偶腎兩者坎外之偶也命門一者坎中之奇也一以統兩兩以包一是命門總主乎兩腎而兩腎皆屬於命門故命門者為水大之府為陰陽之宅為精氣之海為死生之竇若命門虧損則五臟六腑皆失所恃而陰陽病變無所不至其為故也正以天地發生之道終始於下萬物盛衰之理盈虛在根故許學士獨知補腎薛立齊每重命門二賢高見迥出常人蓋得於王太僕所謂壯水之主益火之原也此誠性命之大本醫不知此尚何足云故豫為申明用廣其義即此篇前後諸論雖多臆見然悉揣經意非敢妄言凡我同心幸為裁正大寶論為人不可不知醫以命為重也而命之所繫惟陰與陽不識陰陽焉知醫理此陰陽之不可不論也夫陰陽之體曰乾與坤陰陽之用曰水與火陰陽之化曰形與氣以生殺言則陽主生陰主殺以寒熱言則熱為陽寒為陰若其生化之機則陽先陰後陽施陰受先天因氣以化形陽生陰也後天因形以化氣陰生陽也形即精也精即水也神即氣也氣即火也陰陽二氣最不宜偏不偏則氣和而生物偏則氣乖而殺物經曰陰平陽祕精神乃治陰陽離決精氣乃絶此先王憫生民之夭厄因創明醫道以垂惠萬世者在教人以察陰陽保生氣而已也故內經於陰陽之理惟恐人之不明而切切諄諄言之再四奈何後學猶未能明余請先言其二而後言其一夫二者陰也後天之形也一者陽也先天之氣也神由氣化而氣本乎天所以發生吾身者即真陽之氣也形以精成而精生於氣所以成立吾身者即真陰之氣也觀上古天真論曰女子二七而後天癸至男子二八而後天癸至非若陰生在後而陰成之難乎又陰陽應象大論曰人年四十而陰氣自半也非若陰衰在前而陰雕之易乎所謂陰者即吾之精而造吾之形也夫無形則無患有形必有毀故人生全盛之數惟二八之後以至四旬之外前後止二十餘年而形體漸衰矣此誠陰虛之象也由此觀之即謂之陽道實陰道虛若無不可故丹溪引日月之盈虧以為陽常有餘陰常不足之論而立補陰大補等丸以黃柏知母為神丹家傳戶用其害孰甚殊不知天癸之未至本由乎氣而陰氣之自半亦由乎氣是形雖在陰而氣則仍從陽也此死生之機不可不辨余所謂先言其二者即此是也何謂其一一即陽也陽之為義大矣夫陰以陽為主所關於造化之原而為性命之本者惟斯而已何以見之姑舉其最要者有三義焉一曰形氣之辨二曰寒熱之辨三曰水火之辨夫形氣者陽化氣陰成形是形本屬陰而凡通體之溫者陽氣也一生之活者陽氣也五官五臟之神明不測者陽氣也及其既死則身冷如冰靈覺盡滅形固存而氣則去此以陽脫在前而陰留在後是形氣陰陽之辨也非陰多於陽乎二曰寒熱者熱為陽寒為陰春夏之暖為陽秋冬之冷為陰當長夏之暑萬國如爐其時也凡草木昆蟲鹹苦煎炙然愈熱則愈繁不熱則不盛及乎一夕風霜即僵枯遍野是熱能生物而過熱者惟病寒無生意而過寒則伐盡然則熱無傷而寒可畏此寒熱陰陽之辨也非寒強於熱乎三曰水火者水為陰火為陽也造化之權全在水火而水火之象有四則日為太陽火為少陽水為太陰月為少陰此四象之真形而人所未達也余言未竟適一耽醫之客過余者聞而異之曰月本太陰火豈少陽古無是說何據云然亦有所謂乎曰陽主乎外陰主乎內此陰陽之定位也陽中無太陰陰中無太陽此陰陽之專主也日麗乎天此陽中之陽也非太陽乎月之在天陽中之陰也非少陰乎水行於地陰中之陰也非太陰乎火之在地陰中之陽也非少陽乎此等大義誠丹溪所未知故引日月盈虧以證陰陽虛實亦焉知水大於月獨不慮陽之不足陰之太過乎客曰陰陽太少之說固若有理至於水大於月便是陰之有餘則凡天下之火不少也陽豈獨在於日乎曰是更有妙理存也夫陰陽之性太者氣剛故日不可滅水不可竭此日為火之本水為月之根也少者氣柔故火有時息月有時缺此火是日之餘月是水之餘也惟其不滅者方為真火而時作時止者豈即元陽故惟真陽之火乃能生物而燎原之凡火但能焦物病物未聞有以烘炙而生物者是安可以火喻日也客曰若如此言則水誠太陰矣然何以雲天一生水水非陽乎又何以雲水能生萬物水非生氣乎曰此問更妙夫天一者天之一也一即陽也無一則止於六耳故水之生物者賴此一也水之化氣者亦賴此一也不觀乎春夏之水土得之而能生能長者非有此一乎秋冬之水土得之而不生不長者非無此一乎不惟不生而自且為凍是水亦死矣可見水之所以生水之所以行孰非陽氣所主此水中有陽耳非水即為陽也客曰然則生化之權皆由陽氣彼言陽有餘者誠非謬也而子反慮其不足非過慮乎曰余為此論正為此耳惟恐人之不悟故首言形氣次言寒熱此言水火總欲辨明陽非有餘不可不顧之義夫陽主生陰主殺凡陽氣不充則生意不廣而況於無陽乎故陽惟畏其衰陰惟畏其盛非陰能自盛也陽衰則陰盛矣凡萬物之生由乎陽萬物之死亦由乎陽非陽能死物也陽來則生陽去則死矣試以太陽證之可得其象夫日行南陸在時為冬斯時也非無日也第稍遠耳便見嚴寒難御之若此萬物凋零之若此然則天地之和者惟此日也萬物之生者亦惟此日也設無此日則天地雖大一寒質耳豈非六合盡冰壺乾坤皆地獄乎人是小乾坤得陽則生失陽則死陽衰者即亡陽之漸也恃強者即致衰之兆也可不畏哉故伏羲作易首制一爻此立元陽之祖也文王衍易凡六十四卦皆以陽喻君子陰喻小人此明陽氣之德也乾之彖曰大哉乾元萬物資始乃統天此言元貫四德陽為發育之首也坤之初六曰履霜堅冰至此慮陰之漸長防其有妨化育也大有之彖曰大有元亨火在天上此言陽德之亨無所不照也繫辭曰天地之大德曰生此切重生生之本也內經曰凡陰陽之要陽密乃固此言陰之所恃者惟陽為主也又曰陽氣者若天與日失其所則折壽而不彰故天運當以日光明此言天之運人之命元元根本總在太陽無兩也凡此經訓蓋自伏羲黃帝文王岐伯周公孔子六大聖人千古相傳若出一口豈果余之私慮哉由此言之可見天之大寶只此一丸紅曰人之大寶只此一息真陽孰謂陽常有餘而欲以苦寒之物伐此陽氣欲保生者可如是乎客曰至哉余得聞所生之自矣然既有其道豈無其法欲固此陽計從安出曰但知根本即其要也曰何為根本曰命門是也曰余聞土生萬物故脾胃為五臟六腑之本子言命門余未解也曰不觀人之初生生由臍帶臍接丹田是為氣海即命門也所謂命門者先天之生我者由此而受後天之我生者由此而栽也夫生之門即死之戶所以人之盛衰安危皆繫於此者以其為生氣之源而氣強則強氣衰則病此雖至陰之地而實元陽之宅若彼脾胃者乃後天水穀之本猶屬元陽之子耳子欲知醫其母忽此所生之母焉言難盡意請再著真陰論以悉之何如客欣然曰願再聞其義真陰論凡物之死生本由陽氣顧今人之病陰虛者十常八九又何謂哉不知此一陰字正陽氣之根也蓋陰不可以無陽非氣無以生形也陽不可以無陰非形無以載氣也故物之生也生於陽物之成也成於陰此所謂元陰元陽亦曰真精真氣也前篇言陰陽之生殺者以寒熱言其性用也此篇言陰陽之生成者以氣質言其形體也性用操消長之權形體系存亡之本欲知所以死生者須察乎陽察陽者察其衰與不衰欲知所以存亡者須察乎陰察陰者察其壞與不壞此保生之要法也稽之前輩殊有誤者不識真陰面目每多矯強立言自河間主火之說行而丹溪以寒苦為補陰舉世宗之莫能禁止揆厥所由蓋以熱證明顯人多易見寒證隱微人多不知而且於虛火實火之間尤為難辨亦孰知實熱為病者十中不過三四虛火為病者十中嘗見六七夫實熱者凡火也凡火之盛元氣本無所傷故可以苦寒折之信手任心何難之有然當熱去即止不可過用過則必傷元氣況可誤從為火乎虛火者真陰之虧也真陰不足又豈苦劣難堪之物所能填補矧沉寒之性絶無生意非惟不能補陰抑且善敗真火若屢用之多令人精寒無子且未有不暗損壽元者第陰性柔緩而因循玩用弗之覺耳嘗見多壽之人無不慎節生冷所以得全陽氣即有老人亦喜涼者正以元陽本足故能受寒非寒涼之壽之也由此觀之足徵余言之非謬矣蓋自余有知以來目睹苦寒之害人者已不可勝紀此非時醫之誤實二子傳之而然先王仁受之德遭敝於此使劉朱之言不息則軒岐之澤不彰是誠斯道之大魔亦生民之厄運也夫成德掩瑕豈非君子余獨何心敢議先輩蓋恐爭之不力終使後人猶豫長夢不醒貽害彌深顧余之念但知有軒岐而不知有諸子但知有好生而不知有避諱此言之不容已也然言之不明孰若無言余請詳言真陰之象真陰之臟真陰之用真陰之病真陰之治以悉其義所謂真陰之象者猶家宅也猶器具也猶妻妾也所貴乎家宅者所以蓄財也無家宅則財必散矣所貴乎器具者所以保物也無器具則物必毀矣所貴乎妻妾者所以助夫也無妻妾則夫必蕩矣此陰以陽為主陽以陰為根也經曰五臟者主藏精者也不可傷傷則失守而陰虛陰虛則無氣無氣則死矣非以精為真陰乎又曰形肉已脫九候雖調猶死非以形為真陰乎觀形質之壞與不壞即真陰之傷與不傷此真陰之象不可不察也所謂真陰之臟者凡五臟五液各有所主是五臟本皆屬陰也然經曰腎者主水受五臟六腑之精而藏之故五液皆歸乎精而五精皆統乎腎腎有精室是曰命門為天一所居即真陰之腑精藏於此精即陰中之水也氣化於此氣即陰中之火也命門居兩腎之中即人身之太極由太極以生兩儀而水火具焉消長系焉故為受生之初為性命之本欲治真陰而捨命門非其治也此真陰之臟不可不察也所謂真陰之用者凡水火之功缺一不可命門之火謂之元氣命門之水謂之元精五液充則形體賴而強壯五氣治則營衛賴以和調此命門之水火即十二臟之化源故心賴之則君主以明肺賴之則治節以行脾胃賴之濟倉廩之富肝膽賴之資謀慮之本膀胱賴之則三焦氣化大小腸賴之則傳導自分此雖云腎臟之伎巧而實皆真陰之用不可不察也所謂真陰之病者凡陰氣本無有餘陰病惟皆不足即如陰勝於下者原非陰盛以命門之火衰也陽勝於標者原非陽盛以命門之水虧也水虧其源則陰虛之病疊出火衰其本則陽虛之證迭生如戴陽者面赤如朱格陽者外熱如火或口渴咽焦每引水以自救或躁擾狂越每欲臥於泥中或五心煩熱而消疸骨蒸或二便祕結而溺漿如汁或為吐血衄血或為咳嗽遺精或斑黃無汗者由津液之枯涸或中風瘛瘲者以精血之敗傷凡此之類有屬無根之焰有因火不歸原是皆陰不足以配陽病在陰中之水也又如火虧於下則陽衰於上或為神氣之昏沉或為動履之困倦其有頭目眩暈而七竅偏廢者有咽喉哽咽而嘔惡氣短者皆上焦之陽虛也有飲食不化而吞酸反胃者有痞滿隔塞而水泛為痰者皆中焦之陽虛也有清濁不分而腸鳴滑泄者有陽痿精寒而臍腹多痛者皆下焦之陽虛也又或畏寒灑灑者以火臟之陽虛不能禦寒也或肌肉臌脹者以土臟之陽虛不能制水也或拘攣痛痹者以木臟之陽虛不能營筋也或寒嗽虛喘身涼自汗者以金臟之陽虛不能保肺也或精遺血泄二便失禁腰脊如折骨痛之極者以水臟之陽虛精髓內竭也凡此之類或以陰強之反克或由元氣之被傷皆陽不足以勝陰病在陰中之火也王太僕曰寒之不寒責其無水熱之不熱責其無火無火無水皆在命門總曰陰虛之病不可不察也所謂真陰之治者凡亂有所由起病有所由生故治病必當求本蓋五臟之本本在命門神氣之本本在元精此即真陰之謂也王太僕曰壯水之主以制陽光益火之源以消陰翳正此謂也許學士曰補脾不如補腎亦此謂也近惟我明薛立齊獨得其妙而常用仲景八味丸即益火之劑也錢氏六味丸即壯水之劑也每以濟人多收奇效誠然善矣第真陰既虛則不宜再泄二方俱用茯苓澤瀉滲利太過即仲景金匱亦為利水而設雖曰於大補之中加此何害然未免減去補力而奏功為難矣使或陰氣雖弱未至大傷或臟氣微滯而兼痰濕水邪者則正宜用此若精氣大損年力俱衰真陰內乏虛痰假火等證即從純補猶嫌不足若加滲利如實漏卮矣故當察微甚緩急而用隨其人斯為盡善余及中年方悟補陰之理因推廣其義用六味之意而不用六味之方活人應手之效真有不能盡述者夫病變非一何獨重陰有弗達者必哂為謬姑再陳之以見其略如寒邪中人本為表證而汗液之化必由乎陰也中風為病身多偏枯而筋脈之敗必由乎陰也虛勞生火非壯水何以救其燎原瀉泄正陰非補腎何以固其門戶臌脹由乎水邪主水者須求水臟關格本乎陰虛欲強陰舍陰不可此數者乃疾病中最大之綱領明者覺之可因斯而三反矣故治水治火皆從腎氣此正重在命門而陽以陰為基也老子曰知其雄守其雌夫雄動而作雌靜而守然動必歸靜雄必歸雌此雄之不可不知雌之不可不守也邵子曰三月春光留不住春歸春意難分付凡言歸者必歸家為問春家在何處夫陽春有腳能去能來識其所歸則可藏可留而長春在我矣此二子之教我真我之大宗師也人能知雄之有雌春之有家則知真陰之為義矣余因制二歸丸方願與知本知音者共之左歸丸治真陰腎水不足不能滋溉營衛漸至衰羸或虛熱往來自汗盜汗或神不守舍血不歸原或勞損傷陰或遺淋不禁或氣虛昏運或眼花耳聾或口燥舌乾或腰痠腿軟凡精髓內竭津液枯涸等證俱速宜壯水之主以培左腎之元陰此方主之大杯熟地八兩山藥炒四兩山茱萸肉四兩龜膠切碎炒珠四兩川牛膝酒洗蒸熟三兩鹿角膠敲碎炒珠二兩菟絲子制熟三兩枸杞子三兩上先將熟地杵膏加煉蜜和丸桐子大每食前用滾白湯送下百餘丸如真陰失守虛火炎上者宜用純陰至靜之荊於本方去枸杞鹿膠加女貞子三兩麥門冬三兩若火爍肺金乾枯多嗽者仍加百合三兩如夜熱骨蒸加地骨皮三兩小水不利加茯苓三兩如大便燥澀去菟絲加肉蓯蓉酒洗三兩如血虛有滯者於本方加當歸四兩凡五液皆主於腎故凡屬陰分之藥亦無不皆能走腎有謂必須引導者皆見之不明耳右歸丸治元陽不足或先天稟衰或勞傷過度以致命門火衰不能生土而為脾胃虛寒飲食少進或嘔惡膨脹或反胃隔塞或怯寒畏冷或臍腹多痛或大便不實瀉利頻作或小水自遺虛淋寒疝或以寒侵溪谷而為肢節痹痛或以寒在下焦而為水邪浮腫總之真陽不足者必神疲氣怯或心跳不寧或四體不收或眼見邪魔或陽衰無子等證俱速宜益火之源以培右腎之元陽此方主之大懷熟地八兩山藥炒四兩山茱萸微炒三兩枸杞微炒四兩鹿角膠炒珠四兩菟絲子制熟四兩杜仲淡薑湯炒四兩當歸三兩便溏者勿用之大附子自二兩漸可加至六兩因人而用肉桂自二兩漸可加至四兩因人而用上丸法如前或丸如彈子大每嚼服二三丸以滾白湯送下則效速更妙如陽衰氣虛必加人參以為之主或二三兩或五六兩隨人虛實以為增減蓋人參之功隨陽藥則入陽分隨陰藥則入陰分故欲補命門之陽非此不能速效如陽虛精滑或帶濁便溏加補骨脂酒炒三兩或飧泄腎泄不止仍加肉豆蔻用麵炒去油三兩如嘔惡吞酸可加乾薑三兩如腹痛不止可加吳茱萸二兩湯泡三次炒用製附子法擇大附子重兩許者半斤可得制淨附子六兩先用大甘草四兩煎濃湯浸附子至二三日剝去薄皮切四塊又浸一日俟其極透取起少涼即切為片用微火徐炒至七分熟意即可用矣若炒至太過恐全失其性左歸飲此壯水之劑也凡命門之陰衰陽勝者宜用此飲加減主之熟地自二三錢可加至一二兩隨輕重用之山藥二錢山茱萸一二錢畏酸者少用之炙甘草一錢妙在此味枸杞二錢相火盛者去之茯苓一錢五分水二鍾煎七八分食遠溫服如肺熱而煩者可加麥門冬二錢如肺熱多嗽者可加百合二錢如血少者可加當歸二錢血滯而熱者可加丹皮二錢陰虛不寧者加女貞子二錢如血熱妄動者可加生地二三錢如脾熱易飢者及多汗傷陰者可加芍藥二錢如心熱多躁者可加玄參二錢如腎熱骨蒸者可加地骨皮二錢如津枯熱渴者可加天花粉二錢如上實下虛者可加牛膝二錢以導之右歸飲此益火之劑也凡命門之陽衰陰勝者宜用此飲加減主之大懷熟地用法如前山藥炒二錢山茱萸肉一錢五分凡吞酸畏酸者當少用之炙甘草一錢枸杞二錢杜仲薑湯炒二錢肉桂自一錢用至二錢製附子隨宜用之至三錢止水二鍾煎七八分食遠溫服如氣虛血脫或厥或昏或汗或運或虛狂或短氣者可加人參自一二錢以至一二兩如火衰不能生土而或為嘔惡或為吞酸者可加炮姜一二三錢如陽衰中寒而泄瀉不止腹痛無休所用製附子自一錢以至二三錢亦須人參兼用或再加肉豆蔻二錢如小腹疼痛加至桂附仍不止者再加吳茱萸一錢許以佐之如淋遺白帶臍腹疼痛者加補骨脂一二錢炒熟搗碎用如血凝血少者可加當歸二三錢十二臟脈候部位論脈為四診之一所關最切兼之俗弊每多諱其因隱其色不出一聲單用脈以試醫之高下此雖病家之自誤然醫當此際苟脈理甚明不得聲色病緣之相合尚恐其有逆順真假脈證相反之誤而矧夫並經絡部位之俱錯其誤又當何如此脈理之不明而醫之所以矇昧至今者是皆誤於宋之高陽生雖高陽生附以己見而著為脈訣若其臟腑所配部位則實本於西晉之脈經云心部在左手關前寸口是也與手太陽為表裡以小腸合為腑合於上焦肺部在右手關前寸口是也與手陽明為表裡以大腸合為腑合於上焦以致高陽生遂有左心小腸肝膽腎右肺大腸脾胃命之說竟將心主三焦之一合謂其無形而俱遺之若此兩經者內經顯然有大經絡豈有有經絡而無脈者亦豈有大小腸位居極下而脈見於兩寸至高之地者自戴同甫而下既已歷言其非然未免甲此乙彼向無歸一之論學者何所宗據今遵內經本文參之以理酌定部位庶無差謬然經文雖無五行所屬之分而後世諸賢以左尺為水生左關木木生左寸火君火類從於右尺而為相火火生右關土土生右寸金而止甚屬有理今既有此五行之分則小腸在下當候於右尺所以從火也大腸在下當候於左尺以金從水也正合母隱子胎之義三焦雖當候於上中下然靈樞本藏篇曰腎合三焦膀胱今腎脈候於兩尺是三焦亦當候於尺且三焦為五臟六腑之總司腎為五臟六腑之根本故靈樞論疾診尺篇獨取尺脈以定人之病形其義蓋亦在此但膀胱屬水故候於左三焦屬火故候於右若心主之脈正當候於左寸蓋以膈膜之上獨惟心肺兩臟居之而心包為護心之膜附於膈上故脈當候於左寸至若命門者為腎之所屬故脈候當隨於腎腎一也而何以候於兩尺腎中之元陰當候於左尺腎中之元陽當候於右尺陰宜靜故左嫌浮豁陽畏衰故右嫌細微然命門之氣以陽為主故當附候於右尺以察其衰旺甚驗部位若此似不可易合而觀之則左寸心臟之火通於右尺小腸命門之火自右尺火土相生而上右寸右寸肺臟之金通於左尺大腸之金自左尺金水相生而上左寸左右上下終始無端正合十二經流注循環之妙而診候庶無差也故內經脈要精微論曰尺內兩旁則季脅也尺外以候腎尺裡以候腹中附上左外以候肝內以候膈右外以候胃內以候脾上附上右外以候肺內以候胸中左外以候心內以候膻中前以候前後以候後上竟上者胸喉中事也下竟下者少腹腰股膝脛足中事也味此經文則左右上下之序自不可紊無待於辨惟是六腑之候雖無明訓而但以上下陰陽之義測之則已暗藏之矣習醫立訓者不本內經之意吾知其皆杜撰鑿空耳觀者其詳辨焉
