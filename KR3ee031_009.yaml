body:
  text: 卷九經絡七奇經八脈此篇諸義與滑伯仁十四經發揮略同奇經總論脈有奇常十二經者常脈也奇經則不拘於常故謂之奇蓋人之氣血常行於十二經脈經脈滿溢則流入奇經奇經有八曰任督沖帶陽蹺陰蹺陽維陰維者是也任脈任於前督脈督於後衝脈為諸脈之海帶脈猶身之束帶陽蹺為足太陽之別陰蹺為足少陰之別陽維則維絡諸陽陰維則維絡諸陰陰陽相維故諸經乃調此八脈者譬猶圖設溝渠以備水潦斯無濫溢之患人之奇經亦若是也今考集素問難經甲乙經聖濟總錄集奇經八脈所發氣穴共成一篇以備通考云虞氏曰奇者奇零之奇不偶之義謂此八者不繫正經陰陽無表裡配合別道奇行故曰奇經也任脈任脈者與衝脈皆起於胞中循脊裡為經絡之海其浮而外者循腹上行會於咽喉別而絡唇口血氣盛則肌肉熱血獨盛則滲灌皮膚生毫毛婦人有餘於氣不足於血以其月事數下任沖並傷故脈不營於口唇而髭鬚不生是以任脈為病男子則內結七疝女子則帶下瘕聚故難經曰任脈起於中極之下以上毛際循腹裡上關元至咽喉上頤循面入目屬陰脈之海凡此任脈之行從胞中上注目長四尺五寸總二十四穴按氣府論曰任脈之氣所發者二十八穴本經原缺一穴實止二十七穴內齦交一穴屬督脈承泣二穴屬足陽明蹺脈故今止二十四穴督脈督脈者起於少腹以下骨中央女子入系廷孔之端其絡循陰器合篡間繞篡後別繞臀至少陰與巨陽中絡者合少陰上股內後廉貫脊屬腎與太陽起目內眥上額交巔上入絡腦還出別下項循肩膊內夾脊抵腰中入循膂絡腎其男子循莖下至篡與女子等其少腹直上者貫臍中央上貫心入喉上頤環唇上系兩目之下中央此生病從少腹上衝心而痛不得前後為沖疝其女子不孕癃痔遺溺嗌乾治在督脈督脈之別名曰長強挾脊上項散上頭下當肩胛左右別走太陽入貫膂實則脊強虛則頭重故難經曰督脈者起於下極之腧並於脊裡上至風府入屬於腦上巔循額至鼻柱屬陽脈之海也此為病令人脊強反折督脈從頭循脊入骶長四尺五寸凡二十八穴衝脈衝脈者與任脈皆起於胞中上循背裡為經絡之海其浮於外者循腹上行會於咽喉別而絡唇口故骨空論曰衝脈者起於氣街並足少陰之經挾臍上行至胸中而散此為病令人逆氣裡急又難經曰並足陽明之經上行然以穴考之足陽明之脈挾臍左右二寸而上行足少陰挾臍左右五分而上行按甲乙銅人等書所載幽門通谷陰都石關商曲肓俞中注四滿氣穴大赫橫骨凡二十二穴皆云衝脈足少陰之會蓋以骨空論為之主也然則衝脈之並足少陰經也明矣按逆順肥瘦篇曰夫衝脈者五臟六腑之海也五臟六腑皆稟焉其上者出於頏顙滲諸陽灌諸精其下者注少陰之大絡出於氣街循陰股內廉入膕中伏行骭骨內下至內踝之後屬而別其下者並於少陰之經滲三陰其前者伏行出跗屬下循跗入大指間滲諸絡而溫肌肉又如動輸篇及海論所言衝脈之義俱當詳考見經絡類十三三十二帶脈帶脈起於季脅回身一周其為病也腰腹縱容如囊水之伏其脈氣所發在季脅下一寸八分穴名帶脈在足少陽經以其回身一周如帶也又與足少陽會於維道此帶脈所發凡四穴足少陰當十四椎出屬帶脈陽蹺脈二十八難曰陽蹺脈者起於跟中循外踝上行入風池繆刺論曰邪客於足陽蹺之脈令人目痛從內眥始二十九難曰陽蹺為病陰緩而陽急兩足陽蹺之脈本太陽之別合於太陽其氣上行氣並相還則為濡目氣不營則目不合男子數其陽女子數其陰當數者為經不當數者為絡也蹺脈長七尺五寸所發之穴生於申脈以跗陽為郄本於僕參與足少陽會於居髎又與手陽明會於肩髃及巨骨又與手足太陽陽維會於臑俞又與手足陽明會於地倉巨髎又與任脈足陽明會於承泣又與手足太陽足陽明陰蹺會於睛明凡二十二穴申脈足太陽外踝下跗陽足太陽外踝上僕參足太陽跟骨上居髎足少陽章門下肩髃手陽明肩端巨骨手陽明肩上臑俞手太陽肩胛上地倉足陽明口吻旁巨髎足陽明鼻旁承泣足陽明目下睛明足太陽目內眥陰蹺脈脈度篇曰蹺脈者少陰之別起於然骨之後上內踝之上直上循陰股入陰上循胸裡入缺盆上出人迎之前入頄屬目內眥合於太陽陽蹺而上行女子以之為經男子以之為絡二十八難曰陰蹺脈者亦起於跟中循內踝上行至咽喉交貫衝脈二十九難曰陰蹺為病陽緩而陰急兩足蹺脈各長七尺五寸而陰蹺所生在照海以交信為郄陰蹺脈病者取此然骨即然谷之次交信足少陰內踝上照海足少陰內踝下在然骨後睛明足太陽目內眥陽維脈陽維維於陽其脈起於諸陽之會與陰維皆維絡於身若陽不能維於陽則溶溶不能自收持其脈氣所發別於金門以陽交為郄與手足太陽及蹺脈會於臑俞與手足少陽會於天髎又會於肩井其在頭也與足少陽會於陽白上於本神及臨泣上至正營循於腦空下至風池其與督脈會則在風府及啞門此陽維脈氣所發凡二十四穴難經曰陽維為病苦寒熱金門足太陽外踝下陽交足少陽外踝上臑俞手太陽肩後天髎手少陽缺盆上肩井足少陽肩上陽白足少陽眉上本神足少陽眉上臨泣足少陽眉上正營足少陽目窗上腦空足少陽枕骨下風池足少陽顳顬後風府督脈後髮際啞門督脈風府後陰維脈陰維維於陰其脈起於諸陰之交若陰不能維於陰則悵然失志其脈氣所發者陰維之郄名曰築賓與足太陰會於腹哀大橫又與足太陰厥陰會於府舍期門與任脈會於天突廉泉此陰維脈氣所發凡十二穴難經曰陰維為病苦心痛築賓足少陰內踝上腹哀足太陰乳下大橫足太陰腹哀下府舍足太陰少腹下期門足厥陰乳下天突任脈喉下廉泉任脈舌本下奇經八脈歌正經經外是奇經八脈分司各有名後督前任皆在內沖由毛際腎同行陽蹺跟外膀胱別陰起跟前隨少陰陽維只絡諸陽脈何謂陰維為絡陰帶脈圍腰如束帶不由常度曰奇經臟腑募俞穴募音暮舉痛論作膜蓋以肉間膜系為臟氣結聚之所故曰募俞音庶扁鵲傳作輸猶委輸之輸言臟氣之所輸也募皆在腹俞皆在背故難經曰募在陰俞在陽也中府肺募在本經巨闕心包募在任脈章門脾募在足厥陰期門肝募在本經中脘胃募在任脈天樞大腸募在足陽明關元小腸募在任脈日月膽募在本經京門腎募在足少陽中極膀胱募在任脈石門三焦募在任脈肺俞三椎下心俞五椎下肝俞九椎下脾俞十一椎下腎俞十四椎下厥陰俞四椎下心包也大腸俞十六椎下小腸俞十八椎下膽俞十椎下膀胱俞十九椎下三焦俞十三椎下胃俞十二椎下八會穴中脘任脈穴太倉也六腑取稟於胃故曰腑會章門足厥陰穴脾募也五臟皆稟於脾故曰臟會陽陵泉足少陽之筋結於此肝主筋膽為之合故曰筋會懸鐘足少陽穴諸髓皆屬於骨故曰髓會人能健步以髓會絕骨也膈俞足太陽穴穀氣由膈達於上焦化精微為血之處故曰血會大椎督脈穴肩脊之骨會於此故曰骨會肩能任重以骨會大椎也太淵手太陰穴平旦脈會於此故曰寸口者脈之大會膻中任脈穴此三焦宗氣所居是為上氣海故曰氣會九門飛門唇也戶門齒也吸門會厭也賁門胃之上口幽門太倉下口闌門小腸下口魄門肛門也命門精血之門居前陰中新增入氣門溲溺之門居前陰中由氣化而出故曰氣門新增入同名穴頭臨泣足少陽足臨泣足少陽腹通谷足少陰足通谷足太陽手三里手陽明足三里足陽明頭竅陰足少陽足竅陰足少陽背陽關督脈足陽關足少陽
