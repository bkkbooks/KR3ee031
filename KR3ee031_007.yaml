body:
  text: 卷七經絡五足太陽膀胱經穴膀胱經穴歌足太陽經六十三睛明攢竹曲差參五處承光接通天絡卻玉枕天柱邊大杼風門引肺俞厥陰心膈肝膽居脾胃三焦腎俞次大腸小腸膀胱如中膂白環皆二行去脊中間二寸許上髎次髎中復下會陽須向尻旁取還有附分在三行二椎三寸半相當魄戶膏肓與神堂譩嘻膈關魂門旁陽綱意舍及胃倉肓門志室連胞肓秩邊承扶殷門穴浮郤相鄰是委陽委中再下合陽去承筋承山相次長飛揚跗陽達崑崙僕參申脈過金門京骨束骨近通谷小指外側尋至陰睛明一名淚孔在目內眥外一分宛宛中氣府論注曰手足太陽足陽明陰陽蹺五脈之會刺一分半留六呼灸三壯甲乙經曰刺六分一曰禁灸主治目痛視不明見風淚出胬肉攀睛白翳眥癢疳眼頭痛目眩凡治雀目者可久留針然後速出之席弘賦云治眼若未效併合谷光明不可缺百證賦云兼行間可治雀目汗氣靈光賦云治胬肉攢竹一名始光一名員柱一名夜光一名光明在眉頭陷者中刺一分留六呼不宜灸甲乙經云灸三壯明堂用細三稜針刺之宣泄熱氣眼目大明宜刺三分出血主治目視䀮䀮淚出目眩瞳子癢眼中赤痛及腮臉瞤動不臥玉龍賦云兼頭維治目疼頭痛百證賦云兼三間可治目中漠漠通玄賦云腦昏目赤瀉此曲差一名鼻沖在神庭旁一寸五分入髮際正頭取之刺二分灸三壯五壯主治目不明頭痛鼻塞鼽衄臭涕頂巔痛身心煩熱汗不出五處在曲差後五分夾上星旁一寸五分刺三分留七呼灸三壯甲乙經曰不可灸主治脊強反折瘛瘲顛疾頭痛戴眼眩暈目視不明承光在五處後一寸五分水熱穴論注曰五處後一寸甲乙經五處後二寸刺三分禁灸主治頭風風眩嘔吐心煩鼻塞不利目翳口喎通天一名天臼在承光後一寸五分一曰橫直百會旁一寸五分刺三分留七呼灸三壯主治頭旋項痛不能轉側鼻塞偏風口喎衄血頭重耳鳴狂走瘛瘲恍惚青盲內瞕千金云癭氣面腫灸五十壯百證賦云能去鼻內無聞之苦絡郤一名強陽一名腦蓋在通天後一寸五分甲乙經一寸三分刺三分留五呼灸三壯一曰禁刺主治頭旋口喎鼻塞項腫癭瘤內瞕耳鳴玉枕在絡郤後一寸五分甲乙經曰在絡卻後七分夾腦戶旁一寸三分起肉枕骨上入後髮際三寸按甲乙經之數與督脈之數不相合刺三分留三呼灸三壯一曰禁刺主治目痛如脫不能遠視腦風頭項痛鼻塞無聞千金云多汗寒熱灸五十壯刺三分百證賦云連囟會療頭風天柱挾項後大筋外廉髮際陷中刺二分留六呼灸三壯一曰刺五分禁灸主治頭旋腦痛鼻塞淚出項強肩背痛足不任身目瞑不欲視百證賦云連養老治目中䀮䀮又云連束骨治項強多惡風大杼在項後第一椎下兩旁相去脊中各二寸陷中正坐取之海論曰衝脈者其輸上在於大杼氣穴論注曰督脈別絡手足太陽三脈之會刺三分留七呼灸五壯七壯一曰禁灸非有大急不可灸也主治傷寒汗不出腰脊項背強痛不得臥喉痹煩滿痎瘧頭痛咳嗽身熱目眩癲疾筋攣瘛瘲膝痛不可屈伸幾刺瘧疾脈滿大者刺此並譩嘻穴出血隨人肥瘦刺之不已刺委中風門立已席弘賦云大杼若連長強尋小腸氣痛即行針風門一名熱府在二椎下兩旁各去脊中二寸正坐取之督脈足太陽之會熱府腧也刺五分留七呼灸五壯主治傷寒頭痛項強目瞑鼽嚏胸中熱嘔逆上氣喘臥不安身熱黃疸癰疽發背此穴能瀉一身熱氣常灸之永無癰疽瘡疥等患神農經云傷風咳嗽頭痛鼻流清涕可灸十四壯及治頭疼風眩鼻衄不止千金云上氣短氣咳逆胸背徹痛灸百壯肺俞在三椎下去脊中各二寸又以手搭背左取右右取左當中指末處是穴正坐取之千金曰肺俞對乳引繩度之刺三分留七呼灸三壯一云灸百壯素問曰刺中肺三日死主治五勞傳尸骨蒸肺風肺痿咳嗽嘔吐上氣喘滿虛煩口乾目眩支滿汗不出腰脊強痛背僂如龜寒熱癭氣黃疸此穴主瀉五臟之熱與五臟俞治同神農經曰治咳嗽吐血唾紅骨蒸虛勞可灸十四壯千金云治吐血唾血上氣咳逆喉痹灸隨年壯又氣短不語灸百壯又治水注口中湧水出灸肺俞及三陰交隨年壯又癭腫上氣短氣灸百壯又盜汗寒熱惡寒灸隨年壯刺五分玉龍賦云兼豐隆治痰嗽百證賦云兼天突治咳嗽連聲乾坤生意云同陶道身柱膏肓治虛損五勞七傷緊要法厥陰俞在四椎下去脊中二寸正坐取之此穴出山眺經甲乙經無刺三分灸七壯主治咳逆牙痛心痛結胸嘔吐煩悶千金云主胸中膈氣積聚好吐灸隨年壯心俞在五椎下去脊中二寸正坐取之刺三分留七呼按甲乙經曰禁灸故世醫皆謂可針不可灸殊不知刺中心一日死乃素問之所戒又豈可易針耶千金方言風中心急灸心俞百壯服續命湯又吐逆不得食者灸百壯是又當權其緩急也主治偏風半身不遂食噎積結寒熱心氣悶亂煩滿恍惚心驚汗不出中風偃臥不得冒絶發癇悲泣嘔吐咳血發狂健忘此穴主瀉五臟之熱與五臟俞同神農經云小兒氣不足者數歲不能語可灸五壯艾炷如麥粒玉龍賦云兼腎俞治腰腎虛乏之夢遺百證賦云兼神道治風癇常發自寧捷徑云治憂噎一傳主療心虛遺精盜汗補之膈俞在七椎下去脊中二寸正坐取之為血之會刺三分留七呼灸三壯一云灸至百壯主治心痛周痹膈胃寒痰暴痛心滿氣急吐食反胃痃癖五積氣塊血塊咳逆四肢腫痛怠惰嗜臥骨蒸喉痹熱病汗不出食不下腹脅脹滿此血會也諸血病者皆宜灸之如吐血衄血不已虛損昏暈血熱妄行心肺二經嘔血臟毒便血不止千金云臚脹脅腹滿灸百壯三報之又治吐逆不得食今日食明日吐灸百壯肝俞在九椎下去脊中二寸正坐取之刺三分留六呼灸三壯素問曰刺中肝五日死主治氣短咳血多怒脅肋滿悶咳引兩脅脊背急痛不得息轉側難反折上視驚狂鼽衄眩暈痛循眉頭黃疸鼻酸熱病後目中出淚眼目諸疾熱痛生翳或熱病瘥後因食五辛患目嘔血或疝氣筋痙相引轉筋入腹此穴主瀉五臟之熱與五臟俞治同千金云吐血酸削灸百壯又胸滿心腹積聚疼痛灸百壯又氣短不語灸百壯玉龍賦云目昏血溢肝俞辨其虛實標幽賦云兼命門能使瞽者見秋毫百證賦云兼少澤可治攀睛一傳治氣痛項癧吐酸膽俞在十椎下去脊中二寸正坐取之刺五分留七呼灸三壯素問曰刺中膽一日半死主治頭痛振寒汗不出腋下腫心腹脹滿口乾苦咽痛嘔吐翻胃食不下骨蒸勞熱目黃胸脅痛不能轉側百證賦云兼陽綱可治目黃捷徑云兼膈俞治勞噎脾俞在十一椎下去脊中各二寸正坐取之刺三分留七呼灸三壯素問云刺中脾十日死主治痃癖積聚肋下滿痃瘧寒熱黃疸腹脹痛吐食不食飲食不化或食飲倍多煩熱嗜臥身日羸瘦泄痢善欠體重四肢不收此穴主瀉五臟之熱與五臟俞同千金云食不消化泄痢不作肌膚脹滿水腫灸隨年壯三報之又虛勞尿血白濁灸百壯百證賦云兼聽宮能祛心下之悲悽又兼膀胱俞治脾虛穀食不消捷徑云治思噎食噎一傳治水腫鼓脹氣滿泄瀉年久不止及久年積塊脹痛胃俞在十二椎下去脊中二寸正坐取之刺三分留七呼灸三壯一曰灸隨年壯主治胃寒吐逆翻胃霍亂腹脹支滿肌膚疲瘦腸鳴腹痛不嗜食脊痛筋攣小兒羸瘦食少不生肌肉及小兒痢下赤白秋末脫肛肚疼不可忍艾炷如大麥百證賦云兼魂門治胃冷食不化一傳治水腫鼓脹氣膈不食泄瀉年久不止多年積塊三焦俞在十三椎下去脊中二寸正坐取之刺五分灸三壯一曰三分五壯主治傷寒身熱頭痛吐逆肩背急腰脊強不得俯仰臟腑積聚脹滿膈塞不通飲食不化羸瘦水穀不分腹痛下痢腸鳴目眩千金云少腹堅大如盤盂胸腹脹滿飲食不消婦人癥聚瘦瘠灸三焦俞百壯三報之仍灸氣海百壯又云主五臟六腑積聚心腹滿腰脊痛吐逆寒熱小便不利灸隨年壯又治尿血灸百壯腎俞在十四椎下與臍平去脊中二寸正坐取之素問血氣形志篇有五臟俞度見經絡類十一刺三分留七呼灸三壯一曰灸以年為壯素問曰刺中腎六日死主治虛勞羸瘦面目黃黑耳聾腎虛水臟久冷腰痛夢遺精滑腳膝拘急身熱頭重振寒心腹䐜脹兩脅滿痛引少腹少氣溺血便濁淫濼赤白帶下月經不調陰中痛五勞七傷虛憊無力足寒如冰洞泄食不化身腫如水男女久積氣痛變成勞疾此穴主瀉五臟之熱與五臟俞同千金云腎間風虛灸百壯又小便濁夢遺失精灸百壯又云腎俞主五臟虛勞少腹弦急脹熱灸五十壯老少減之若虛冷可百壯橫三間寸灸之又消渴口乾同腰目灸之又尿血灸百壯又百病水腫灸百壯玉龍賦云兼命門治老人便多又兼心俞治腰腎虛乏之夢遺百證賦云兼巨髎穴能除胸膈停留瘀血通玄賦云能瀉盡腰股之痛一傳治色欲過度虛腫耳痛耳鳴大腸俞在十六椎下去脊中二寸伏而取之刺三分留六呼灸三壯主治脊強不得俯仰腰痛腹脹繞臍切痛腸癖瀉痢食不化大小便不利千金云脹滿雷鳴灸百壯三報之靈光賦云治大便病小腸俞在十八椎下去脊中二寸伏而取之刺三分留六呼灸三壯主治膀胱三焦津液少便赤不利淋瀝遺尿小腹脹滿㽱痛瀉痢膿血腳腫心煩短氣五痔疼痛婦人帶下千金云泄注五痢便膿血腹痛灸百壯又主三焦膀胱寒熱津液赤白洞泄腰脊痛小水不利婦人帶濁灸五十壯又消渴口乾不可忍者灸百壯橫三間寸灸之靈光賦云治小便病膀胱俞在十九椎下去脊中二寸伏而取之刺三分留六呼灸三壯一云七壯主治小便赤澀遺尿泄痢腰脊腹痛陰瘡腳膝寒冷無力女子癥瘕百證賦云兼脾俞治脾虛穀食不消中膂內俞一名脊內俞在二十椎下去脊中二寸夾脊胂起肉間伏而取之刺三分留六呼灸三壯主治腎虛消渴腰脊強痛不得俯仰腸冷赤白痢疝痛汗不出脅腹脹痛百證賦云兼陶道治歲熱時行捷徑云主腰痛夾脊膂上下按之從後項至此穴痛者灸之立愈白環俞在二十一椎下去脊中二寸伏而取之刺五分灸三壯甲乙經云刺八分得氣則瀉瀉訖多補之不可灸主治腰脊痛不得坐臥疝痛手足不仁二便不利溫瘧筋攣痹縮虛熱閉塞一云主治夢遺白濁腎虛腰痛先瀉後補赤帶瀉之白帶補之月經不調亦補之百證賦云兼委中治背連腰痛大驗上髎在腰髁骨下一寸夾脊兩旁第一空陷中繆刺論注曰腰下夾尻有空骨各四蓋即此四髎穴也刺腰痛篇注曰上髎當髁骨下陷中餘三髎少斜下按之陷中是也腰髁骨即十六椎下腰脊兩旁起骨之夾脊者足太陽少陽之絡刺三分留七呼灸七壯主治大小便不利嘔逆腰膝冷痛寒熱瘧鼻衄婦人絶嗣陰中癢痛陰挺出赤白帶下次髎夾脊旁第二空陷中刺三分留七呼灸七壯一曰三壯主治大小便淋赤不利心下堅脹腰痛足清疝氣下墜引陰痛不可忍腸鳴泄瀉赤白帶下中髎夾脊旁三空陷中刺二分留十呼灸三壯主治五勞七傷二便不利腹脹飧泄婦人少子帶下月經不調下髎夾脊旁四空陷中刺腰痛篇及繆刺論王注皆曰足厥陰支別者與太陰少陽結於腰髁下挾脊第三第四骨空中其穴即中髎下髎也刺二分留十呼灸三壯一曰刺二寸主治腸鳴泄瀉二便不利下血腰痛引小腹急痛女子淋濁不禁百證賦云濕熱濕寒下髎定會陽一名利機在陰尾尻骨兩旁甲乙經曰督脈氣所發刺二分灸五壯一曰刺八分主治腹中寒氣泄瀉腸澼便血久痔陽氣虛乏陰汗濕附分在二椎下附項內廉兩旁相去脊中各三寸半正坐取之手足太陽之會刺三分灸五壯甲乙經作刺八分主治肘臂不仁肩背拘急風客腠理頸痛不得回顧魄戶在三椎下去脊中各三寸半正坐取之刺五分灸五壯一曰刺三分灸百壯主治虛勞肺痿肩膊胸背連痛三尸走注項強喘逆煩滿嘔吐此穴主瀉五臟之熱與五臟俞同神農經云治虛勞發熱可灸十四壯百證賦云兼膏肓治勞瘵傳尸標幽賦云治體熱勞嗽膏肓俞在四椎下五椎上去脊中各三寸半正坐曲脊取之千金翼云先令病人正坐曲脊伸兩手以臂著膝前令正直手大指與膝頭齊以物支肘勿令臂動乃從胛骨上角摸索至胛骨下頭其間當有四肋三間依胛骨之際相去骨際如容側指許按其中一間空處自覺牽引肩中是其穴也左右各灸至百壯或三五百多至千壯當氣下嚨嚨然如流水之降若停痰宿疾亦必下也若病人已困不能正坐當令側臥挽上臂令前索孔穴灸之又法但以右手搭左肩上中指稍所不及處是其穴也左手亦然乃以前法灸之其有不能久坐伸臂者亦可伏衣襆上伸兩臂令人挽兩胛骨使相離遠不爾胛骨復穴不得其真也所伏衣襆當令大小得宜不爾則前卻亦失其穴也此穴灸後令人陽氣日盛當消息自為補養令得平復則諸病無所不治又法如其人骨節分明則以椎數為準若脊背肥厚骨節難尋須以大椎至尾骶量分三尺折取之不然則以平臍十四椎命門為則逐椎分寸取之則穴無不真然取大椎之法除項骨三節不在內或人亦有項骨短而無可尋者但當以平肩之處為第一椎以次求之可無差也捷徑云灸膏肓功效諸書例能言之而取穴則未也千金等方之外莊綽論之最詳然繁而無統不能歸定於一余嘗以意取之令病人兩手交在兩膊上灸時亦然胛骨遂開其穴立見以手指摸索第四椎下兩旁各三寸四肋三間之中按之痠疼是穴灸至千壯少亦七七壯當依千金立點立灸坐點坐灸臥點臥灸為的劉瑾云取膏肓二穴當除第一椎小骨不算若連第一椎數下當在五椎下兩旁各三寸半共折七寸分兩旁按其痠疼處乃是真穴每依此灸療多獲痊愈灸七七壯至百壯千壯一云灸後當灸足三里以引火實下此穴自晉以前所未有乃後人之所增也主治百病無所不療虛羸瘦損五勞七傷諸病夢遺失精上氣咳逆痰火發狂健忘胎前産後可灸二七至七七壯百證賦云兼魄戶治勞瘵傳尸靈光賦云治背脊痛風勞一切諸病乾坤生意云兼陶道身柱肺俞治虛損五勞七傷緊要之穴神堂在五椎下去脊中各三寸半陷中正坐取之刺三分灸五壯此穴主瀉五臟之熱與諸臟俞同主治腰脊強痛不可俯仰灑淅寒熱胸腹滿逆時噎譩嘻在肩膊內廉六椎下去脊中各三寸半正坐取之甲乙經曰以手痛按之病者呼噫嘻是穴蓋因其痛也刺六分留七呼灸五壯一曰二七壯至百壯主治大風熱病汗不出勞損不得臥溫瘧久不愈胸腹脹悶氣噎肩背脅肋痛急目痛咳逆鼻衄忌莧菜白酒千金云多汗瘧病灸五十壯膈關在七椎下去脊中各三寸半陷中正坐開肩取之刺五分灸五壯主治背痛惡寒脊強嘔吐飲食不下胸中噎悶大小便不利此亦血會治諸血病魂門在九椎下相去脊中各三寸半陷中正坐取之刺五分灸三壯主治尸厥走注胸背連心痛食不下腹中雷鳴大便不節小便黃赤此穴主瀉五臟之熱與五臟俞同百證賦云兼胃俞治胃冷食難化標幽賦云筋攣骨痛者補此陽綱在十椎下去脊中三寸半陷中正坐取之刺五分灸三壯七壯主治腸鳴腹痛食不下小便澀身熱消渴目黃腹脹泄痢百證賦云兼膽俞治目黃意舍在十一椎下去脊中三寸半陷中正坐取之刺五分灸七壯一云五十壯至百壯主治背痛腹脹大便泄小便黃嘔吐惡風寒飲食不下消渴目黃此穴主瀉五臟之熱與五臟俞同百證賦云兼中府能除脹滿噎塞胸背脅痛惡寒嘔吐胃倉在十二椎下去脊中各三寸半正坐取之刺五分灸五壯一云五十壯主治腹滿水腫食不下惡寒背脊痛不可俯仰肓門在十三椎下去脊中各三寸半叉肋間陷中前與鳩尾相直正坐取之刺五分灸三壯氣府論注云三十壯主治心下痛大便堅婦人乳痛有餘志室在十四椎下去脊中各三寸半陷中正坐取之刺五分灸三壯七壯主治陰腫陰痛失精小便淋瀝背脊強腰脅痛腹中堅滿霍亂吐逆不食大便難此穴主瀉五臟之熱與五臟俞同胞肓在十九椎下去脊中各三寸半陷中伏而取之刺五分灸五壯七壯主治腰脊痛惡寒小腹堅腸鳴大小便不利秩邊在二十一椎下去脊中各三寸半陷中伏而取之刺五分灸三壯主治腰痛五痔小便赤澀承扶一名肉郤一名陰關一名皮部在尻臀下股陰上約文中刺七分留七呼灸三壯甲乙經作刺二寸主治腰脊相引如解久痔臀腫大便難胞寒小便不利殷門在承扶下六寸膕上兩筋之間刺七分留七呼灸三壯主治腰脊不可俯仰惡血流注外股腫浮郤在委陽上一寸屈膝得之刺五分灸三壯主治霍亂轉筋小腹膀胱熱大腸結股外筋急髀樞不仁委陽在承扶下六寸屈伸取之邪氣臟腑病形篇曰三焦合入於委陽甲乙經曰委陽三焦下輔腧也在足太陽之前少陽之後出於膕中外廉兩筋間此足太陽別絡也刺七分留五呼灸三壯主治腰脊腋下腫痛不可俯仰引陰中不得小便胸滿身熱瘛瘲癲疾小腹滿飛尸遁注痿厥不仁本輸篇曰三焦下輸出於委陽並太陽之正入絡膀胱約下焦實則閉癃虛則遺溺遺溺則補之閉癃則瀉之百證賦云兼天池穴腋腫針而速散委中一名血郤在膕中央約文動脈陷中伏臥屈足取之足太陽所入為合刺五分留七呼灸三壯一云禁灸春月勿令出血蓋太陽合腎腎王於冬水衰於春故春無令出血主治大風眉發脫落太陽瘧從背起先寒後熱熇熇然汗出難已頭重轉筋腰脊背痛半身不遂遺溺小腹堅風痹髀樞痛膝痛足軟無力凡腎與膀胱實而腰痛者刺出血妙虛者不宜刺慎之此穴主瀉四肢之熱委中者血郤也凡熱病汗不出小便難衄血不止脊強反折瘛瘲癲疾足熱厥逆不得屈伸取其經血立愈太乙歌云虛汗盜汗補委中玉龍賦云合人中除腰脊痛閃之難制又云兼居髎環跳除腿風濕痛百證賦云兼白環俞治背連腰痛千金十一穴云委中崑崙治腰背痛相連四總穴云腰背委中求馬丹陽天星十二穴云腰痛不能舉沉引脊梁酸風癇及轉筋疼痛難移展風痹復無常熱病不能當膝頭難伸屈針入即安康合陽在膝膕約文下二寸刺六分灸五壯主治腰脊強引腹痛陰股熱胻酸腫寒疝偏墜女子崩帶不止百證賦云兼交信治女子少氣下血承筋一名腨腸一名直腸在腨腸中央陷中腳跟上七寸灸三壯禁刺主治寒痹腰背拘急腋腫大便閉五痔腨酸腳跟痛引少腹轉筋霍亂鼽衄千金云霍亂轉筋灸五十壯承山一名肉柱一名魚腹在兌腨腸下分肉間陷中一雲腿肚下尖分肉間刺七分灸五壯至七七壯然灸不及針主治頭熱鼻衄寒熱癲疾疝氣腹痛痔腫便血腰背痛膝腫脛酸眼痛霍亂轉筋戰栗不能行立凡有邪熱者可瀉之千金云灸轉筋隨年壯神驗霍亂灸百壯玉龍賦云兼長強灸痔最妙席弘賦云陰陵泉治心胸滿兼此穴而飲食自思又云兼魚際崑崙治轉筋目眩立消靈光賦云治轉筋並久痔百證賦云刺長強兼承山善主腸風新下血天星祕訣云兼內踝尖治轉筋並眼花又云兼陰交治胸膈痞滿自喜飲食馬丹陽云善治腰疼痛痔疾大便難腳氣並膝腫兩足盡寒酸展轉成時疫故栗瘧憎寒霍亂及轉筋刺之立便安今時多用此穴治傷寒立效亦有初發瘧疾者灸之立已飛揚一名厥陽在足外踝上七寸後陷中足太陽絡別走少陰刺三分灸三壯主治痔痛不得起坐腳痠腫不能立歷節風不得屈伸癲疾寒瘧頭目眩逆氣千金云瘧實則腰背痛虛則鼻衄飛陽主之百證賦云兼支正可治目眩跗陽在足外踝上三寸太陽前少陽後筋骨之間陽蹺之郤刺五分留七呼灸三壯一云七壯主治霍亂轉筋腰痛不能立髀樞股胻痛痿厥風痹不仁頭重䪼痛時有寒熱四肢不舉屈伸不能崑崙在足外踝後五分跟骨上陷中細動脈應手足太陽所行為經刺三分留七呼灸三壯主治腰尻腳氣足腨腫痛不能步立頭痛鼽衄肩背拘急咳喘目眩陰腫痛産難胞衣不下小兒發癇瘛瘲玉龍賦云兼申脈太溪善療足腫之迍靈光賦云能住喘愈腳氣神農經云治腰尻痛足痛不能履地肩背拘急可灸七壯又治小兒陰腫可灸三壯炷如小麥席弘賦云兼魚際承山治轉筋目眩立消千金云胞衣不出針足太陽入四分穴在外踝下後一寸宛宛中者意必此穴又云瘧多汗腰痛不能俯仰目如脫項似拔崑崙主之千金十一穴云兼委中治腰背痛相連捷徑云治偏風馬丹陽天星十二穴云轉筋腰尻痛膊重更連陰頭疼脊背急暴喘滿衝心舉步行不得動足即呻吟若欲求安樂須尋此穴針增治法云治目䀮䀮如脫頭熱鼻衄肚脹痛不得息霍亂大便泄風癇口噤不開小兒陰腫頭眩轉筋吐逆尸厥中惡膝蓋暴痛僕參一名安邪在跟骨下陷中拱足得之足太陽陽蹺之會刺三分留七呼灸七壯主治腰痛足痿不收足跟痛霍亂轉筋吐逆尸厥癲癇狂言見鬼膝痛靈光賦云後跟痛在僕參求申脈在足外踝下五分陷中容爪甲許白肉際陽蹺脈所生刺三分留七呼灸三壯主治風眩癲疾腰腳痛膝胻寒酸不能坐立如在舟車中氣逆腿足不能屈伸婦人氣血痛一云腳氣紅腫瀉之若麻木無力先瀉後補神農經曰治腰痛可灸五壯玉龍賦云兼太溪崑崙善療足腫之迍標幽賦云兼金門治頭風頭痛攔江賦云能除寒與熱偏正頭風及心驚耳鳴鼻衄胸中滿遇麻木者虛當補逢疼痛者瀉而迎靈光賦云陽蹺陰蹺及陽陵陰陵四穴治腳氣取之又兼三里同治腳氣亦去在腰諸疾千金方十三鬼穴云此名鬼路當在第五次下火針治百邪癲狂捷法云治腰背強不可俯仰肢節煩痛牽引腰腳中風不省人事中風不語中風半身癱瘓偏枯疼痛無時中風四肢麻木不仁手足瘙癢不能握物中風口眼喎斜牽連不已角弓反張眼目盲視口噤不開語言蹇澀腰脊肩背疼痛頭項強痛不得回顧腰痛起止艱難手足背生毒臂背生毒以上凡二十餘證先以申脈主治後隨證加各穴分治之金門一名關梁在足外踝下一寸足太陽郤陽維別屬也刺一分灸三壯一云刺三分灸七壯炷如小麥主治霍亂轉筋尸厥癲癇疝氣膝胻酸不能立小兒張口搖頭身反百證賦云兼丘墟可醫轉筋通玄賦云兼申脈治頭風頭痛京骨在足小指外側本節後大骨下赤白肉際陷中可按而得足太陽所過為原刺三分留七呼灸七壯主治腰脊痛如折髀不可曲項強不能回顧筋攣善驚痎瘧寒熱目眩內眥赤爛頭痛鼽衄癲病狂走束骨在足小指外側本節後陷中赤白肉際足太陽所注為腧刺三分留七呼灸三壯主治腸澼泄瀉瘧痔癲癇發背癰疔頭痛目眩內眥赤痛耳聾腰膝痛項強不可回顧太乙歌云兼三里刺治項強腫痛體重腰癱百證賦云連天柱治項強多惡風秦承祖云治風熱苔赤兩目眥爛通谷在足小指外側本節前陷中足太陽所溜為滎刺二分留五呼灸三壯主治頭痛目眩項痛鼽衄善驚目䀮䀮結積留飲食多不化失欠千金云諸結積留飲澼囊胸滿飲食不消灸通谷五十壯至陰在足小指外側去爪甲角如韭葉足太陽所出為井刺一分留五呼灸三壯五壯主治風寒頭重鼻塞目痛生翳胸脅痛轉筋寒瘧汗不出煩心足下熱小便不利失精脈痹從足小指起牽引上下百證賦云兼屋翳治遍身癢痛之疾席弘賦云專治腳膝腫今時習用此治婦人寒證張仲文治婦人橫産手先出諸符藥不效為灸右腳小指尖三壯炷如小麥下火立産足少陰腎經穴腎經穴歌足少陰俞二十七湧泉然谷照海出太溪水泉連大鐘復溜交信築賓立陰谷橫骨趨大赫氣穴四滿中注得肓俞商曲石關蹲陰都通谷幽門值步廊神封出靈墟神藏彧中俞府畢湧泉一名地衝在足心陷中屈足卷指宛宛中足少陰所出為井刺三分留三呼灸三壯主治尸厥面黑喘咳有血目視䀮䀮無所見善恐心中結熱風疹風癇心痛不嗜食男子如蠱女子如妊咳嗽氣短身熱喉痹目眩頸痛胸脅滿小腹痛腸澼泄瀉霍亂轉胞不得尿腰痛大便難轉筋足脛寒痛腎積奔豚熱厥五指盡痛足不踐地史記漢北齊王阿母患足下熱喘滿淳于意曰熱厥也刺足心立愈千金云陰中懊憹痛刺入三分又鼻衄不止灸二百壯又霍亂轉筋灸三七壯不止灸足踵聚筋上白肉際七壯立愈玉龍賦云兼關元豐隆治尸勞席弘賦云鳩尾能治五般癇若下湧泉人不死又云小腸氣結連臍痛速瀉陰交良久針湧泉取氣甚妙百證賦云專治厥寒厥熱又云兼行間治消渴腎竭通玄賦云治胸結身黃瀉此靈光賦云治婦人疾並男蠱女孕而病痓者千金勿妄傳天星祕訣云兼陰陵治小腸連臍痛然谷一名龍淵一名然骨在足內踝前起大骨下陷者中足少陰所溜為滎刺三分留三呼灸三壯一曰刺不宜見血主治喘呼煩滿咳血喉痹消渴舌縱心恐少氣涎出小腹脹痿厥寒疝足跗腫胻酸足一寒一熱不能久立男子遺精婦人陰挺出月經不調不孕初生小兒臍風撮口痿厥洞泄此穴主瀉腎臟之熱若治傷寒亦宜出血千金云石水灸然谷氣衝四滿章門百證賦云此穴易醒臍風照海在足內踝下一寸陷中容爪甲一云在內踝下四分微前高骨陷中前後有筋上有踝骨下有軟骨其穴居中神農經云在內踝直下白肉際是陰蹺所生刺四分留六呼灸三壯一曰刺三分灸七壯主治咽乾嘔吐四肢懈惰嗜臥善悲不樂大風偏枯半身不遂久瘧卒疝腹中氣痛小腹淋痛陰挺出月水不調玉龍賦云兼支溝能通大便之祕又云合內關能醫腹疾之塊神農經云治月事不行可灸七壯又云兼公孫治傷寒四日太陰經再用內關施截法攔江賦云治噤口喉風用三稜針出血即安百證賦云兼大敦治傷寒席弘賦云兼百會太衝陰交治咽喉疾又云兼陰交曲泉關元氣海同瀉治七疝如神靈光賦云二蹺二陵腳氣者取此四穴又兼三里同治腳氣並在腰之疾標幽賦云兼陽維內關能下胎衣又云治喉中之閉塞捷法云治小便頻數淋瀝不通小腹冷痛膀胱七疝奔豚偏墜木腎腫大如升發時疼痛衝心小便淋血陰痛遺精白濁夜夢鬼交不禁婦人難産子掬母心不下女子大便不通産後腹痛惡露不已婦人脾病血蠱水蠱氣蠱石蠱單蠱女人血氣虛倦五心煩熱支體盡痛頭目昏沉老人虛損手足轉筋不能舉動霍亂吐瀉寒濕腳氣發熱大痛腎虛腳氣紅腫乾腳氣膝頭內踝五指疼痛渾身脹滿水蠱喘脹四肢面目浮腫婦人瘦損赤白帶下子宮久冷不受胎孕經水正行頭眩小腹空痛月水不調臍腹疼痛及淋漏不斷等證以上諸證先以照海為主後隨證加穴分治太溪一名呂細在足內踝後五分跟骨上動脈陷中足少陰所注為腧即原也刺三分留七呼灸三壯主治熱病汗不出傷寒手足逆冷嗜臥咳嗽咽腫衄血唾血溺赤消疸大便難久瘧咳逆煩心不眠脈沉手足寒嘔吐不嗜食善噫腹疼瘠瘦寒疝痃癖神農經云治牙疼可灸七壯一云牙疼紅腫者瀉之陰股內濕癢生瘡便毒先補後瀉一云腎瘧嘔吐多寒閉戶而處其病難已太溪大鐘主之腰脊痛大便難手足寒並刺委中大鐘玉龍賦云合崑崙申脈善療足腫之迍百證賦云兼商陽治寒瘧有驗水泉在足內踝下太溪下一寸足少陰郤刺四分灸五壯主治目䀮䀮不能遠視女子月事不來來即多心下悶痛小腹痛小便淋陰挺出百證賦云兼天樞治月潮違限大鐘在足跟後沖中大骨上兩筋間水熱穴論注曰在足內踝後沖中足少陰絡別走太陽刺二分留三呼灸三壯主治氣逆煩悶實則小便淋閉灑灑腰脊強痛大便祕澀嗜臥口中熱虛則嘔逆多寒欲閉戶而處少氣不足胸脹喘息舌乾食噎不得下善驚恐不樂喉中鳴咳唾血百證賦云兼通里治倦言嗜臥標幽賦云治心性之呆癡復溜一名伏白一名昌陽在足內踝後上除踝二寸陷者中前旁骨是復溜後旁筋是交信二穴止隔一筋足少陰所行為經刺三分留三呼灸五壯七壯主治腸澼痔疾腰脊內引痛不得俯仰善怒多言舌乾涎出足痿胻寒不得履目視䀮䀮腸鳴腹痛四肢腫十種水病五淋盜汗齒齲脈微細神農經云治盜汗不收及面色痿黃可灸七壯千金云血淋灸五十壯太乙歌云刺治腰脊閃挫疼痛遊風遍體玉龍賦云傷寒無汗宜瀉又云起六脈之沉匿攔江賦云傷寒無汗先補合谷次瀉此穴席弘賦云此穴專治氣滯在腰靈光賦云治腫如神交信在足內踝上二寸少陰前太陰後筋骨間陰蹺之郤刺四分留五呼灸三壯主治五淋㿉疝陰急股腨內廉引痛瀉痢赤白大小便難女子漏血不止陰挺月事不調小腹痛盜汗百證賦云兼合陽治女子少氣漏血築賓在足內踝後上腨分中陰維之郤刺三分灸五壯主治小兒胎疝癲疾吐舌發狂罵詈腹痛嘔吐涎沫足腨痛陰谷在膝下內輔骨後大筋下小筋上按之應手屈膝乃得之足少陰所入為合刺四分留七呼灸三壯主治舌縱涎下腹脹煩滿溺難小腹疝急引陰陰股內廉痛為痿為痹膝痛不可屈伸女人漏下不止少妊太乙歌云兼水分三里利小便消腫脹通玄賦云治臍腹痛橫骨一名下極在大赫下一寸肓俞下五寸去中行五分陰上橫骨中按少腹下尖自橫骨上行不可概用腹中分寸當以太陰之衝門起自橫骨兩端以至陽明之氣衝少陰之橫骨至中行之曲骨穴通計折量始得其準凡上至腹中皆當以此類推衝脈足少陰之會刺五分灸三壯五壯甲乙經曰刺一寸主治五淋小便不通陰器下縱引痛小腹滿目眥赤痛五臟虛百證賦云兼肓俞瀉五淋久積席弘賦云兼大都治氣滯腰