血神農經云治胸中疼痛胸前瘡疥可灸三壯千金云吐血嘔逆灸五十壯又云凡卒患腰腫附骨癰疽節腫遊風熱毒此等疾但初覺有異即急灸之從手掌後第一橫文後兩筋間灸五壯立愈患左灸右患右灸左當中者兩手俱灸又十三鬼穴云此為鬼心治百邪癲狂在第四次下針玉龍賦云兼勞宮療心悶瘡痍又云合人中頻瀉全去口氣又云合外關支溝治肚疼祕結勞宮一名五里一名掌中在掌中央動脈屈無名指取之手厥陰所溜為滎刺二分灸三壯主治中風悲笑不休熱病汗不出脅痛不可轉側吐衄噫逆煩渴食不下胸脅支滿口中腥氣黃疸手痹大小便血熱痔千金云心中懊憹痛刺入五分補之玉龍賦云兼大陵療心悶瘡痍靈光賦云治勞倦百證賦云兼後溪可治三消黃疸通玄賦云能退胃翻心痛捷徑云治憂噎一傳癲狂灸此效中衝在手中指端去爪甲如韭葉陷中手厥陰所出為井刺一分留三呼灸一壯主治熱病汗不出頭痛如破身熱如火心痛煩滿舌強痛中風不省人事神農經云治小兒夜啼多哭灸一壯炷如小麥百證賦云兼廉泉堪攻舌下腫痛一云主神氣不足失志乾坤生意云此為十井穴凡初中風暴僕昏沉痰涎壅盛不省人事牙關緊閉藥水不入急以三稜針刺少商商陽中衝關衝少衝少澤使血氣流通乃起死回生急救之妙訣手少陽三焦經穴三焦經穴歌手少陽三焦所從二十三穴起關衝向液門中渚陽池歷外關支溝會宗三陽絡入於四瀆注天井清冷淵中消濼臑會肩髎同天髎天牖經翳風瘈脈顱息角孫入耳門和髎絲竹空關衝在手名指外側端去爪甲角如韭葉手少陽所出為井刺一分留三呼灸三壯主治頭痛口乾喉痹霍亂胸中氣噎不食肘臂痛不能舉目昏昏一云主三焦邪熱口渴唇焦口氣宜瀉此出血玉龍賦云壅熱盛於三焦關衝最宜百證賦云兼啞門治舌緩不語捷徑云治熱病煩心滿悶汗不出掌中大熱如火舌本痛口乾消渴久熱不去乾坤生意云此為十井穴凡初中風暴僕昏沉痰涎壅盛不省人事牙關緊閉藥水不下急以三稜針刺少商商陽中衝少衝關衝少澤使血氣流通乃起死回生急救之妙穴液門在手小指次指間陷者中手少陽所溜為滎刺二分留二呼灸三壯主治驚悸忘言寒厥臂痛不得上下痎瘧寒熱頭痛目眩赤澀泣出耳暴聾咽外腫牙齦痛若手臂紅腫痛楚瀉之出血為妙千金云治耳聾不得眠刺入三分補之玉龍賦云兼中渚治手臂紅腫百證賦云兼魚際能療喉痛中渚在手名指本節後間陷中把拳取之手少陽所注為腧刺二分留三呼灸三壯主治熱病汗不出臂指痛不得屈伸頭痛目眩生翳不明耳聾咽腫久瘧手臂紅腫瀉之出血灸五壯太乙歌云刺久患腰疼背痛玉龍賦云兼液門治手臂紅腫席弘賦云治久患傷寒肩背痛通玄賦云脊心後痛針此立愈靈光賦云五指不便取中渚陽池一名別陽在手表腕上陷者中自本節後骨直對腕中手少陽所過為原刺二分留六呼灸三壯銅人經曰不可灸主治消渴口乾煩悶寒熱瘧或因折傷手腕捉物不得臂不能舉千金云消渴口乾灸五十壯神農經云治手腕疼無力不能上舉至頭可灸七壯外關在腕後二寸兩筋間陷中手少陽絡別走心主刺三分留七呼灸三壯主治耳聾渾焞無聞肘臂五指痛不能握若脅肋痛者瀉之神農經云治肘臂不得屈伸五指盡疼不能握物可灸七壯玉龍賦云兼大陵支溝治肚痛祕結捷徑云治臂膊紅腫肢節疼痛足內踝骨紅腫痛手足指節痛不能屈伸五臟六腑結熱吐血妄行不已鼻衄不止吐血昏暈不省人事虛損氣逆陽乘於陰則血熱妄行陰乘於陽則血寒亦吐名心肺二經嘔血舌強難言及生白苔重舌腫脹熱極口內生瘡舌吐不收舌縮不能言唇吻破裂血出干痛頭生瘰癧結核繞頸連胸耳根頸項腫痛不消目生翳膜隱澀難開風沿爛弦迎風流淚目風腫痛胬肉攀睛暴赤腫痛以上諸證先以外關主治後隨證分穴治之支溝一名飛虎在腕後三寸兩骨間陷中手少陽所行為經刺二分留七呼灸七壯主治熱病汗不出肩臂酸重脅腋痛四肢不舉霍亂嘔吐口噤暴喑鬼擊卒心痛産後血暈不省人事凡三焦相火熾盛及大便不通脅肋疼痛者俱宜瀉之千金云治頸漏馬刀灸百壯玉龍賦云兼照海能通大便之祕又云合外關大陵治肚痛祕結會宗在腕後三寸空中一云空中一寸手少陽郤刺三分灸三壯一曰禁刺主治五癇耳聾肌膚痛三陽絡一名通間在臂上大交脈支溝上一寸灸五壯禁刺主治暴喑不能言耳聾齒齲嗜臥身不欲動四瀆在肘前五寸外廉陷中刺六分留七呼灸三壯一曰刺三分主治暴氣耳聾下齒齲痛天井在肘外大骨尖後肘上一寸兩筋間陷中屈肘得之甄權云在曲肘後一寸叉手按膝頭取之手少陽所入為合刺三分留七呼灸三壯甲乙經云刺一分主治咳嗽上氣胸痛不得語唾膿不嗜食寒熱悽悽不得臥驚悸悲傷瘛瘲癲疾五癇風痹頭頸肩背痛耳聾目鋭眥痛頰腫肘臂痛不得捉物及瀉一切瘰癧瘡腫癮疹神農經云治咳嗽上氣風痹肘疼可灸七壯清冷淵在肘上二寸伸肘舉臂取之刺三分灸三壯主治諸痹痛肩臂肘臑不能舉席弘賦云五般肘痛尋尺澤冷淵針後即收功消濼在肩下臂外間腋斜肘分下行刺五分灸五壯一曰刺一分灸三壯主治風痹頸項強急腫痛寒熱頭痛肩背急一傳海南治牙疼灸此穴臑會一名臑髎在臂前廉去肩端三寸宛宛中手陽明少陽二絡之會刺五分灸五壯主治肘臂氣腫痠痛無力不能舉項癭氣瘤寒熱瘰癧肩髎在肩端臑上陷中斜舉臂取之刺七分灸三壯主治臂重肩痛不能舉天髎在肩缺盆中上毖骨際陷者中毖音祕一曰直肩井後一寸手足少陽陽維三脈之會刺八分灸三壯主治肩臂痠痛缺盆痛汗不出胸中煩滿頸項急寒熱天牖在頸大筋外缺盆上天容後天柱前完骨下髮際中上夾耳後一寸刺一分留七呼不宜補亦不宜灸灸即令人面腫資生經云灸一壯甲乙經云灸三壯主治暴聾不聰氣目不明夜夢顛倒面無顏色頭風面腫項強一曰若治面腫眼合先取譩嘻後針天牖風池其病即瘥若不先針譩嘻其病難愈翳風在耳後尖角陷中按之引耳中手足少陽之會刺三分灸七壯主治耳聾口眼喎斜口噤不開脫頷腫頰牙車急痛暴喑不能言一云耳紅腫痛瀉之耳虛鳴補之補多瀉少百證賦云兼聽會治耳聾氣閉瘈脈一名資脈在耳本後雞足青絡脈中刺一分灸三壯銅人云刺出血如豆汁不宜多出一云禁灸主治頭風耳鳴小兒驚癇瘛瘲嘔吐瀉痢無時驚恐目澀眵膏顱息在耳後間青絡脈中刺一分灸七壯甲乙經曰灸三壯一曰禁刺出血多則殺人主治耳鳴喘息小兒嘔吐瘛瘲驚恐發癇身熱頭痛不得臥聤耳腫流膿汁百證賦云痓病非顱息不愈角孫在耳廓中間上髮際下開口有空手太陽手足少陽三脈之會甲乙經手太陽作手陽明寒熱病篇曰足太陽有入頄遍齒者名曰角孫則足太陽脈亦會於此刺三分灸三壯主治目生翳齒齦腫不能嚼唇吻燥頸項強一云堪治耳齒之病耳門在耳前起肉當耳缺處陷中刺三分留三呼灸三壯一云禁灸主治耳聾聤耳膿汁耳生瘡齒齲唇吻強席弘賦云但患傷寒兩耳聾耳門聽會疾如風百證賦云兼絲竹空能住牙疼於頃刻天星祕訣云耳鳴腰痛先五會後此穴及三里和髎耳前兌發下橫動脈手足少陽手太陽三脈之會刺三分灸三壯一曰灸之目盲主治頭痛耳鳴牙車引急頸項腫口僻瘛瘲絲竹空一名目髎在眉後陷中甲乙經曰足少陽脈氣所發刺三分留三呼禁灸灸之不幸令人目小及盲主治頭痛目赤目眩視物䀮䀮拳毛倒睫風癇戴眼發狂吐涎沫偏正頭風神農經云治頭風宜出血百證賦云兼耳門能治牙疼於頃刻通玄賦云治偏頭痛難忍一傳主眼赤痛針一分出血
