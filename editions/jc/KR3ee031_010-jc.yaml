body:
  text: 卷十經絡八奇俞類集頭面部前神聰去前頂五分自神庭至此穴共四寸主治中風風癇灸三壯後神聰去百會一寸主治中風風癇灸三壯髮際平眉上三寸是穴主治頭風眩暈疼痛延久不愈灸三壯印堂在兩眉中間神農針經云治小兒急慢驚風可灸三壯艾炷如小麥玉龍賦云善治驚搐海泉在舌下中央脈上主治消渴針出血左金津右玉液在舌下兩旁紫脈上主治消渴口瘡舌腫喉痹三稜針出血陽維在耳後引耳令前弦筋上是穴千金云耳風聾雷鳴灸陽維五十壯鼻交頞中千金翼云主癲風角弓反張羊鳴大風青風面風如蟲行卒風多睡健忘心中憒憒口噤卒倒不識人黃疸急黃此一穴皆主之針入六分得氣即瀉留三呼五吸不補亦宜灸然不及針慎酒面生冷醋滑豬魚蒜蕎麥漿水機關在耳下八分近前千金翼云凡卒中風口噤不開灸機關二穴五壯即愈一云隨年為壯僻者逐左右灸之唇里穴千金翼云唇里正當承漿邊逼齒齦針三鋥主治馬黃黃疸夾承漿穴千金翼云夾承漿兩邊各一寸治馬黃急疫燕口在口吻兩邊燕口處赤白肉際千金翼云主治狂風罵詈撾斫人名為熱陽風灸燕口各一壯又云狂邪鬼語灸十五壯又云小兒大小便不通灸口兩吻各一壯顳顬千金翼云顳顬在眉眼尾中間上下有來去絡脈是針灸之所主治疸氣溫病耳上穴千金翼云治癭氣灸風池及耳上髮際各百壯千金作兩耳後髮際當陽當瞳子直入髮際內一寸去臨泣五分是穴主治風眩鼻塞灸三壯魚尾在目眥外頭玉龍賦云兼睛明太陽治目證胸背腹脅部龍頷在鳩尾上一寸半千金翼云主心痛冷氣上灸百壯勿針乳上穴千金翼云治乳癰妒乳以繩橫度口以度從乳上行灸度頭二七壯通谷在乳下二寸千金云心痛惡氣上脅痛急灸五十壯魂舍在夾臍兩邊相去一寸千金云主小腸泄痢膿血灸百壯小兒減之肋頭千金翼云治瘕癖患左灸左患右灸右第一屈肋頭近第二肋下即是灸處第二肋頭近第三肋下向肉翅前亦是灸處初日灸三壯次日五壯後七壯周而復始至十止惟忌大蒜余不忌肋罅千金翼云治飛屍諸注以繩量病人兩乳間中屈之乃從乳頭向外量使當肋罅於繩頭盡處是穴灸隨年壯千金云三壯或七壯男左女右又云凡中屍者飛屍遁屍風屍屍注也其狀皆腹脹痛急不得息氣上衝心胸兩脅或踝踴起或攣引腰脊灸乳後三寸男左女右可二七壯如不止多其壯數愈長谷在夾臍相去五寸一名循際千金云主治下痢不嗜食食不消灸五十壯三報之腸遺挾中極旁相去二寸半千金云治大便難灸隨年壯肓募千金云肓募二穴以乳頭斜度至臍中乃屈去其半從乳下量至盡處是穴主治結氣囊里針藥所不及者灸隨年壯脅堂在腋下骨間陷中舉腋取之主治胸脅氣滿噦噫喘逆目黃遠視䀮䀮可灸五壯後腋下穴千金云治頸漏灸背後兩邊腋下後文頭隨年壯腋下穴千金翼云噦噫膈中氣閉塞灸腋下聚毛下附肋宛宛中五十壯神良胞門子戶氣門千金翼云子臟閉塞不受精妊娠不成若墮胎腹痛漏胞見赤灸胞門五十壯關元左邊二寸是也右邊名子戶若胞衣不出及子死腹中或腹中積聚皆針入胞門一寸又云胎孕不成灸氣門穴在關元旁三寸各五十壯又漏胎下血不禁灸百壯脊背五穴千金翼云治大人癲疾小兒驚癇灸背第二椎上及下窮骨尖二處乃以繩度量上下中折復量至脊骨上點記之共三處畢復斷此繩取其半者為三折而參合如字以上角對中央一穴其下二角正夾脊兩邊同灸之凡五處也各百壯濁浴千金翼云挾膽俞旁行相去五寸名濁浴主胸中膽病恐畏多驚少力口若無味灸隨年壯巨闕俞千金翼云第四椎名巨闕俞主胸膈中氣灸隨年壯督俞在第六椎下兩旁相去各二寸禁針可灸一名高蓋氣海俞在第十五椎下兩旁相去各二寸刺三分留六呼可灸關元俞在第十七椎下兩旁相去各二寸刺三分留六呼可灸主治瀉痢虛脹小便難婦人瘕聚諸疾腰眼其法令病人平眠以筆於兩腰眼宛宛中點二穴各灸七壯此穴諸書所無而居家必用載之云其累試累驗主治諸勞瘵已深之難治者於癸亥日二更盡入三更時令病人平眠取穴灸三壯一傳治傳屍癆瘵以致滅門絕戶者有之此證因寒熱煎作血凝氣滯有化而為蟲者內食臟腑每致傳人百方難治惟灸可攻其法於癸亥日二更後將交夜半乃六神皆聚之時勿使人知令病者解去下衣舉手向上略轉後些則腰間兩旁自有微陷可見是名鬼眼穴即俗人所謂腰眼也正身直立用墨點記然後上床合面而臥用小艾炷灸七壯或九壯十一壯尤好其蟲必於吐瀉中而出燒燬遠棄之可免傳染此比四花等穴尤易且效千金翼云治腰痛灸腰目窌在尻上約左右又云在腎俞下三寸夾脊兩旁各一寸半以指按陷中主治消渴此二說者似皆指此穴夾脊穴肘後云此華佗法千金翼云治霍亂轉筋令病者合面臥伸兩手著身以繩橫牽兩肘尖當脊間繩下兩旁相去各一寸半所灸百壯無不瘥者下極俞千金翼云第十五椎名下極俞主腹中疾腰痛膀胱寒飲澼注下灸隨年壯十七椎穴千金翼云轉胞腰痛灸十七椎五十壯回氣在脊窮骨上赤白肉下主五痔便血失屎灸百壯千金翼曰若灸窮骨惟多為佳身交在少腹下橫文中千金翼曰白崩中灸少腹橫文當臍孔直下一百壯及治胞落㿗須三報之又治大小便不通又治尿床者可灸七壯陰部橫骨千金翼曰婦人遺尿不知時出灸橫骨當陰門七壯又治㿗疝在橫骨兩旁夾莖灸之泉陰在橫骨旁三寸千金翼云治㿗卵偏大灸泉陰百壯三報之陰囊下橫文千金翼云治風氣眼反口噤腹中切痛灸陰囊下第一橫理十四壯陰莖千金翼云治卒癲病灸陰莖上宛宛中三壯得小便通即瘥當尿孔上是穴又灸陰莖頭三壯羊矢在會陰旁三寸股內橫文中按皮肉間有核如羊矢可刺三分灸七壯四肢部大骨空在手大指第二節前尖上屈指當骨節中灸二七壯禁針主治內瘴久痛及吐瀉拳尖在中指本節前骨尖上握拳取之主治風眼翳膜疼痛患左灸右患右灸左炷如小麥五虎在手食指無名指背間本節前骨尖上各一穴握拳取之主治手指拘攣中魁在手中指第二節前骨尖上屈指得之捷法又云在手腕中上側兩筋間陷中灸二七壯蓋此以陽谿言也觀者辨之主治五隔反胃手中指第一節穴千金云牙齒疼灸兩手中指背第一節前有陷處七壯下火立愈中泉在手腕外間陽池陽谿中間陷中灸七壯主治胸中氣滿不得臥肺脹滿膨膨然目中白翳掌中熱胃氣上逆唾血及心腹中諸氣痛手掌後白肉際穴主治霍亂轉筋在兩臂及胸中灸手掌後白肉際七壯手掌後臂間穴千金云治疔腫灸掌後橫文後五指許男左女右七壯即驗已用得效又云治風牙疼以繩量自手中指頭至掌後第一橫文折為四分乃復自橫文比量向後於臂中盡處兩筋間是穴灸三壯隨左右灸之兩患者灸兩臂至驗虎口小兒唇緊灸虎口男左女右七壯又兼灸承漿三壯又治煩熱頭疼刺虎口三分又治心痛灸兩虎口白肉際七壯手足髓孔千金翼云手髓孔在腕後尖骨頭宛宛中此當是下踝前也腳髓孔在足外踝後一寸俱主痿退風半身不遂可灸百壯兩手研子骨千金翼云豌豆瘡灸兩手腕研子骨尖上三壯男左女右河口千金翼云狂走驚癇灸河口五十壯在手腕後陷中動脈此與陽明同也按此當是手陽明陽谿之次肘尖千金翼云治腸癰屈兩肘尖頭骨各灸百壯則下膿血者愈又云正灸肘頭銳骨膝眼在膝頭骨下兩旁陷中刺五分禁灸主治膝冷痛不已昔有人膝痛灸此遂致不起以禁灸也玉龍賦云兼髖骨治腳腿重痛髖骨在膝蓋上梁丘旁外開一寸主治兩腳膝紅腫痛寒濕走注白虎歷節風痛腿丫風痛舉動不得風市在膝上七寸外側兩筋間又取法令正身平立直垂兩手著腿當中指頭盡處陷中是穴針五分灸三五壯千金云病輕者不可減百壯重者灸五六百壯主治腰腿痠痛足脛麻頑腳氣起坐艱難先瀉後補風痛先補後瀉此風痹冷痛之要穴玉龍賦云兼陰市能驅腿腳之乏力神農經云治偏風半身不遂兩腳疼痛灸二十一壯交儀穴千金云婦人漏下赤白月水不利灸交儀穴在內踝上五寸營池四穴千金云婦人下血漏赤白灸營池四穴三十壯在內踝前後兩邊池上脈一名陰陽漏陰穴千金云婦人漏下赤白四肢酸削灸漏陰三十壯穴在內踝下五分微動脈上足太陰太陽穴千金云婦人逆產足先出刺足太陰入三分足入乃出針穴在內踝後白肉際骨陷宛宛中又胞衣不出刺足太陽入四分在外踝後一寸宛宛中按此或即崑崙穴足踝千金云小兒重舌灸左足踝上七壯又云灸兩足外踝上三壯又治齒疼灸外踝上高骨前交脈上七壯又治轉筋十指拘攣灸足外踝骨上七壯又治反胃吐食灸內踝下稍斜向前有穴三壯外臺秘要云向前一指又治諸惡漏中冷瘜肉出灸足內踝上各三壯二年六壯外踝尖在外踝尖上三寸主治外轉筋可灸七壯或刺出血踝尖在足內踝尖上主治下牙痛內廉轉筋腳氣寒熱灸七壯或針出血內崑崙在足內踝後陷中主治轉筋刺入六分氣至瀉之承命在內踝後上行三寸動脈中主治狂邪驚癇灸三十壯一曰七壯足踵主治霍亂轉筋灸湧泉三七壯如不止灸足踵聚筋上白肉際七壯立愈陰陽穴在足拇指下屈里表頭白肉際主治婦人下漏赤白注泄灸隨年壯三報之足大指橫文穴三毛中千金翼云治卒中惡悶熱毒欲死灸足大指橫文隨年為壯又治陰腫欲潰困憊灸大拇指本節橫文中五壯一曰隨年壯又治㿗卵疝氣灸足大指本節間三壯又治㿗疝灸足大指內側去端一寸白肉際隨年壯甚驗若雙㿗灸兩處又治㿗疝卵腫如瓜入腹欲死灸足大指下橫文中隨年壯即腫邊灸之神驗又治老少大便失禁灸兩腳大指去甲一寸所三壯又治卒癲病灸聚毛中七壯又治鼻衄時癢灸足大指節橫理三毛中十壯劇者百壯並主陰腫又治久魘不醒者灸兩足大指聚毛中二十一壯獨陰在足趾下橫文中按捷法云即至陰穴當是足小指也主治乾嘔吐小腸疝氣死胎胎衣不下足第二指上穴主治水病灸足第二指上一寸隨年壯手足小指穴主治食注灸手小指尖頭男左女右隨年壯又治消渴證初灸兩手足小指頭及項椎隨年壯又灸膀胱俞橫三間寸灸之亦隨年壯五日一報之又治㿗疝灸手小指端七壯左灸右右灸左手足大指爪甲穴千金翼云治卒中邪魅鼻下人中及手足大指爪甲令艾炷半在爪上半在肉上灸七壯不止十四壯炷如雀矢又十三鬼穴於第二次下針刺手大指爪甲下入肉三分穴名鬼信又第三次下針刺其足大指爪甲下入內二分穴名鬼壘又治小便數而少且難男輒失精此方甚驗令其人合掌並兩大指灸甲角肉際兩指共此一壯亦灸足大指與手同各三壯三日一報之又治㿗病陰腫令並足合兩拇指爪甲以一艾炷灸兩爪端方角上七壯又秦承祖灸鬼法名鬼哭穴以兩手大指相併縛定用艾炷騎縫灸之令兩甲後連肉四處著火一處無火則不效灸七壯或二七壯一曰前秦承祖所用者是名手鬼眼又二穴在兩足大拇指間亦與取手穴同法是名足鬼眼用治癲癇夢魘鬼擊灸之大效亦治五癇呆癡及傷寒發狂等證鬼穴部鬼城十指端千金云邪病大喚罵詈狂走十指端去爪甲一分主之一名鬼城又治指忽掣痛不可忍灸指端七壯鬼床千金云第七次下針在耳垂下五分用火針三下名鬼床治百邪癲狂鬼藏千金云第十一次下針陰下縫女人玉門頭灸三壯名鬼藏鬼封千金云第十三次下針在舌頭當舌中下縫刺貫出舌上仍以一板橫口吻安針頭勿令舌動名鬼封千金方十三鬼穴須知百邪所為癲狂病針有十三穴須認凡針之用先鬼宮次針鬼信無不應一一從頭逐一求男從左起女從右一針人中鬼宮停左邊下針右出針第二手大指甲下穴名鬼信刺三分三針足大指甲下名曰鬼壘二分深四針掌上大陵穴八寸五分為鬼心五針申脈名鬼路火針三下七鋥鋥第六卻尋大椎上入發一寸名鬼枕七刺耳垂下五分名曰鬼床針要溫八針承漿名鬼市從左出右君須記九針間使鬼路上十針上星名鬼堂十一陰下縫三壯女玉門頭為鬼藏十二曲池名鬼臣火針仍要七鋥鋥十三舌頭當舌中此穴是名為鬼封手足兩邊相對刺若逢孤穴只單通此是先師真妙訣猖狂惡鬼走無蹤扁鵲曰百邪所病者針有十三穴凡刺之法先從鬼宮起次針鬼信便至鬼壘又至鬼心不必盡針止五六穴即可知矣男從左起針女從右起針若數處不言便當遍刺依訣而行之崔氏四花六穴凡男婦五勞七傷氣血虛損骨蒸潮熱咳嗽痰喘五心煩熱四肢困倦羸弱等證並皆治之第一次先取二穴令患人平身正立取一細繩約長三四尺者蠟之勿令伸縮乃以繩頭與男左女右足大拇指端比齊令其順腳心至後跟踏定卻引繩向後從足跟足肚貼肉直上比至膝灣曲膕中大橫文截斷次令病者平身正坐解發分頂中露頭縫取所比蠟繩一頭齊鼻端按定引繩向上循頭縫項背貼肉垂下至繩頭盡處以墨記之此非灸穴別又取一小繩令患者合口將繩雙摺自鼻柱根按定左右分開比至兩口角加人字樣截斷卻將此繩展直取中橫加於前記脊背中墨點之上其兩邊繩頭盡處以墨記之此第一次應灸二穴名曰患門上法若婦人足小者難以為則當取右臂自肩髃穴起以墨點記伸手引繩向下比至中指端截斷以代量足之法庶乎得宜第二次取二穴令患人平身正坐稍縮臂膊取一蠟繩繞項後向前雙垂頭與鳩尾尖齊雙頭一齊截斷卻翻繩頭向後將此繩中折處正按結喉上其繩頭下垂脊間處以墨記之此非灸穴又取一小繩令患人合口橫量齊兩吻截斷還加於脊上墨點處橫量如前法於兩頭盡處點記之此是第二次應灸兩穴即四花之左右二穴也前共四穴同時灸之初灸七壯或二七三七壯以至百壯為妙俟灸瘡將瘥或火瘡發時又依後法灸二穴後次取二穴以第二次量口吻短繩於第二次脊間墨點處對中直放務令上下相停於繩頭盡處以墨記之此是灸穴即四花之上下二穴也上共六穴宜擇離日火日灸之灸後百日內宜慎房勞思慮飲食應時寒暑得中將養調護若瘡愈後仍覺未瘥依前再灸無不愈者故云累灸至百壯但脊骨上兩穴不宜多灸凡一次只可三五壯多則恐人倦怠若灸此六穴亦宜灸足三里瀉火方妙愚按前法灸脊旁四穴上二穴近五椎心俞也下二穴近九椎肝俞也崔知悌不指穴名而但立取法蓋欲人之易曉耳然稽之脊背穴法則太陽二行者當去脊中各開二寸方得正脈乃可獲效用者仍宜審之騎竹馬灸法主治一切癰疽惡瘡發背婦人乳癰皆可治之量法用薄篾一條以男左女右手臂腕中自尺澤穴橫文起比至中指端齊肉盡處截斷為則卻用竹槓一條令病者脫去上衣正身騎定使兩人前後槓起令病人腳不著地仍令二人扶之勿使傴僂搖動卻將前所量篾從竹槓坐處尾骶骨下著槓比起貼脊直上至篾盡處點記之此是取中非灸穴也更用薄篾量手中指用同身寸法取定二寸平放於脊中墨點上各開一寸是穴一本作各開二寸灸五七壯一曰疽發於左則灸右疽發於右則灸左甚則左右皆灸蓋此二穴乃心脈所過之處凡癰疽皆心火留滯之毒灸此則心火流通而毒散矣起死回生之功屢試屢驗
