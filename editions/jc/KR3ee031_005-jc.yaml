body:
  text: 卷五經絡三諸部經絡發明頭面部喉口唇舌部頸肩部胸腹部背部脅肋部四肢部皮毛肌肉部筋骨血脈部臟腑部前後陰部頭面部巔足太陽交巔足厥陰與督脈會於巔俱經絡二手少陽別於巔經絡三足少陽之筋交巔上經絡四督脈上額交巔入絡腦經絡二十七腦髓足太陽直者入絡腦經絡二足陽明循眼系入絡腦經絡十三諸髓者皆屬於腦經絡二十一腦為髓之海經絡三十二腦者陰也髓者骨之充也疾病八十髓者以腦為主疾病三十六肌肉之精為約束裹擷筋骨血氣之精而與脈併為系上屬於腦疾病八十一額顱足陽明循髮際至額顱足太陽上額足厥陰上出額俱經絡二足少陽之筋直者上額角手少陽之筋結於角俱經絡四手足少陰太陰足陽明此五絡皆上絡左角針刺三十頭足少陽上抵頭角經絡二足太陽之筋直者上頭手陽明之筋直者上左角絡頭俱經絡四督脈之別散頭上經絡五頭者精明之府疾病類九十一面任脈循面經絡二十七足少陽之別散於面手少陰出於面俱經絡三諸陽之會皆在於面疾病三十二經脈三百六十五絡其血氣皆上於面而走空竅藏象二十心者生之本其華在面藏象類二目附命門目者肝之官也脈色三十一東方色青入通於肝開竅於目藏象四東方生風在竅為目藏象五敷和之紀其主目運氣十三任脈入目督脈與太陽起於目內眥其少腹直上者上系兩目之下俱經絡二十七蹺脈屬目內眥氣不營則目不合經絡二十八足太陽有通項入於腦者正屬目本名曰眼系陰蹺陽蹺陰陽相交陽入陰陰出陽交於目銳眥陽氣盛則瞋目陰氣盛則瞑目俱針刺四十四足太陽起目內眥經絡二足太陽之筋支者為目上網足陽明之筋上合於太陽為目下網足少陽之筋支者結於目眥為外維俱經絡四足陽明還系目系經絡三足少陽起目銳眥至銳眥後手太陽至目銳眥支者至目內眥手少陽至目銳眥手少陰系目系足厥陰連目系俱經絡二手少陰合目內眥經絡三手陽明之別者合於宗脈經脈五足少陽別者系目系合少陽於外眥經絡三肝氣通於目肝和則目能辨五色矣經絡二十二平旦陰盡陽氣出於目目張則氣上行於頭夜則氣行於陰而復合於目經絡二十五其精陽氣上走於目而為睛藏象二十心者五臟之專精也目者其竅也疾病八十目者宗脈之所聚也上液之道也疾病七十九諸脈者皆屬於目經絡二十一五臟六腑目為候五臟六腑之津液盡上滲於目俱疾病五十八五臟六腑之精氣皆上注於目而為之精精之窠為眼骨之精為瞳子筋之精為黑眼血之精為絡其窠氣之精為白眼肌肉之精為約束目者五臟六腑之精也營衛魂魄之所常營也神氣之所生也目者心使也俱疾病八十一命門太陽結於命門命門者目也經絡十二三十鼻附天牝鼻者肺之官也脈色三十一西方白色入通於肺開竅於鼻藏象四肺主鼻在竅為鼻藏象五審平之紀其主鼻運氣十三手陽明上挾鼻孔足陽明起於鼻之交頞中下循鼻外手太陽支者抵鼻俱經絡二足陽明之筋下結於鼻足太陽之筋結於鼻俱經絡四其宗氣上出於鼻而為臭藏象二十肺氣通於鼻肺和則鼻能知香臭矣經絡二十二天牝天牝從來復得其往論治二十耳耳者腎之官也脈色三十一南方赤色入通於心開竅於耳藏象四腎主耳在竅為耳藏象五足太陽支者至耳上角足陽明循頰車上耳前足少陽下耳後支入耳中出耳前手太陽入耳中手少陽系耳後出耳上角支入耳中出耳前俱經絡二手陽明之別者入耳合於宗脈經絡五足少陽之筋出太陽之筋循耳後足陽明之筋其支者結於耳前手太陽之筋結於耳後完骨支者入耳中直者出耳上俱經絡四手厥陰出耳後合少陽完骨之下經絡三十二經脈三百六十五絡其彆氣走於耳而為聽藏象二十手足少陰太陰足陽明五絡皆會於耳中上絡左角針刺三十足少陽之標在窗籠者耳也經絡十二耳者宗脈之所聚也疾病七十九腎氣通於耳腎和則能聞五音矣經絡二十二枕骨足太陽之筋直者結於枕骨足少陰之筋結於枕骨與足太陽之筋合俱經絡四完骨足太陽之筋上結於完骨手太陽之筋結於耳後完骨俱經絡四手厥陰出耳後合少陽完骨之下經絡三顴手太陽斜絡於顴經絡二頄足太陽之筋支者下結於頄足陽明之筋合於頄手陽明之筋支者結於頄足少陽之筋結於頄俱經絡四蹺脈入頄經絡二十八䪼手太陽支者上䪼手少陽至䪼足少陽抵於䪼俱經絡二足陽明上頞䪼經絡三頰手陽明支者貫頰手太陽支者循頸上頰手少陽下頰足少陽下加頰車足厥陰支者下頰裡足陽明循頰車俱經絡二足少陽在耳下曲頰之後經絡十手少陽之筋其支者當曲頰經絡四頤任脈上頤督脈上頤俱經絡二十七足陽明循頤後下廉經絡二足少陽之別出頤頷中經絡三頷足少陽之筋下走頷手太陽之筋結於頷手少陽之筋上乘頷手陽明之筋直者下右頷俱經絡四顏足太陽之筋下顏經絡四人中手陽明交人中經絡二承漿足陽明下交承漿經絡二喉口唇舌部咽喉任脈至咽喉督脈入喉俱經絡二十七衝脈任脈會於咽喉藏象十七足陽明循喉嚨手太陽循咽足少陽循喉嚨足厥陰循喉嚨之後上入頏顙手少陰支者上挾咽俱經絡二足少陽之別上挾咽足陽明上循咽足太陰合於陽明上行結於咽手少陰之正上走喉嚨手厥陰出循喉嚨手陽明上循喉嚨手太陽循喉嚨俱經絡三足陽明挾咽之動脈經絡十上焦並咽以上經絡二十三嗌足太陰脈絡嗌疾病十三會厭厭小而疾薄則發氣疾其開闔利厭大而厚則開闔難其氣出遲足之少陰絡於橫骨終於會厭俱針刺四十五口中央黃色入通於脾開竅於口藏象四脾主口在竅為口藏象五備化之紀其主口運氣十三手陽明挾口足陽明上挾口俱經絡二足陽明出於口經絡三脾氣通於口脾和則口能知五穀矣經絡二十二衝任之脈絡唇口藏象十七唇脾之合肉也其榮唇也藏象八脾胃大小腸三焦膀胱者倉廩之本其華在唇四白藏象二督脈環唇經絡二十七足陽明環唇足厥陰環唇內俱經絡二口唇者脾之官也脈色三十一唇舌者肌肉之本也疾病九十五舌舌者心之官也脈色三十一中央黃色入通於脾開竅於口故病在舌本藏象四足少陰之脈貫腎系舌本疾病六十二心主舌在竅為舌藏象五升明之紀其主舌運氣十三足太陰連舌本散舌下足少陰挾舌本俱經絡二足太陰貫舌中足少陰直者系舌本俱經絡三足少陰舌下經絡九足少陰之標在背腧與舌下兩脈經絡十二足之少陰上繫於舌針刺四十五手少陰之別系舌本經絡五手少陽之筋支者入系舌本足太陽之筋支者別入結於舌本俱經絡四上焦上至舌經絡二十三厥陰者肝脈也肝者筋之合也筋者聚於陰器而脈絡於舌本疾病九十五其濁氣出於胃走唇舌而為味藏象二十心氣通於舌心和則舌能知五味矣經絡二十二齒牙手陽明入下齒中足陽明下循鼻外入上齒中俱經絡二手陽明之別遍齒經絡五手少陽之筋支者上曲牙經絡四足陽明循牙車經絡十三足太陽有入頄遍齒者名曰角孫上齒齲取之針刺四十四齒者骨之所終也氣味三頸肩部項頸督脈之別上項經絡五督脈還出別下項經絡二十七足太陽下項足少陽循頸手太陽循頸手少陽上項足厥陰循喉嚨之後上入頏顙俱經絡二足太陽從膂上出於項足少陰系舌本復出於項俱經絡三足陽明之別上頭項經絡五頸中央之脈督脈也經絡十足少陰之筋挾膂上至項手太陽之筋其支者循頸出走太陽之前手陽明筋直者從肩髃上頸俱經絡四衝脈上者出於頏顙針刺二十肌肉之精為約束裹擷筋骨血氣之精而與脈併為系後出於項中疾病八十一肩足太陽循肩髆內下貫胛足少陽至肩上手太陽繞肩胛交肩上手陽明上肩出髃骨之前廉手少陽循臑外上肩俱經絡二手太陽之別絡肩髃手陽明之別上乘肩髃俱經絡五足太陽之筋支者結於肩髃手陽明之筋結於髃其支者繞肩胛手太陰之筋結肩前髃俱經絡四督脈之別當肩胛左右走太陽經絡五督脈循肩髆經絡二十七缺盆足陽明入缺盆足少陽入缺盆手太陽入缺盆手陽明出入缺盆手少陽出入缺盆俱經絡二足太陽之筋上出缺盆足陽明之筋至缺盆而結足少陽之筋結於缺盆俱經絡四手太陰上出缺盆經絡三五臟六腑心為之主缺盆為之道藏象二十九胸腹部胸足少陽下胸中足少陰注胸中手厥陰起胸中俱經絡二手少陽之別注胸中脾之大絡布胸俱經絡五手心主之正別下淵腋三寸入胸中經絡三足太陰之筋散於胸中手太陰之筋下結胸裡手少陰之筋結下胸中手厥陰之筋入腋散胸中俱經絡四衝脈挾臍上行至胸中而散經絡二十七蹺脈上循胸裡經絡二十八膻中手少陽布膻中經絡二足厥陰絡於膻中經絡三十膻中者心主之宮城也疾病五十六膈手太陽下膈手少陽下膈手厥陰下膈足少陽貫膈足太陰上膈足厥陰上貫膈足陽明下膈足少陰從腎上貫肝膈俱經絡二乳足陽明下乳內廉經絡二手陽明之正從手循膺乳經絡三足少陽之筋繫於膺乳手少陰之筋交太陰挾乳里俱經絡四胃之大絡名曰虛里出左乳下脈色十一鳩尾任脈之別下鳩尾經絡五腹足陽明之正入於腹裡經絡三足陽明之筋上腹而布經絡四足太陰上入腹足厥陰抵小腹俱經絡二任脈之別散於腹經絡五任脈者循腹裡經絡二十七小腹臍下三結交者陽明太陰也針刺五十三臍足陽明下挾臍經絡二足太陰之筋結於臍手少陰之筋下繫於臍俱經絡四衝脈者起於氣街並足少陰之經挾臍上行至胸中而散督脈少腹直上者貫臍中央俱經絡二十七背部背脊西方白色入通於肺故病在背藏象四足太陽挾脊足少陰貫脊俱經絡二足陽明之筋上循脅屬脊足太陰之筋內者著於脊足少陰之筋循脊內手陽明之筋支者挾脊俱經絡四督脈貫脊經絡二十七背者胸中之府疾病九十一邪在小腸者屬於脊針刺四十七膂足太陽入循膂經絡二足少陰之筋挾膂上項經絡四督脈之別挾膂貫膂經絡五腰足太陽抵腰中經絡二足少陰之別貫腰經絡五督脈挾脊抵腰中經絡二十七腰者腎之府疾病九十一脅肋部腋足少陽直者下腋手太陰橫出腋下手少陰下出腋下手厥陰上抵腋下俱經絡二手太陽之正入腋走心手少陰之正別入淵腋兩筋之間手心主之正別下淵腋三寸入胸中手太陰之正別入淵腋少陰之前入走肺俱經絡三足太陽之筋支者從腋後外廉入腋下足少陽之筋其直者上走腋前廉手太陽之筋入結於腋下俱經絡四脾之大絡名大包出淵腋下三寸經絡五上焦布胸中走腋經絡二十三脅足少陽循脅裡直者過季脅手厥陰出脅足厥陰布脅肋俱經絡二足陽明之筋上循脅手太陰之筋下抵季脅手厥陰之筋前後挾脅俱經絡四脾之大絡布脅經絡五肋足太陰之筋循腹裡結於肋經絡四四肢部四肢四肢皆稟氣於胃而不得至經必因於脾乃得稟也疾病十三四肢者諸陽之本也疾病十二手大指手太陰出手大指端經絡二手食指手太陰支者直出次指內廉出其端手陽明起大指次指端俱經絡二手中指手厥陰循中指出其端經絡二手名指手厥陰支者循小指次指出其端手少陽起手小指次指之端俱經絡二手小指手太陽起小指之端手少陰循小指之內出其端俱經絡二手掌手太陰之別直入掌中經絡五手少陰抵掌後銳骨之端入掌內後廉手厥陰入掌中俱經絡二手腕手太陰從腕後手太陽循手外側上腕手少陽循手表俱經絡二手太陽之筋結於腕手少陽之筋結於腕手陽明之筋結於腕俱經絡四手太陰之別名列缺起腕上手少陰之別名通里去腕寸半別而上行手心主之別名內關去腕二寸出兩筋間手太陽之別名支正上腕五寸內注少陰手陽明之別名偏歷去腕三寸入太陰手少陽之別名外關去腕二寸外繞臂俱經絡五合谷手陽明出合谷兩骨間經絡二寸口手太陰之筋循大指上行結於魚後行寸口外側經絡四手踝手太陽循手外側出踝中經絡二肘手太陽出肘內側兩筋之間手陽明入肘外廉手少陽上貫肘手太陰行心主之前下肘中手少陰下肘內俱經絡二手太陽之筋結於肘內銳骨之後彈之應小指之上手厥陰之筋與太陰並行給於肘內廉俱經絡四臂手太陽循臂骨下廉手陽明循臂上廉手少陽出臂外兩骨之間手太陰循臂內手少陰循臂內後廉手厥陰下臂行兩筋之間俱經絡二手厥陰之筋上臂陰其支者結於臂經絡四臑手太陽上循臑外後廉手陽明上臑外前廉手少陽循臑外手太陰下循臑內手少陰下循臑內後廉手厥陰循臑內行太陰少陰之間俱經絡二足陽氣起於足五指之表陰脈者集於足下而聚於足心陰氣起於五指之裡集於膝下而聚於膝上疾病三十四足大指足太陰起於大指之端循內側足陽明支者入大指出其端足少陽支者別跗上入大指之間出其端還貫爪甲出三毛足厥陰起大指叢毛之際俱經絡二手少陽三焦下腧在於足大指之前少陽之後經絡十六衝脈入足大指經絡十三足中指足陽明入中指內間其支者入外間經絡二足陽明之筋起於中三指經絡四足名指足少陽入小指次指之間經絡二足少陽之筋起於小指次指經絡四足小指足太陽循京骨至小指外側足少陰之脈起於小指之下邪走足心俱經絡二足太陽之筋起於足小指經絡四足心足少陰邪走足心經絡二衝脈入足下經絡十三足本節足太陰之別名公孫去本節後一寸走陽明經絡五足跗足陽明下足跗足少陽循足跗上足厥陰上循足跗上廉俱經絡二足陽明之筋結於跗上經絡四衝脈別者出跗屬上下經絡十三足跟足太陽之筋上循跟經絡四足少陰循內踝之後別入跟中經絡二踵足太陽之筋循足外踝結於踵足少陰並足太陰之筋結於踵俱經絡四內踝足太陰上內踝前廉足厥陰上踝八寸交出太陰之後俱經絡二足太陰之筋上結於內踝足厥陰之筋上結於內踝之前足少陰之筋並足太陰之筋邪走內踝之下俱經絡四足少陰之別名大鐘當踝後繞跟走太陽足厥陰之別名蠡溝去內踝五寸走少陽俱經絡五衝脈並少陰之經下入內踝之後經絡十三蹺脈上內踝之上經絡二十八外踝足太陽出外踝之後足少陽下出外踝之前俱經絡二足太陽之筋上結於踝足少陽之筋上結外踝俱經絡四足太陽之別名飛陽去踝七寸別走少陰足少陽之別名光明去踝五寸走厥陰足陽明之別名豐隆去踝八寸走太陰俱經絡五足脛足陽明循脛外廉足太陰循脛骨後俱經絡二足厥陰之別循脛經絡五足少陽之筋上循脛外廉經絡四衝脈循脛骨內廉溫足脛經絡十三衝脈下者伏行骭骨內針刺二十腨足太陽下貫腨內足少陰上腨內俱經絡二足太陽之筋別者結於腨外經絡四三焦下腧上踝五寸別入貫腨腸經絡十六膝足陽明下膝臏中足太陰上膝股內前廉足少陽出膝外廉俱經絡二足太陽之筋自外踝邪上結於膝足陽明之筋上結於膝外廉俱經絡四膝者筋之府疾病九十一輔骨足少陽下外輔骨之前經絡二足陽明之筋其支者結於外輔骨合少陽足太陰之筋直者絡於膝內輔骨足少陰之筋與太陽之筋合而上結於內輔之下足少陽之筋支者別起外輔骨足厥陰之筋上結內輔之下俱經絡四膕中足太陽從後廉下合膕中足少陰出膕內廉足厥陰上膕內廉俱經絡二足太陽之正別入於膕中經絡三足太陽之筋結於膕經絡四三焦下腧出膕中外廉經絡十六衝脈邪入膕中經絡十三上廉下廉足陽明下三里三寸為巨虛上廉復下上廉三寸為巨虛下廉大腸屬上小腸屬下足陽明胃脈也經絡十六大腸合於巨虛上廉小腸合於巨虛下廉針刺二十四伏兔足陽明之筋直者上循伏兔足少陽之筋前者結於伏兔之上俱經絡四股足少陰上股內後廉足厥陰循股陰俱經絡二足太陰之筋上循陰股足少陰之筋並太陰之筋而上循陰股俱經絡四衝脈循陰股內廉經絡十三髀足太陽過髀樞循髀外足少陽橫入髀厭中以下循髀陽俱經絡二足陽明之正上至髀足太陰之正上至髀足少陽之正繞髀俱經絡三足少陽之筋其支者上走髀足陽明之筋結於髀樞其直者上結於髀足太陰之筋上結於髀俱經絡四節諸筋者皆屬於節經絡二十一溪北方黑色入通於腎故病在溪藏象四四末四末陰陽之會者此氣之大絡也經絡十三陽受氣於四末針刺二十八四街四街者氣之徑路也經絡十三皮毛肌肉部皮毛西方生燥在體為皮毛藏象五肺者氣之本其華在毛其充在皮藏象二肺之合皮也其榮毛也藏象八審平之紀其養皮毛運氣十三肺合大腸大腸者皮其應腎合三焦膀胱三焦膀胱者腠理毫毛其應俱藏象二十八發腎者主蟄封藏之本其華在發藏象二腎之合骨也其榮發也藏象八肌三焦膀胱者倉廩之本其華在唇四白其充在肌藏象二肉脾之合肉也藏象八中央生濕在體為肉藏象五備化之紀其養肉運氣十三脾合胃胃者肉其應藏象二十八筋骨血脈部筋爪東方生風在體為筋藏象五敷和之紀其養筋運氣十三足厥陰絡諸筋經絡四肝之合筋也其榮爪也藏象八肝者罷極之本其華在爪其充在筋藏象二肝合膽膽者筋其應藏象十八筋者聚於陰器而脈絡於舌本疾病九十五骨北方生寒在體為骨藏象五腎者主蟄封藏之本其充在骨藏象二腎之合骨也藏象八靜順之紀其養在骨髓運氣十三骨者髓之府疾病類九十一血脈心者生之本其充在血脈藏象二心之合脈也藏象八南方生熱在體為脈藏象五升明之紀其養血運氣十三心合小腸小腸者脈其應藏象二十八臟腑部肺審平從革堅成之紀其臟肺運氣十三手太陰屬肺手陽明絡肺手少陰上肺足少陰直者入肺中足厥陰上注肺俱經絡二諸氣者皆屬於肺經絡二十一肺者氣之本藏象二脾氣散精上歸於肺藏象十二大腸手陽明屬大腸手太陰下絡大腸俱經絡二足太陰之別者入絡腸胃經絡五胃足陽明屬胃足太陰絡胃手太陽抵胃足厥陰挾胃手太陰循胃口俱經絡二手太陰之筋散貫賁經絡四大腸小腸皆屬於胃經絡十六足太陰脈貫胃屬脾疾病十三脾備化卑監敦阜之紀其臟脾運氣十三足太陰屬脾足陽明絡脾俱經絡二心升明伏明赫曦之紀其髒心運氣十三手少陰起心中出屬心系手太陽絡心足太陰支者注心中足少陰支者絡心俱經絡二足太陽之正其一道循膂當心入散足少陽之正貫心足陽明之正上通於心俱經絡三手心主之別絡心系經絡五督脈上貫心經絡二十七足太陽背俞注於心疾病六十六諸血者皆屬於心經絡二十一小腸手太陽屬小腸手少陰絡小腸俱經絡二足太陰之別者入絡腸胃經絡五膀胱足太陽屬膀胱足少陰絡膀胱俱經絡二三焦下腧並太陽之正入絡膀胱約下焦經絡十六三焦合入於委陽針刺二十四腎靜順涸流流衍之紀其臟腎運氣十三足少陰屬腎足太陽絡腎俱經絡二足少陰之正別走太陽而合上至腎經絡三腎合三焦膀胱藏象二十八衝脈者十二經之海也與少陰之大絡起於腎下經絡十三衝脈下者注少陰之大絡針刺二十胞絡者繫於腎疾病六十二心包絡手厥陰屬心包絡手少陽散絡心包俱經絡二足少陰之別者上走心包經絡五三焦手少陽屬三焦手厥陰絡三焦俱經絡二三焦下腧在於足大指之前少陽之後出於膕中外廉名曰委陽是太陽絡也手少陽經也三焦者足少陽太陽之所將太陽之別也經絡十六手太陰之脈起中焦經絡二膽足少陽屬膽足厥陰絡膽俱經絡二肝敷和委和發生之紀其臟肝運氣十三足厥陰屬肝足少陽絡肝足少陰上貫肝膈俱經絡二足少陽別者散之上肝經絡三前後陰部二陰北方黑色入通於腎開竅於二陰藏象四靜順之紀其主二陰運氣十三陰器足厥陰過陰器經絡二足厥陰脈循陰器而絡於肝疾病三十九足陽明之筋聚於陰器足太陰之筋直者聚於陰器足少陰之筋並太陰之筋而上結於陰器足厥陰之筋結於陰器俱經絡四足厥陰之別者循脛上睪結於莖經絡五任脈者起於中極之下以上毛際督脈起於少腹以下骨中央女子入系廷孔其絡循陰器合篡間繞篡後其男子循莖下至篡與女子等俱經絡二十七蹺脈循陰股入陰經絡二十八前陰者宗筋之所聚太陰陽明之所合也疾病三十四衝脈者經脈之海也主滲灌溪谷與陽明合於宗筋陰陽總宗筋之會會於氣街而陽明為之長疾病七十一毛際足厥陰入毛中足少陽出氣街繞毛際俱經絡二足少陽之正入毛際合於厥陰經絡三睪足厥陰別者上睪經絡五邪在小腸者連睪系針刺四十七臀足太陽貫臀經絡二足太陽之筋上結於臀經絡四督脈別繞臀經絡二十七肛足太陽之正下尻五寸別入於肛經絡三尻足少陽之筋後者結於尻經絡四
